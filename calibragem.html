<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Calibragem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface2:#EAEFED; --ink:#18252B; --muted:#5E6E73; --line:#D5DDDA;
  --accent:#0E6A78; --accent-ink:#FFFFFF; --accent-soft:#DCEEF0;
  --ok:#1F8A4C; --ok-soft:#DDF2E4; --warn:#B7791F; --warn-soft:#FBEFD6; --crit:#C0392B; --crit-soft:#F8E0DC;
  --plate:#FFFFFF; --plate-band:#1F4AA8;
  --shadow:0 1px 2px rgba(20,40,45,.06),0 4px 14px rgba(20,40,45,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#11181B; --surface:#182226; --surface2:#1F2B30; --ink:#E4ECEB; --muted:#93A4A8; --line:#2C3A3F;
  --accent:#3FB3C2; --accent-ink:#0B1A1D; --accent-soft:#16373D;
  --ok:#4CC27E; --ok-soft:#173526; --warn:#E3AA4D; --warn-soft:#3A2E17; --crit:#EE7466; --crit-soft:#3E1F1B;
  --plate:#EEF2F1; --plate-band:#2F5FC4; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11181B; --surface:#182226; --surface2:#1F2B30; --ink:#E4ECEB; --muted:#93A4A8; --line:#2C3A3F;
  --accent:#3FB3C2; --accent-ink:#0B1A1D; --accent-soft:#16373D;
  --ok:#4CC27E; --ok-soft:#173526; --warn:#E3AA4D; --warn-soft:#3A2E17; --crit:#EE7466; --crit-soft:#3E1F1B;
  --plate:#EEF2F1; --plate-band:#2F5FC4; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.on{background:var(--ok)} .dot.off{background:var(--crit)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
h2{font-size:15px;margin:0 0 12px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.field{display:flex;flex-direction:column;margin-bottom:14px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 11px;width:100%}
input#placa{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:18px;letter-spacing:.12em;text-transform:uppercase}
.hint{font-size:12.5px;min-height:20px;margin-top:6px;color:var(--muted)}
.hint.ok{color:var(--ok)} .hint.bad{color:var(--crit)}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:10px 16px;border-radius:7px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{margin-top:12px;padding:10px 12px;border-radius:7px;font-size:13px}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--crit-soft);color:var(--crit)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
.plate{display:inline-flex;flex-direction:column;border:1.5px solid #2B3438;border-radius:4px;overflow:hidden;background:var(--plate);color:#111;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;line-height:1;min-width:84px;text-align:center}
.plate::before{content:"BRASIL";display:block;background:var(--plate-band);color:#fff;font-size:6.5px;letter-spacing:.2em;padding:2px 0;font-family:"IBM Plex Sans",sans-serif}
.plate span{padding:3px 6px 4px;font-size:13px;letter-spacing:.08em}
.vinfo{display:flex;gap:12px;align-items:center;margin:4px 0 14px;padding:10px;border-radius:8px;background:var(--surface2)}
.vinfo .meta{font-size:13px}
.vinfo .meta b{display:block}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface2)}
th.wk{text-align:center;min-width:92px} th.wk small{display:block;white-space:nowrap;text-transform:none;letter-spacing:0;font-weight:400}
th.wk.now{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
td.cell{text-align:center}
.chip{display:inline-flex;align-items:center;gap:4px;border:0;font:inherit;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);cursor:pointer;margin:1px}
.chip:hover{filter:brightness(.95)}
.pend{font-size:12px;color:var(--muted)}
.pend.late{color:var(--crit);font-weight:600}
.pend.fut{opacity:.4}
.pct{font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.toolbar .field{margin:0;min-width:160px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.sum{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.sum:hover{border-color:var(--accent)}
.sum .n{font-size:12px;color:var(--muted);font-weight:600}
.sum .v{font-size:20px;font-weight:700;margin-top:2px}
.bar{height:5px;background:var(--surface2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.sum.warn .bar i{background:var(--warn)} .sum.crit .bar i{background:var(--crit)}
.fil{margin-bottom:18px;padding:0;overflow:hidden}
.fil header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.fil header h3{margin:0;font-size:15px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.crit{background:var(--crit-soft);color:var(--crit)}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:14px 0;text-align:center}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,20,25,.45)}
.confirm{margin-top:12px;padding:10px;border-radius:7px;background:var(--crit-soft);color:var(--crit);font-size:13px}
.hist td{font-size:13px}
@media (prefers-reduced-motion:no-preference){.chip,.sum{transition:filter .15s,border-color .15s}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Controle de Calibragem</h1>
      <p class="sub">Gestão de Pneus · semanas de domingo a sábado, divididas por mês · <span id="fleetCount"></span></p>
    </div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connTxt">Conectando à base…</span><button type="button" class="btn ghost sm" id="btnRefresh">Atualizar</button></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-registrar" aria-selected="true" data-tab="registrar">Registrar calibragem</button>
    <button role="tab" id="tab-filiais" aria-selected="false" data-tab="filiais">Tabela por filial</button>
  </nav>

  <!-- ABA REGISTRAR -->
  <section id="view-registrar">
    <div class="grid2">
      <form class="panel" id="formCal" autocomplete="off">
        <h2>Nova calibragem</h2>
        <div class="field">
          <label for="placa">Placa</label>
          <input id="placa" maxlength="8" placeholder="ABC1D23" list="placasList" required>
          <datalist id="placasList"></datalist>
          <div class="hint" id="placaHint">Digite a placa do veículo.</div>
        </div>
        <div id="vinfo"></div>
        <div class="field">
          <label for="data">Data da calibragem</label>
          <input id="data" type="date" required>
          <div class="hint" id="dataHint"></div>
        </div>
        <div class="field">
          <label for="resp">Seu nome</label>
          <input id="resp" maxlength="40" placeholder="Quem fez a calibragem / lançamento">
        </div>
        <div class="field" id="pinWrap" hidden>
          <label for="pin">Senha de lançamento</label>
          <input id="pin" type="password" maxlength="20">
        </div>
        <button class="btn" id="btnSalvar" type="submit" disabled>Confirmar calibragem</button>
        <div id="formMsg"></div>
      </form>

      <div class="panel">
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <h2 style="margin:0">Últimos registros</h2>
          <input id="buscaHist" placeholder="Filtrar placa ou filial" style="max-width:220px">
        </div>
        <div class="table-wrap">
          <table class="hist">
            <thead><tr><th>Placa</th><th>Filial</th><th>Data</th><th>Semana</th><th>Lançado por</th><th></th></tr></thead>
            <tbody id="histBody"><tr><td colspan="6" class="empty">Carregando…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- ABA FILIAIS -->
  <section id="view-filiais" hidden>
    <div class="toolbar">
      <div class="field"><label>Mês</label><div class="row" style="flex-wrap:nowrap"><button type="button" class="btn ghost sm" id="btnAnt" aria-label="Mês anterior">◀</button><strong id="semRef" style="min-width:110px;text-align:center"></strong><button type="button" class="btn ghost sm" id="btnProx" aria-label="Próximo mês">▶</button><button type="button" class="btn ghost sm" id="btnAtual">Mês atual</button></div></div>
      <div class="field"><label for="filtroFilial">Filial</label><select id="filtroFilial"><option value="">Todas</option></select></div>
      <div class="field"><label for="filtroStatus">Mostrar</label>
        <select id="filtroStatus"><option value="">Todos os veículos</option><option value="pend">Só com semana pendente</option></select>
      </div>
    </div>
    <p class="muted" style="margin:-6px 0 14px;font-size:12.5px" id="legenda"></p>
    <div class="sumgrid" id="sumgrid"></div>
    <div id="filiais"></div>
  </section>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 style="margin-bottom:4px">Corrigir calibragem</h2>
    <p class="muted" style="margin:0 0 14px;font-size:13px" id="dlgInfo"></p>
    <div class="field">
      <label for="dlgPlaca">Placa</label>
      <input id="dlgPlaca" maxlength="8" style="font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em">
      <div class="hint" id="dlgPlacaHint"></div>
    </div>
    <div class="field">
      <label for="dlgData">Data</label>
      <input id="dlgData" type="date">
    </div>
    <div id="dlgMsg"></div>
    <div id="dlgConfirm" hidden class="confirm">
      Excluir este registro? Esta ação não pode ser desfeita.
      <div class="row" style="margin-top:8px"><button type="button" class="btn danger sm" id="dlgDelYes">Sim, excluir</button><button type="button" class="btn ghost sm" id="dlgDelNo">Cancelar</button></div>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:16px">
      <button type="button" class="btn ghost" id="dlgDel" style="color:var(--crit);border-color:var(--crit)">Excluir</button>
      <div class="row">
        <button type="button" class="btn ghost" id="dlgCancel">Fechar</button>
        <button type="button" class="btn" id="dlgSave">Salvar correção</button>
      </div>
    </div>
  </form>
</dialog>

/* ---------- datas ---------- */
const pad = n => String(n).padStart(2,"0");
const hojeISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmt = iso => { const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const fmtCurto = iso => { const [,m,d]=iso.split("-"); return `${d}/${m}`; };
const isoDe = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dataDe = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d,12); };
const addDias = (iso,n) => { const d=dataDe(iso); d.setDate(d.getDate()+n); return isoDe(d); };
const inicioSemana = iso => { const d=dataDe(iso); d.setDate(d.getDate()-d.getDay()); return isoDe(d); }; // domingo
const numSemana = iso => { const w=inicioSemana(iso); return Math.ceil(+w.slice(8,10)/7); };
const rotuloSemana = iso => { const w=inicioSemana(iso); return `${numSemana(w)}ª sem ${MESES_[+w.slice(5,7)-1]}`; };
const faixaSemana = iso => { const w=inicioSemana(iso); return `${fmtCurto(w)}–${fmtCurto(addDias(w,6))}`; };

function aplicarVeiculos(lista){

  byPlaca = new Map(VEIC.map(v => [v[0], {placa:v[0], filial:v[1], tipo:v[2]}]));
  filiais = [...new Set(VEIC.map(v => v[1]))].filter(f => f && !EXCLUIR_FILIAIS.includes(f)).sort();
  $("fleetCount").textContent = `${VEIC.length} veículos em ${filiais.length} filiais`;
  $("placasList").innerHTML = VEIC.map(v=>`<option value="${esc(v[0])}">${esc(v[1])}</option>`).join("");

  $("filtroFilial").innerHTML = `<option value="">Todas</option>` + filiais.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join("");

}

/* ---------- validação do formulário ---------- */
function validar(){
  const p = normPlaca($("placa").value); const d = $("data").value;
  const v = byPlaca.get(p); let ok = true;
  if(!p){ $("placaHint").className="hint"; $("placaHint").textContent="Digite a placa do veículo."; $("vinfo").innerHTML=""; ok=false; }
  else if(!v){ $("placaHint").className="hint bad"; $("placaHint").textContent = p.length>=7 ? "Placa não encontrada em Veículos Registrados." : "Placa incompleta."; $("vinfo").innerHTML=""; ok=false; }
  else {
    $("placaHint").className="hint ok"; $("placaHint").textContent="Veículo encontrado.";
    const ult = registros.filter(r=>r.placa===p).sort((a,b)=>b.data.localeCompare(a.data))[0];
    $("vinfo").innerHTML = `<div class="vinfo"><span class="plate"><span>${p}</span></span><div class="meta"><b>${v.filial}</b><span class="muted">${v.tipo||""}${ult?` · última calibragem ${fmt(ult.data)}`:" · sem calibragem registrada"}</span></div></div>`;
    if(EXCLUIR_FILIAIS.includes(v.filial)){ $("placaHint").className="hint bad"; $("placaHint").textContent="Veículo está na SUCATA, não entra no controle."; }
  }
  if(!d){ $("dataHint").className="hint bad"; $("dataHint").textContent="Informe a data."; ok=false; }
  else if(d>hojeISO()){ $("dataHint").className="hint bad"; $("dataHint").textContent="A data não pode ser no futuro."; ok=false; }
  else { $("dataHint").className="hint"; $("dataHint").textContent=`${textoSemana(d)} (${faixaSemana(d)})`; }
  if(ok && registros.some(r=>r.placa===p && r.data===d)){ $("dataHint").className="hint bad"; $("dataHint").textContent="Já existe calibragem desta placa nesta data."; ok=false; }
  if(ok && !$("resp").value.trim()) ok = false;
  $("btnSalvar").disabled = !ok || !online || ocupado;
  return ok ? {p,d,v} : null;
}
$("placa").addEventListener("input",()=>{ $("formMsg").innerHTML=""; validar(); });
$("data").addEventListener("input",()=>{ $("formMsg").innerHTML=""; validar(); });
$("resp").addEventListener("input",()=>{ try{localStorage.setItem("calib_resp",$("resp").value.trim())}catch(e){} validar(); });

function msg(el, cls, txt){ el.innerHTML = `<div class="msg ${cls}"></div>`; el.firstChild.textContent = txt; }

$("formCal").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const r = validar(); if(!r || !online) return;
  ocupado = true; $("btnSalvar").disabled = true; $("btnSalvar").textContent = "Salvando…";
  try{
    await api("add", { registro:{ placa:r.p, data:r.d, filial:r.v.filial, responsavel:$("resp").value.trim() } });
    msg($("formMsg"),"ok",`Calibragem registrada: ${r.p} em ${fmt(r.d)} (${r.v.filial}).`);
    $("placa").value=""; $("vinfo").innerHTML=""; $("placa").focus();
  }catch(e){ msg($("formMsg"),"bad", e.message); }
  ocupado = false; $("btnSalvar").textContent = "Confirmar calibragem"; validar();
});

// Semanas de domingo a sábado. Um mês tem todas as semanas que tocam nele (4 a 6).
// A semana que vira o mês conta como última de um e 1ª do outro.
function semanasDoMes(ym){
  const [y,m] = ym.split("-").map(Number);
  const ini = `${ym}-01`, fim = `${ym}-${pad(new Date(y,m,0).getDate())}`;
  const out = []; for(let w = inicioSemana(ini); w <= fim; w = addDias(w,7)) out.push(w);
  return out;
}
const ymAdd = (ym,n) => { const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const nomeMes = ym => `${MESES_[+ym.slice(5,7)-1]}/${ym.slice(0,4)}`;
// rótulos de uma semana: [{ym, n}] — 1 ou 2 meses
function rotulosSemana(iso){
  const w = inicioSemana(iso), s = addDias(w,6);
  const meses = [...new Set([w.slice(0,7), s.slice(0,7)])];
  return meses.map(ym => ({ym, n: semanasDoMes(ym).indexOf(w)+1}));
}
const textoSemana = iso => rotulosSemana(iso).map(r=>`${r.n}ª sem ${MESES_[+r.ym.slice(5,7)-1]}`).join(" / ");
let refMes = hojeISO().slice(0,7);

function renderFiliais(){

  const mapa = new Map();
  for(const r of registros){ const i = janela.indexOf(inicioSemana(r.data)); if(i<0) continue;
    if(!mapa.has(r.placa)) mapa.set(r.placa, janela.map(()=>[])); mapa.get(r.placa)[i].push(r); }
  const estado = w => addDias(w,6) < INICIO_CONTROLE ? "antes" : w > semHoje ? "futura" : w === semHoje ? "atual" : "passada";
  const iAtual = janela.indexOf(semHoje);
  $("legenda").textContent = `${nomeMes(refMes)} tem ${N} semanas (domingo a sábado). A semana que vira o mês conta nos dois meses. "Atrasada" = semana encerrada sem calibragem. Controle iniciado em ${fmt(INICIO_CONTROLE)}.`;

  const fSel = $("filtroFilial").value, soPend = $("filtroStatus").value==="pend";
  const resumo = []; let html = "";
  for(const f of filiais){
    const vs = VEIC.filter(v=>v[1]===f).map(v=>v[0]).sort();
    let feitos=0, devidos=0, semFeitos=0;
    const linhas = vs.map(p=>{
      const s = mapa.get(p) || janela.map(()=>[]);
      let pend=false, nFeitas=0;
      const cells = s.map((lst,i)=>{
        const st = estado(janela[i]);
        if(st==="passada"||st==="atual"){ devidos++; if(lst.length) feitos++; }
        if(i===iAtual && lst.length) semFeitos++;
        if(lst.length){ nFeitas++; return `<td class="cell">${lst.sort((a,b)=>a.data.localeCompare(b.data)).map(r=>`<button class="chip" data-edit="${esc(r.id)}" title="Clique para corrigir ou excluir">✓ ${fmtCurto(r.data)}</button>`).join("")}</td>`; }
        if(st==="antes") return `<td class="cell"><span class="pend fut" title="Antes do início do controle">—</span></td>`;
        if(st==="passada"){ pend=true; return `<td class="cell"><span class="pend late">atrasada</span></td>`; }
        if(st==="atual"){ pend=true; return `<td class="cell"><span class="pend">pendente</span></td>`; }
        return `<td class="cell"><span class="pend fut">—</span></td>`;
      }).join("");
      return {p, pend, html:`<tr><td><span class="plate"><span>${p}</span></span></td><td class="muted">${esc(byPlaca.get(p).tipo||"")}</td>${cells}<td class="cell"><b>${nFeitas}</b>/${N}</td></tr>`};
    });
    const pctSem = iAtual>=0 && vs.length ? Math.round(semFeitos/vs.length*100) : null;
    const pctMes = devidos ? Math.round(feitos/devidos*100) : null;
    const base = pctSem!==null ? pctSem : pctMes;
    const cls = base===null ? "ok" : base>=90 ? "ok" : base>=60 ? "warn" : "crit";
    resumo.push({f,pctSem,pctMes,cls,semFeitos,n:vs.length});
    if(fSel && fSel!==f) continue;
    const vis = soPend ? linhas.filter(l=>l.pend) : linhas;
    html += `<article class="panel fil"><header><h3>${esc(f)}</h3>
      <div class="row"><span class="muted" style="font-size:12.5px">${vs.length} veículos${pctSem!==null?` · ${semFeitos}/${vs.length} na semana atual`:""}${pctMes!==null?` · ${pctMes}% no mês`:""}</span>
      <span class="tag ${cls}">${base===null?"sem semanas cobradas":(pctSem!==null? base+"% na semana" : base+"% no mês")}</span></div></header>
      <div class="table-wrap"><table><thead><tr><th>Placa</th><th>Tipo</th>
      ${janela.map((w,i)=>{ const outro = rotulosSemana(w).find(r=>r.ym!==refMes);
        return `<th class="wk${w===semHoje?" now":""}">${i+1}ª semana<small>${faixaSemana(w)}</small>${outro?`<small title="Esta semana também conta em ${nomeMes(outro.ym)}">↔ ${outro.n}ª ${MESES_[+outro.ym.slice(5,7)-1]}</small>`:""}</th>`; }).join("")}
      <th class="wk">Total</th></tr></thead><tbody>
      ${vis.length? vis.map(l=>l.html).join("") : `<tr><td colspan="${N+3}" class="empty">Todos os veículos em dia.</td></tr>`}
      </tbody></table></div></article>`;
  }
  $("filiais").innerHTML = html;
  $("sumgrid").innerHTML = resumo.map(r=>{ const v = r.pctSem!==null ? r.pctSem : r.pctMes;
    return `<button class="sum ${r.cls}" data-fil="${esc(r.f)}"><div class="n">${esc(r.f)}</div>
    <div class="v">${v===null?"—":v+"%"}</div><div class="muted" style="font-size:12px">${r.pctSem!==null?`${r.semFeitos}/${r.n} na semana`:"no mês"}${r.pctSem!==null&&r.pctMes!==null?` · mês ${r.pctMes}%`:""}</div>
    <div class="bar"><i style="width:${v||0}%"></i></div></button>`; }).join("");
}
["filtroFilial","filtroStatus"].forEach(id=>$(id).addEventListener("input",renderFiliais));
$("btnAnt").addEventListener("click",()=>{ refMes = ymAdd(refMes,-1); renderFiliais(); });
$("btnProx").addEventListener("click",()=>{ refMes = ymAdd(refMes,1); renderFiliais(); });
$("btnAtual").addEventListener("click",()=>{ refMes = hojeISO().slice(0,7); renderFiliais(); });
$("sumgrid").addEventListener("click",e=>{ const b=e.target.closest("[data-fil]"); if(!b) return; $("filtroFilial").value=b.dataset.fil; renderFiliais(); });

/* ---------- editar / excluir ---------- */
let editId = null;
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-edit]"); if(!b) return;
  const r = registros.find(x=>x.id===b.dataset.edit); if(!r) return;
  editId = r.id;
  $("dlgPlaca").value = r.placa; $("dlgData").value = r.data; $("dlgData").max = hojeISO();
  $("dlgInfo").textContent = `${r.filial} · lançado em ${r.criadoEm? new Date(r.criadoEm).toLocaleString("pt-BR"):"—"}`;
  $("dlgMsg").innerHTML=""; $("dlgPlacaHint").textContent=""; $("dlgConfirm").hidden = true;
  $("dlg").showModal();
});
$("dlgCancel").addEventListener("click",()=>$("dlg").close());
$("dlgPlaca").addEventListener("input",()=>{ const v=byPlaca.get(normPlaca($("dlgPlaca").value)); $("dlgPlacaHint").className="hint "+(v?"ok":"bad"); $("dlgPlacaHint").textContent = v? v.filial : "Placa não encontrada."; });
$("dlgSave").addEventListener("click", async ()=>{
  const p = normPlaca($("dlgPlaca").value), d = $("dlgData").value, v = byPlaca.get(p);
  if(!v) return msg($("dlgMsg"),"bad","Placa não encontrada em Veículos Registrados.");
  if(!d || d>hojeISO()) return msg($("dlgMsg"),"bad","Informe uma data válida (não futura).");
  if(registros.some(r=>r.id!==editId && r.placa===p && r.data===d)) return msg($("dlgMsg"),"bad","Já existe calibragem desta placa nesta data.");
  $("dlgSave").disabled = true;
  try{ await api("edit", { id:editId, registro:{ placa:p, data:d, filial:v.filial } }); $("dlg").close(); }
  catch(e){ msg($("dlgMsg"),"bad",e.message); }
  $("dlgSave").disabled = false;
});
$("dlgDel").addEventListener("click",()=>{ $("dlgConfirm").hidden=false; });
$("dlgDelNo").addEventListener("click",()=>{ $("dlgConfirm").hidden=true; });
$("dlgDelYes").addEventListener("click", async ()=>{
  $("dlgDelYes").disabled = true;
  try{ await api("del", { id:editId }); $("dlg").close(); }
  catch(e){ msg($("dlgMsg"),"bad",e.message); }
  $("dlgDelYes").disabled = false;
});

/* ---------- dados (Google Sheets via Apps Script) ---------- */
function aplicarDados(res){
  aplicarVeiculos(res.veiculos);
  registros = (res.registros||[]).filter(r=>r && r.id && r.placa && /^\d{4}-\d{2}-\d{2}$/.test(r.data));
  online = true; conn("on",`Base conectada · ${registros.length} registros · ${new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`);
  renderAll();
}
async function carregar(){
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)){ conn("off","Base não configurada: falta a URL do Apps Script no arquivo."); return; }
  try{
    const r = await fetch(API_URL + "?t=" + Date.now(), {cache:"no-store"});
    const res = await r.json(); if(!res.ok) throw new Error(res.erro||"erro");
    aplicarDados(res);
  }catch(e){ online=false; conn("off","Sem conexão com a base. Verifique a internet e clique em Atualizar."); validar(); }
}
async function api(acao, dados){
  let res;
  try{
    const r = await fetch(API_URL, { method:"POST", body: JSON.stringify({ acao, pin:$("pin").value, ...dados }) });
    res = await r.json();
  }catch(e){ throw new Error("Não foi possível falar com a base. Verifique a internet e tente de novo."); }
  if(!res.ok){
    if(/PIN/i.test(res.erro||"")){ $("pinWrap").hidden = false; throw new Error("Senha de lançamento incorreta ou não informada. Preencha o campo Senha e tente de novo."); }
    if(res.veiculos) aplicarDados(res);
    throw new Error(res.erro || "A base recusou a operação.");
  }
  aplicarDados(res);
  return res;
}
function renderAll(){ renderHist(); if(!$("view-filiais").hidden) renderFiliais(); validar(); }
$("btnRefresh").addEventListener("click", carregar);
setInterval(()=>{ if(!document.hidden && !ocupado && !$("dlg").open) carregar(); }, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) carregar(); });
renderFiliais(); renderHist(); carregar();
</script>
