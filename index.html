      <nav>
        <div class="nav-label">Painéis</div>
        <div class="nav-list">
          ${PANELS.map((p) => `<button class="nav-btn ${state.panel === p.key ? "active" : ""}" data-panel="${p.key}">
            <span class="nav-icon">${ICONS[p.icon]}</span>${p.label}
            <span class="nav-count mono">${counts[p.key]}</span>
          </button>`).join("")}
        </div>
      </nav>
      <div class="sidebar-foot">Dados consolidados manualmente a partir dos relatórios da operação. Fale com o time de frota para solicitar uma atualização.</div>`;
  }

  // ------------------------------------------------------------------
  // Render + eventos
  // ------------------------------------------------------------------
  function render() {
    // Todo clique (quadro, barra, filial, etc.) passa por aqui, e recriar o innerHTML de
    // #main/#sidebar do zero reseta a rolagem (a página "sobe" sozinha — bug reportado pelo
    // Joao, 2026-09-14). Guarda a posição da janela e da sidebar antes, restaura depois.
    const scrollY = window.scrollY;
    const sidebarEl = document.getElementById("sidebar");
    const sidebarScroll = sidebarEl ? sidebarEl.scrollTop : 0;

    sidebarEl.innerHTML = sidebarHtml();
    const main = document.getElementById("main");
    if (state.panel === "vazias") main.innerHTML = renderVaziasPanel();
    else if (state.panel === "inspecoes") main.innerHTML = renderInspecoesPanel();
    else if (state.panel === "sulco") main.innerHTML = renderSulcoPanel();
    else if (state.panel === "plano") main.innerHTML = renderPlanoPanel();
    else main.innerHTML = renderPressaoPanel();

    bindNav();
    bindToolbar();
    bindSortHeaders();
    bindSulcoRows();
    bindVaziasRows();
    bindPressaoForaRows();
    bindPlano();
    drawCharts();

    window.scrollTo(0, scrollY);
    if (sidebarEl) sidebarEl.scrollTop = sidebarScroll;
  }

  function bindVaziasRows() {
    document.querySelectorAll(".vazias-row").forEach((tr) => tr.addEventListener("click", () => {
      const p = tr.getAttribute("data-placa");
      state.selVeiculoVazias = state.selVeiculoVazias === p ? null : p;
      render();
    }));
  }

  function bindSulcoRows() {
    document.querySelectorAll(".sulco-row").forEach((tr) => tr.addEventListener("click", () => {
      const v = tr.getAttribute("data-veiculo");
      state.selVeiculoSulco = state.selVeiculoSulco === v ? null : v;
      render();
    }));
  }

  function bindPressaoForaRows() {
    document.querySelectorAll(".pressao-fora-row").forEach((tr) => tr.addEventListener("click", () => {
      const v = tr.getAttribute("data-veiculo");
      state.selVeiculoPressao = state.selVeiculoPressao === v ? null : v;
      render();
    }));
  }

  function bindNav() {
    document.querySelectorAll(".nav-btn").forEach((btn) => btn.addEventListener("click", () => {
      state.panel = btn.getAttribute("data-panel");
      state.filtroFilial = "all"; state.busca = ""; state.selFiliais.clear(); state.inspMes = null;
      state.sortKey = null; state.sortDir = 1; state.selVeiculoSulco = null; state.selVeiculoVazias = null;
      state.selVeiculoPressao = null;
      state.planoView = "lista"; state.planoSel = null; state.planoDraft = null; state.planoFormErro = "";
      state.pressaoFiltroSel.clear(); state.pressaoFaixaSel.clear(); state.inspGeralFaixaSel.clear();
      state.sidebarOpen = false;
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("overlay").classList.remove("open");
      render();
    }));
  }

  function bindToolbar() {
    const selF = document.getElementById("ctl-filial");
    if (selF) selF.addEventListener("change", () => { state.filtroFilial = selF.value; state.selFiliais.clear(); state.pressaoFiltroSel.clear(); state.pressaoFaixaSel.clear(); state.inspGeralFaixaSel.clear(); render(); });
    const inputB = document.getElementById("ctl-busca");
    if (inputB) inputB.addEventListener("input", () => {
      state.busca = inputB.value;
      const caret = inputB.selectionStart;
      render();
      const newInputB = document.getElementById("ctl-busca");
      if (newInputB) {
        newInputB.focus();
        newInputB.setSelectionRange(caret, caret);
      }
    });
    document.querySelectorAll(".seg-btn[data-round]").forEach((btn) => btn.addEventListener("click", () => {
      state.inspRound = btn.getAttribute("data-round"); state.selFiliais.clear(); state.inspGeralFaixaSel.clear(); render();
    }));
    const selMes = document.getElementById("ctl-mes-insp");
    if (selMes) selMes.addEventListener("change", () => { state.inspMes = selMes.value; state.selFiliais.clear(); state.inspGeralFaixaSel.clear(); render(); });
    const selMesPressao = document.getElementById("ctl-mes-pressao");
    if (selMesPressao) selMesPressao.addEventListener("change", () => {
      state.pressaoMes = selMesPressao.value; state.selFiliais.clear(); state.pressaoFiltroSel.clear(); state.pressaoFaixaSel.clear(); render();
    });
    document.querySelectorAll(".seg-btn[data-sulco-filter]").forEach((btn) => btn.addEventListener("click", () => {
      const modo = btn.getAttribute("data-sulco-filter");
      state.sulcoSoTrocar = modo === "trocar";
      state.sulcoTodos = modo === "veiculos";
      state.selVeiculoSulco = null; render();
    }));
    document.querySelectorAll(".seg-btn[data-pressao-todos]").forEach((btn) => btn.addEventListener("click", () => {
      state.pressaoTodos = !state.pressaoTodos; state.selVeiculoPressao = null; render();
    }));
    document.querySelectorAll(".seg-btn[data-pressao-round]").forEach((btn) => btn.addEventListener("click", () => {
      state.pressaoRound = btn.getAttribute("data-pressao-round"); state.selFiliais.clear(); state.pressaoFiltroSel.clear(); state.pressaoFaixaSel.clear(); render();
    }));
    document.querySelectorAll("[data-quadro]").forEach((card) => card.addEventListener("click", (ev) => {
      togglePressaoQuadro(card.getAttribute("data-quadro"), ev.ctrlKey || ev.metaKey);
    }));
    const clearBtn = document.getElementById("clear-sel");
    if (clearBtn) clearBtn.addEventListener("click", () => { state.selFiliais.clear(); render(); });
    const clearQuadroBtn = document.getElementById("clear-quadro-sel");
    if (clearQuadroBtn) clearQuadroBtn.addEventListener("click", (ev) => { ev.stopPropagation(); state.pressaoFiltroSel.clear(); render(); });
    const clearFaixaBtn = document.getElementById("clear-faixa-sel");
    if (clearFaixaBtn) clearFaixaBtn.addEventListener("click", (ev) => { ev.stopPropagation(); state.pressaoFaixaSel.clear(); render(); });
    const clearInspFaixaBtn = document.getElementById("clear-insp-faixa-sel");
    if (clearInspFaixaBtn) clearInspFaixaBtn.addEventListener("click", (ev) => { ev.stopPropagation(); state.inspGeralFaixaSel.clear(); render(); });
  }

  // Clique numa barra: seleciona só ela (ou desmarca se já era a única selecionada).
  // Ctrl/Cmd+clique: alterna essa filial dentro da seleção, mantendo as demais (soma).
  function toggleFilialSelection(filial, multi) {
    if (multi) {
      if (state.selFiliais.has(filial)) state.selFiliais.delete(filial);
      else state.selFiliais.add(filial);
    } else {
      if (state.selFiliais.size === 1 && state.selFiliais.has(filial)) state.selFiliais.clear();
      else { state.selFiliais.clear(); state.selFiliais.add(filial); }
    }
    render();
  }

  function drawCharts() {
    if (state.panel === "vazias") {
      const d = computeVazias();
      renderBarChart("chart-vazias-bar", d.barData, "veiculos", state.selFiliais, toggleFilialSelection, "var(--chart1)", { percent: false });
      renderDonut("chart-vazias-pie", d.pieData);
    } else if (state.panel === "inspecoes") {
      const d = computeInspecoes();
      if (d.geral || d.disponivel !== false) renderBarChart("chart-insp-bar", d.barData, "veiculos", state.selFiliais, toggleFilialSelection, "var(--chart2)", { percent: false });
      if (d.geral) renderDonut("chart-insp-pie", d.pieData, state.inspGeralFaixaSel, toggleInspGeralFaixa);
    } else if (state.panel === "sulco") {
      const d = computeSulco();
      renderBarChart("chart-sulco-bar", d.barData, "pneus", state.selFiliais, toggleFilialSelection, "var(--danger)", { percent: false });
    } else if (state.panel === "pressao") {
      const d = computePressao();
      renderStackedBarChart("chart-pressao-bar", d.barData, FAIXA_PRESSAO_ORDEM.map((k) => ({ key: k, label: FAIXA_PRESSAO_LABEL[k], color: FAIXA_PRESSAO_TONE[k] })), state.selFiliais, toggleFilialSelection);
      renderDonut("chart-pressao-pie", d.pieData, state.pressaoFaixaSel, togglePressaoFaixa);
    }
  }

  document.getElementById("menuBtn").addEventListener("click", () => {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("overlay").classList.add("open");
  });
  document.getElementById("overlay").addEventListener("click", () => {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("open");
  });
  window.addEventListener("resize", drawCharts);

  render();
  planoInit();
})();
</script>
</body>
</html>
