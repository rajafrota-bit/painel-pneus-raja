  // ------------------------------------------------------------------
  // Painel: Sulco Baixo
  // ------------------------------------------------------------------
  // Classificação: <=3mm precisa trocar já; 3,1 a 5mm requer atenção (troca em breve); >5mm ok.
  function tireStatus(sulco) {
    if (sulco == null) return "ok";
    if (sulco <= 3) return "trocar";
    if (sulco <= 5) return "atencao";
    return "ok";
  }
  function tireColor(status) {
    return status === "trocar" ? "var(--danger)" : status === "atencao" ? "var(--warning)" : "var(--text-faint)";
  }
  function tireBg(status) {
    return status === "trocar" ? "var(--danger-bg)" : status === "atencao" ? "var(--warning-bg)" : "var(--surface-2)";
  }
  // Decodifica o código de posição do pneu (ex.: "1LEE", "TDI", "2DE", "ZZZ") em eixo/lado/externo-interno,
  // inferido a partir dos códigos observados na planilha. Códigos não reconhecidos caem em "outro".
  // Decodifica o código de posição em {group, kind, side, io}. NÃO tentamos inferir a ordem
  // física do eixo a partir do número embutido no código (ex.: "1L" vs "2T") — comparando com
  // os prints de referência do sistema de origem, essa ordem numérica não é consistente entre
  // categorias de veículo (ex.: um "T" sem número pode vir ANTES de um "1L"). A ordem física
  // real (dianteira → traseira) é a ordem em que as posições aparecem na planilha de origem,
  // que é a mesma ordem em que os pneus do veículo chegam aqui — por isso a ordenação dos eixos
  // é feita em renderTireDiagram() pela ordem de primeira ocorrência, não por este código.
  function parsePosicao(code) {
    if (code === "ZZZ" || code === "ZZZ1") return { group: "estepe", kind: "spare", side: null, io: null, letter: null, num: null };
    let m = code.match(/^(\d*)L([DE])([EI])$/);
    if (m) return { group: "L" + (m[1] || "0"), kind: "dual", side: m[2], io: m[3], letter: "L", num: m[1] ? Number(m[1]) : null };
    m = code.match(/^(\d*)T([DE])([EI])$/);
    if (m) return { group: "T" + (m[1] || "0"), kind: "dual", side: m[2], io: m[3], letter: "T", num: m[1] ? Number(m[1]) : null };
    m = code.match(/^(\d*)D([DE])$/);
    if (m) return { group: "D" + (m[1] || "0"), kind: "single", side: m[2], io: null, letter: "D", num: m[1] ? Number(m[1]) : null };
    return { group: "outro:" + code, kind: "outro", side: null, io: null, letter: null, num: null };
  }
  // Rótulo do eixo conforme a convenção confirmada por Joao: D = Direcional, T = Tração, L = Livre.
  // Um número antes da letra indica a ordem dentro daquele tipo (ex.: "2D" = 2º Eixo Direcional).
  function axleLabel(g) {
    const names = { D: "Direcional", T: "de Tração", L: "Livre" };
    if (!g.letter) return null;
    return g.num ? `${g.num}º Eixo ${names[g.letter]}` : `Eixo ${names[g.letter]}`;
  }
  function computeSulco() {
    let rows = DATA.sulcoTires;
    if (state.filtroFilial !== "all") rows = rows.filter((t) => t.filial === state.filtroFilial);
    if (state.busca) rows = rows.filter((t) => t.veiculo.toLowerCase().includes(state.busca.toLowerCase()));
    const tires = scopeRows(rows);

    const groupByVeiculo = (list, limit = 5) => {
      const byVeiculo = new Map();
      list.forEach((t) => { if (!byVeiculo.has(t.veiculo)) byVeiculo.set(t.veiculo, []); byVeiculo.get(t.veiculo).push(t); });
      return Array.from(byVeiculo.values()).map((vt) => {
        const flagged = vt.filter((t) => t.sulco != null && t.sulco <= limit).sort((a, b) => a.sulco - b.sulco);
        return {
          veiculo: vt[0].veiculo, filial: vt[0].filial, tipoDesc: vt[0].tipoDesc, odometro: vt[0].odometro,
          tires: vt, flagged, worst: flagged.some((t) => t.sulco <= 3) ? "trocar" : "atencao",
          minSulco: flagged.length ? flagged[0].sulco : Infinity,
        };
      }).filter((v) => v.flagged.length > 0);
    };

    // Botão "Somente ≤3mm": quando ativo, o limite de corte da tabela/KPIs vira 3mm em vez de
    // 5mm — os pneus em atenção (3,1–5mm) continuam calculados abaixo (atencaoCount) para quem
    // quiser ver esse número, só não entram na lista/tabela principal.
    const limit = state.sulcoSoTrocar ? 3 : 5;
    const filtered = groupByVeiculo(tires, limit).sort((a, b) => a.minSulco - b.minSulco);
    const trocarCount = tires.filter((t) => t.sulco != null && t.sulco <= 3).length;
    const atencaoCount = tires.filter((t) => t.sulco != null && t.sulco > 3 && t.sulco <= 5).length;
    const denom = registradosTotal(activeScope());
    const pctFrota = denom ? (filtered.length / denom) * 100 : 0;

    const byFilialMap = new Map();
    groupByVeiculo(rows).filter((v) => v.worst === "trocar").forEach((v) => byFilialMap.set(v.filial, (byFilialMap.get(v.filial) || 0) + 1));
    const barDataVeiculos = Array.from(byFilialMap, ([filial, veiculos]) => {
      const reg = registradosTotal(filial);
      return { filial, veiculos, pct: reg ? (veiculos / reg) * 100 : 0 };
    }).sort((a, b) => b.veiculos - a.veiculos);
    const top = barDataVeiculos[0] || { filial: "—", veiculos: 0, pct: 0 };

    // Eixo Y do gráfico "Sulco Baixo" mostra QUANTIDADE DE PNEUS (não veículos nem %):
    // conta cada pneu individualmente flagado (sulco <= limit) por filial.
    const tireCountMap = new Map();
    rows.filter((t) => t.sulco != null && t.sulco <= limit).forEach((t) => tireCountMap.set(t.filial, (tireCountMap.get(t.filial) || 0) + 1));
    const barData = Array.from(tireCountMap, ([filial, pneus]) => ({ filial, pneus }))
      .sort((a, b) => b.pneus - a.pneus);

    return { filtered, trocarCount, atencaoCount, barData, top, denom, pctFrota };
  }

  function reformaReparoInfo(t) {
    const r = t.reformas || 0, p = t.reparos || 0;
    if (!r && !p) return null;
    const parts = [];
    if (r) parts.push(`R${r}`);
    if (p) parts.push(`C${p}`);
    const title = [r ? `${r} reforma(s)` : "", p ? `${p} reparo(s)` : ""].filter(Boolean).join(" · ");
    return { text: parts.join("·"), title };
  }

  function tireExtrasBadge(t) {
    const info = reformaReparoInfo(t);
    if (!info) return "";
    return `<sup title="${info.title}" style="font-size:8.5px;color:var(--text-faint);margin-left:2px;font-weight:700;">${info.text}</sup>`;
  }

  function tireChip(t) {
    if (t.vazio) {
      return `<div class="tire-chip" style="border-color:var(--danger);background:var(--danger-bg);border-style:dashed;" title="${escapeHtml(t.posicao)} · Posição vazia (sem pneu)">
        <div class="tire-chip-val" style="color:var(--danger);font-size:10px;">VAZIO</div>
        <div class="tire-chip-pos">${escapeHtml(t.posicao)}</div>
      </div>`;
    }
    if (t.semDado) {
      return `<div class="tire-chip" style="border-color:var(--border-strong);background:var(--bg-elev);" title="${escapeHtml(t.posicao)} · Sem dado de sulco para esta posição (provavelmente tem pneu)">
        <div class="tire-chip-val" style="color:var(--text-faint);font-size:12px;">—</div>
        <div class="tire-chip-pos">${escapeHtml(t.posicao)}</div>
      </div>`;
    }
    const status = tireStatus(t.sulco);
    const rr = reformaReparoInfo(t);
    const tituloChip = `${t.posicao} · Pneu ${t.pneu}${t.produto ? ` · ${t.produto}` : ""}`;
    return `<div class="tire-chip" style="border-color:${tireColor(status)};background:${tireBg(status)}" title="${escapeHtml(tituloChip)}">
      <div class="tire-chip-val" style="color:${tireColor(status)}">${t.sulco != null ? t.sulco.toFixed(1) : "—"}</div>
      <div class="tire-chip-pos">${escapeHtml(t.posicao)}</div>
      <div class="tire-chip-pneu" style="white-space:nowrap;">Nº ${escapeHtml(t.pneu)}</div>
      ${rr ? `<div style="font-size:8.5px;color:var(--text-faint);font-weight:700;margin-top:1px;" title="${rr.title}">${rr.text}</div>` : ""}
    </div>`;
  }

  function renderTireDiagram(vehicle) {
    // A Map preserva a ordem de primeira inserção — como vehicle.tires já está na mesma ordem
    // da planilha de origem (confirmada como ordem física dianteira→traseira pelos prints de
    // referência), essa ordem natural é o que usamos para posicionar os eixos, em vez de tentar
    // recalcular a partir do número do código de posição (ver nota em parsePosicao).
    const groups = new Map();
    vehicle.tires.forEach((t) => {
      const p = parsePosicao(t.posicao);
      if (!groups.has(p.group)) groups.set(p.group, { kind: p.kind, letter: p.letter, num: p.num, tires: [] });
      groups.get(p.group).tires.push({ t, p });
    });
    const allGroups = Array.from(groups.values());
    const axleGroups = allGroups.filter((g) => g.kind !== "spare");
    const estepes = allGroups.find((g) => g.kind === "spare");
    const bySide = (g, side, ioOrder) => g.tires.filter((x) => x.p.side === side)
      .sort((a, b) => ioOrder.indexOf(a.p.io) - ioOrder.indexOf(b.p.io)).map((x) => x.t);

    const axles = axleGroups.map((g) => {
      if (g.kind === "outro") {
        return `<div class="axle-row">
          <div class="axle-tiers" style="justify-content:center;">${g.tires.map((x) => tireChip(x.t)).join("")}</div>
        </div>`;
      }
      const label = axleLabel(g);
      const left = g.kind === "single" ? g.tires.filter((x) => x.p.side === "E").map((x) => x.t) : bySide(g, "E", ["E", "I"]);
      const right = g.kind === "single" ? g.tires.filter((x) => x.p.side === "D").map((x) => x.t) : bySide(g, "D", ["I", "E"]);
      return `<div class="axle-row">
        ${label ? `<div class="axle-label">${escapeHtml(label)}</div>` : ""}
        <div class="axle-tiers">
          <div class="axle-side left">${left.map(tireChip).join("")}</div>
          <div class="axle-side">${right.map(tireChip).join("")}</div>
        </div>
      </div>`;
    }).join("");

    const estepesHtml = estepes ? `
      <div class="axle-estepes">
        <div class="axle-label" style="margin-bottom:8px;">Estepes</div>
        <div class="axle-tiers" style="justify-content:center;">${estepes.tires.map((x) => tireChip(x.t)).join("")}</div>
      </div>` : "";

    return `<div class="tire-diagram">${axles}${estepesHtml}</div>`;
  }

  function renderSulcoDetail(d) {
    const v = state.selVeiculoSulco ? d.filtered.find((x) => x.veiculo === state.selVeiculoSulco) : null;
    if (!v) {
      return `<div class="card detail-card">
        <div class="card-title">Esquema do veículo</div>
        <div class="detail-empty">Clique numa linha da tabela para ver em qual posição está o pneu com sulco baixo.</div>
      </div>`;
    }
    const worstColor = v.worst === "trocar" ? "var(--danger)" : "var(--warning)";
    return `<div class="card detail-card">
      <div class="detail-plate-label">Veículo selecionado</div>
      <div class="detail-plate">${escapeHtml(v.veiculo)}</div>
      <div class="detail-sub">${escapeHtml(filialSigla(v.filial))} — ${escapeHtml(filialFullName(v.filial))} · ${escapeHtml(v.tipoDesc)}${v.odometro ? ` · ${fmtInt(v.odometro)} km` : ""}</div>
      ${severityPill(v.worst === "trocar" ? "danger" : "warning", v.worst === "trocar" ? `${v.flagged.filter((t) => t.sulco <= 3).length} pneu(s) para trocar` : "pneu(s) em atenção")}
      <div class="card-title" style="margin-top:18px;">Esquema do veículo <span style="color:${worstColor}">· ${escapeHtml(v.tipoDesc)}</span></div>
      ${renderTireDiagram(v)}
      <div class="table-note" style="padding-left:0;">Números em cada pneu = sulco atual (mm). <span style="color:var(--danger)">Vermelho</span> ≤ 3mm (trocar) · <span style="color:var(--warning)">amarelo</span> 3,1–5mm (atenção). Sobrescrito ao lado do nº do pneu: <sup style="font-weight:700;">R</sup>=reformas, <sup style="font-weight:700;">C</sup>=reparos.</div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // Esquema do veículo para o painel de Posições Vazias
  // ------------------------------------------------------------------
  // DATA.vazias só traz as posições SEM pneu — não a lista completa de pneus do veículo.
  // Quando o mesmo veículo aparece em DATA.sulcoTires (pneu com sulco baixo em algum lugar),
  // aproveitamos essa lista completa de posições reais para desenhar o esquema. Quando não
  // aparece, buscamos o layout típico (mesmo conjunto de posições) de outros veículos do
  // mesmo tipo (tipoCod) já presentes em DATA.sulcoTires, para desenhar o esquema completo
  // do veículo mesmo sem dado de sulco — só a(s) posição(ões) realmente vazia(s) é que vem
  // marcada(s) como tal; as demais aparecem como "sem dado" (não inventamos sulco/nº de pneu).
  function positionTemplateParaTipo(tipoCod, excluirVeiculo) {
    const porVeiculo = new Map();
    DATA.sulcoTires.forEach((t) => {
      if (t.tipoCod !== tipoCod || t.veiculo === excluirVeiculo) return;
      if (!porVeiculo.has(t.veiculo)) porVeiculo.set(t.veiculo, []);
      porVeiculo.get(t.veiculo).push(t.posicao);
    });
    if (porVeiculo.size === 0) return null;
    // conta a frequência de cada conjunto exato de posições e usa o mais comum entre os
    // veículos desse tipo (evita misturar variações raras, ex.: um estepe a mais/a menos)
    const freq = new Map();
    for (const posicoes of porVeiculo.values()) {
      const key = posicoes.slice().sort().join("|");
      if (!freq.has(key)) freq.set(key, { count: 0, posicoes });
      freq.get(key).count++;
    }
    let best = null;
    for (const v of freq.values()) if (!best || v.count > best.count) best = v;
    return best.posicoes;
  }

  // Este painel é um mapa de "onde falta pneu", não um raio-x do estado dos outros pneus —
  // por isso as posições que TÊM pneu aparecem só com a posição (chip neutro "—"), mesmo
  // quando temos o sulco real delas via Sulco Baixo. Só a posição efetivamente vazia é
  // marcada (vermelho/VAZIO). O esquema de posições vem de, em ordem de preferência:
  // (1) as posições reais deste veículo no Sulco Baixo, (2) o layout típico de outros
  // veículos do mesmo tipo, ou (3) só as posições vazias conhecidas, se nenhum dos dois
  // acima existir.
  function buildVeiculoParaVazias(v) {
    const reais = DATA.sulcoTires.filter((t) => t.veiculo === v.placa);
    const base = { veiculo: v.placa, filial: v.filial, tipoDesc: v.tipoDesc, odometro: v.odometro };
    const vaziasSet = new Set(v.posicoes);
    let posicoes, temEsquemaTipico = false;
    if (reais.length > 0) {
      posicoes = Array.from(new Set([...reais.map((t) => t.posicao), ...v.posicoes]));
    } else {
      const template = positionTemplateParaTipo(v.tipoCod, v.placa);
      if (template) {
        posicoes = Array.from(new Set([...template, ...v.posicoes]));
        temEsquemaTipico = true;
      } else {
        posicoes = v.posicoes.slice();
      }
    }
    const tires = posicoes.map((p) => vaziasSet.has(p)
      ? { ...base, posicao: p, sulco: null, pneu: null, vazio: true }
      : { ...base, posicao: p, sulco: null, pneu: null, semDado: true });
    return { ...base, tires, temContexto: reais.length > 0, temEsquemaTipico };
  }

  function renderVaziasDetail(d) {
    const v = state.selVeiculoVazias ? d.filtered.find((x) => x.placa === state.selVeiculoVazias) : null;
    if (!v) {
      return `<div class="card detail-card">
        <div class="card-title">Esquema do veículo</div>
        <div class="detail-empty">Clique numa linha da tabela para ver em qual posição falta pneu.</div>
      </div>`;
    }
    const vehicle = buildVeiculoParaVazias(v);
    return `<div class="card detail-card">
      <div class="detail-plate-label">Veículo selecionado</div>
      <div class="detail-plate">${escapeHtml(v.placa)}</div>
      <div class="detail-sub">${escapeHtml(filialSigla(v.filial))} — ${escapeHtml(filialFullName(v.filial))} · ${escapeHtml(v.tipoDesc)}${v.odometro ? ` · ${fmtInt(v.odometro)} km` : ""}</div>
      ${severityPill("danger", `${v.posicoes.length} posição(ões) vazia(s)`)}
      <div class="card-title" style="margin-top:18px;">Esquema do veículo <span style="color:var(--danger)">· ${escapeHtml(v.tipoDesc)}</span></div>
      ${renderTireDiagram(vehicle)}
      <div class="table-note" style="padding-left:0;">Posições tracejadas em <span style="color:var(--danger)">vermelho</span> = sem pneu (VAZIO). As demais (cinza, com "—") têm pneu montado, sem detalhar sulco ou número — o esquema de posições ${vehicle.temContexto ? "foi confirmado pelos dados deste veículo no painel de Sulco Baixo." : vehicle.temEsquemaTipico ? "foi estimado a partir do layout típico de outros veículos do mesmo tipo (este veículo não aparece no Sulco Baixo)." : "mostra só as posições vazias conhecidas — este veículo não aparece no Sulco Baixo e não há outro veículo do mesmo tipo pra usar de referência."}</div>
    </div>`;
  }

  function renderSulcoPanel() {
    const d = computeSulco();
    const filiais = Array.from(new Set(DATA.sulcoTires.map((r) => r.filial))).sort();
    const sulcoFilterToggle = `<div class="seg-group">
        <button class="seg-btn ${!state.sulcoSoTrocar ? "active" : ""}" data-sulco-filter="todos">Até 5mm (atenção + trocar)</button>
        <button class="seg-btn ${state.sulcoSoTrocar ? "active" : ""}" data-sulco-filter="trocar">Somente ≤ 3mm (trocar)</button>
      </div>`;
    const desc = state.sulcoSoTrocar
      ? "Mostrando somente pneus com sulco de 3mm ou menos, que precisam ser trocados agora."
      : "Pneus com sulco abaixo de 5mm: de 3,1 a 5mm requerem atenção (troca em breve), 3mm ou menos precisam ser trocados agora.";
    return `
      ${panelHeader("Sulco Baixo", desc, filiais, sulcoFilterToggle)}
      <div class="kpi-grid">
        ${kpiCard(state.sulcoSoTrocar ? "Veículos com pneu p/ trocar" : "Veículos afetados", d.filtered.length, `de ${d.denom} veículos registrados${scopeLabelText()}`, ICONS.truck, "var(--warning)")}
        ${kpiCard("% da frota afetada", fmtPct(d.pctFrota), `veículos afetados ÷ frota registrada${scopeLabelText()}`, ICONS.gauge, d.pctFrota >= 30 ? "var(--danger)" : d.pctFrota >= 15 ? "var(--warning)" : "var(--success)")}
        ${kpiCard("Pneus para trocar (≤ 3mm)", d.trocarCount, "troca imediata", ICONS.alert, "var(--danger)")}
        ${kpiCard("Pneus em atenção (3,1–5mm)", d.atencaoCount, state.sulcoSoTrocar ? "não exibidos na tabela agora" : "programar substituição", ICONS.gauge, "var(--warning)")}
        ${kpiCard("Filial mais crítica (%)", filialSigla(d.top.filial), d.top.veiculos > 0 ? `${d.top.veiculos} de ${registradosTotal(d.top.filial)} (${fmtPct(d.top.pct)}) — ${filialFullName(d.top.filial)}` : "—", ICONS.building, "var(--danger)")}
      </div>
      <div class="card">
        <div class="card-title">Qtd. de pneus ${state.sulcoSoTrocar ? "para trocar (≤ 3mm)" : "abaixo de 5mm (atenção + trocar)"}, por filial</div>
        ${chartHint()}
        <div id="chart-sulco-bar"></div>
      </div>
      <div class="sulco-layout">
        <div class="table-wrap" style="margin:0;">
          <table>
            <thead><tr>${sortTh("filial", "Filial")}${sortTh("placa", "Placa")}${sortTh("tipo", "Tipo")}${sortTh("odometro", "Odômetro")}${sortTh("qtd", "Qtd")}<th>Posições</th></tr></thead>
            <tbody>
              ${d.filtered.length === 0 ? emptyRow(6, state.sulcoSoTrocar ? "Nenhum pneu com sulco ≤ 3mm encontrado." : "Nenhum pneu abaixo de 5mm encontrado.") :
                applySort(d.filtered, {
                  filial: (r) => normalizeText(filialFullName(r.filial)), placa: (r) => r.veiculo,
                  tipo: (r) => r.tipoDesc, odometro: (r) => r.odometro || 0, qtd: (r) => r.flagged.length,
                }).map((v) => `<tr class="sulco-row ${state.selVeiculoSulco === v.veiculo ? "selected" : ""}" data-veiculo="${escapeHtml(v.veiculo)}">
                  <td>${escapeHtml(filialSigla(v.filial))} <span style="color:var(--text-faint)">— ${escapeHtml(filialFullName(v.filial))}</span></td>
                  <td class="mono" style="font-weight:600;">${escapeHtml(v.veiculo)}</td>
                  <td style="color:var(--text-dim);">${escapeHtml(v.tipoDesc)}</td>
                  <td class="mono">${v.odometro ? fmtInt(v.odometro) + " km" : "—"}</td>
                  <td><span class="qtd-badge" style="background:${v.worst === "trocar" ? "var(--danger-bg)" : "var(--warning-bg)"};color:${v.worst === "trocar" ? "var(--danger)" : "var(--warning)"}">${v.flagged.length}</span></td>
                  <td>${v.flagged.map((t) => `<span class="mono" style="color:${tireColor(tireStatus(t.sulco))};font-weight:600;">${escapeHtml(t.posicao)}${tireExtrasBadge(t)}</span>`).join(" · ")}</td>
                </tr>`).join("")}
            </tbody>
          </table>
          <div class="table-note">${d.filtered.length} veículo(s) com ao menos 1 pneu ${state.sulcoSoTrocar ? "com sulco ≤ 3mm (trocar)" : "abaixo de 5mm"}${scopeLabelText()}. Sobrescrito ao lado da posição: <sup style="font-weight:700;">R</sup>=reformas, <sup style="font-weight:700;">C</sup>=reparos do pneu (quando houver).</div>
        </div>
        ${renderSulcoDetail(d)}
      </div>`;
  }

  // ------------------------------------------------------------------
  // Painel: Pressão de Ar
  // ------------------------------------------------------------------
  // Faixas e padrões (psi por medida) confirmados pelo Joao (2026-09-09). "Sem leitura"
  // (pressão coletada = 0) e "sem padrão" (produto sem medida reconhecida) ficam de fora
  // das 5 faixas — são problemas de cobertura de dado, não de calibragem em si.
  // "zero" (pressão zero/sem leitura) foi adicionada como uma 6ª fatia própria (cinza) só no
  // donut "Composição por faixa" — não é uma faixa de calibragem de verdade, mas o Joao pediu
  // pra ela aparecer na composição visual junto das outras. "sem padrão" continua de fora.
  const FAIXA_PRESSAO_LABEL = { muito_baixa: "Muito baixa", baixa: "Baixa", correta: "Correta", alta: "Alta", muito_alta: "Muito alta", zero: "Pressão zero" };
  // Paleta de 5 cores distintas pedida pelo Joao (tabela de classificação), uma por faixa —
  // diferente das 3 cores semânticas (danger/warning/success) usadas nos KPIs, que só
  // destacam severidade. Aqui cada faixa precisa ser visualmente distinguível da vizinha.
  // "zero" usa cinza neutro (não é uma cor de severidade, é "sem dado").
  const FAIXA_PRESSAO_TONE = { muito_baixa: "#E15759", baixa: "#F1C232", correta: "#3C9F40", alta: "#3577D4", muito_alta: "#9067C6", zero: "#8A8D93" };
  // Ordem fixa de empilhamento no gráfico de colunas por filial (mesma ordem visual do donut).
  const FAIXA_PRESSAO_ORDEM = ["muito_baixa", "baixa", "correta", "alta", "muito_alta", "zero"];

  // Filtro cruzado (padrão BI) dos 4 quadros: clicar filtra os 2 gráficos abaixo; Ctrl+clique
  // soma quadros (união), igual ao toggleFilialSelection já usado nos gráficos de barra.
  function togglePressaoQuadro(tipo, multi) {
    if (multi) {
      if (state.pressaoFiltroSel.has(tipo)) state.pressaoFiltroSel.delete(tipo);
      else state.pressaoFiltroSel.add(tipo);
    } else {
      if (state.pressaoFiltroSel.size === 1 && state.pressaoFiltroSel.has(tipo)) state.pressaoFiltroSel.clear();
      else { state.pressaoFiltroSel.clear(); state.pressaoFiltroSel.add(tipo); }
    }
    render();
  }
  function pressaoQuadroHint() {
    const labels = { veiculos_inspecionados: "% veículos inspecionados", pressao_correta: "% pressão correta", pneus_inspecionados: "% pneus inspecionados", pressao_zero: "% pressão zero" };
    if (state.pressaoFiltroSel.size === 0) {
      return `<div class="chart-hint">Clique num quadro acima pra filtrar os gráficos abaixo · Ctrl+clique (Cmd no Mac) pra combinar vários.</div>`;
    }
    const names = Array.from(state.pressaoFiltroSel).map((k) => labels[k] || k).join(", ");
    return `<div class="chart-hint">Filtrando por quadro: <strong style="color:var(--text-dim)">${escapeHtml(names)}</strong><button class="clear-sel-btn" id="clear-quadro-sel">limpar seleção</button></div>`;
  }
  // Filtro cruzado clicando na legenda do donut "Composição por faixa": clicar filtra o gráfico
  // de barras (por filial) pra essa faixa; Ctrl+clique soma mais de uma faixa (mesmo padrão BI
  // já usado nos quadros/barras). Combina em AND com a seleção de quadro, se houver alguma.
  function togglePressaoFaixa(faixa, multi) {
    if (multi) {
      if (state.pressaoFaixaSel.has(faixa)) state.pressaoFaixaSel.delete(faixa);
      else state.pressaoFaixaSel.add(faixa);
    } else {
      if (state.pressaoFaixaSel.size === 1 && state.pressaoFaixaSel.has(faixa)) state.pressaoFaixaSel.clear();
      else { state.pressaoFaixaSel.clear(); state.pressaoFaixaSel.add(faixa); }
    }
    render();
  }
  function pressaoFaixaHint() {
    if (state.pressaoFaixaSel.size === 0) {
      return `<div class="chart-hint">Clique numa faixa acima pra filtrar o gráfico de barras · Ctrl+clique pra combinar várias.</div>`;
    }
    const names = Array.from(state.pressaoFaixaSel).map((k) => FAIXA_PRESSAO_LABEL[k] || k).join(", ");
    return `<div class="chart-hint">Filtrando por faixa: <strong style="color:var(--text-dim)">${escapeHtml(names)}</strong><button class="clear-sel-btn" id="clear-faixa-sel">limpar seleção</button></div>`;
  }

  // Hint do quadro 3 (% pneus inspecionados). No modo Geral, detalha 1ª/2ª quinzena separado
  // (pedido do Joao) além do total somado; nas rodadas de quinzena, mantém o formato simples.
  function pressaoQuadro3Hint(d, scopeLabel, rodadaLabel) {
    if (d.round !== "geral") {
      return `${d.rows.length} de ${d.universoFilial.length} pneus${scopeLabel} — ${rodadaLabel}`;
    }
    const g = d.pressaoQuadro3Geral;
    const linha = (label, q) => q.disponivel
      ? `${label} — ${q.count} de ${q.total} pneus (${fmtPct(q.total ? (q.count / q.total) * 100 : 0)})`
      : `${label} — ainda sem leitura`;
    return `${linha("1ª quinzena", g.insp1)}\n${linha("2ª quinzena", g.insp2)}\nGeral — ${g.somaCount} de ${g.somaTotal} pneus${scopeLabel}`;
  }

  function computePressao() {
    const round = state.pressaoRound;
    // Filtro de filial(dropdown)+busca SEM a seleção de barras (scopeRows) — usado só pra montar
    // o "por filial" do gráfico de barras. Mesmo padrão já usado em computeVazias/computeSulco:
    // sem isso, clicar numa barra faz as OUTRAS desaparecerem do próprio gráfico (bug reportado
    // pelo Joao, 2026-09-14 — selecionar uma filial não pode apagar as demais da comparação).
    const filtraFilialBuscaSemEscopo = (list) => {
      let out = list;
      if (state.filtroFilial !== "all") out = out.filter((t) => t.filial === state.filtroFilial);
      if (state.busca) out = out.filter((t) => t.veiculo.toLowerCase().includes(state.busca.toLowerCase()));
      return out;
    };
    const filtraFilialBusca = (list) => scopeRows(filtraFilialBuscaSemEscopo(list));

    // Universo de pneus na filial/busca/seleção ativos, independente da quinzena — base do
    // modo "Geral" e denominador do quadro 3 (% pneus inspecionados).
    const universoFilial = filtraFilialBusca(DATA.pressaoTires);
    // Mesma coisa mas ignorando a seleção de barras (selFiliais) — só pro gráfico de barras.
    const universoFilialTodas = filtraFilialBuscaSemEscopo(DATA.pressaoTires);

    // Conjunto (por id de pneu) dos pneus lidos em pelo menos uma quinzena do mês corrente —
    // usado só pro quadro 3 (% pneus inspecionados) no modo "Geral". Sem isso, "Geral" comparava
    // o universo com ele mesmo e sempre dava 100%, o que o Joao pegou (divergência vs. 1ª quinzena).
    const mesAtivoGeral = mesPressaoPadrao();
    const mesDadosGeral = mesAtivoGeral && DATA.pressaoHistoricoMensal[mesAtivoGeral];
    const insp1Geral = mesDadosGeral && mesDadosGeral.insp1 && mesDadosGeral.insp1.disponivel
      ? filtraFilialBusca(mesDadosGeral.insp1.pneus) : [];
    const insp2Geral = mesDadosGeral && mesDadosGeral.insp2 && mesDadosGeral.insp2.disponivel
      ? filtraFilialBusca(mesDadosGeral.insp2.pneus) : [];
    const pneusInspecionadosGeralSet = new Set([...insp1Geral, ...insp2Geral].map((t) => t.pneu));
    // Versão "todas as filiais" (ignora selFiliais) do mesmo conjunto, só pro gráfico de barras.
    const insp1GeralTodas = mesDadosGeral && mesDadosGeral.insp1 && mesDadosGeral.insp1.disponivel
      ? filtraFilialBuscaSemEscopo(mesDadosGeral.insp1.pneus) : [];
    const insp2GeralTodas = mesDadosGeral && mesDadosGeral.insp2 && mesDadosGeral.insp2.disponivel
      ? filtraFilialBuscaSemEscopo(mesDadosGeral.insp2.pneus) : [];
    const pneusInspecionadosGeralSetTodas = new Set([...insp1GeralTodas, ...insp2GeralTodas].map((t) => t.pneu));

    let rows, disponivel = true, rowsTodas;
    if (round === "geral") {
      // Antes usava o universo inteiro (todo pneu cadastrado, com a leitura mais recente que
      // tivesse, nova ou velha) — o que fazia o "fora do padrão"/composição/% pressão correta
      // misturarem pneu lido este mês com pneu de leitura antiga, sem bater com "519 lidos" do
      // quadro 3. Corrigido (pedido do Joao, 2026-09-15): "Geral" agora considera só os pneus
      // confirmados como lidos neste mês (união das 2 quinzenas) — os mesmos usados no quadro 3.
      // O denominador do quadro 3 continua sendo `universoFilial` (cobertura), não muda aqui.
      rows = universoFilial.filter((t) => pneusInspecionadosGeralSet.has(t.pneu));
      rowsTodas = universoFilialTodas.filter((t) => pneusInspecionadosGeralSetTodas.has(t.pneu));
    } else {
      const mesAtivo = mesPressaoPadrao();
      const mesDados = mesAtivo && DATA.pressaoHistoricoMensal[mesAtivo];
      const quinzena = mesDados ? (round === "insp1" ? mesDados.insp1 : mesDados.insp2) : null;
      disponivel = quinzena ? quinzena.disponivel : false;
      rows = quinzena ? filtraFilialBusca(quinzena.pneus) : [];
      rowsTodas = quinzena ? filtraFilialBuscaSemEscopo(quinzena.pneus) : [];
    }

    const comPadraoELeitura = rows.filter((t) => !t.semLeitura && !t.semPadrao);
    const foraPadrao = comPadraoELeitura.filter((t) => t.faixa !== "correta");
    const semLeitura = rows.filter((t) => t.semLeitura);
    const semPadrao = rows.filter((t) => t.semPadrao);
    const cobertura = rows.length ? ((rows.length - semLeitura.length) / rows.length) * 100 : 0;

    const faixaCounts = { muito_baixa: 0, baixa: 0, correta: 0, alta: 0, muito_alta: 0 };
    comPadraoELeitura.forEach((t) => { faixaCounts[t.faixa] = (faixaCounts[t.faixa] || 0) + 1; });

    // Quadro 2: % pneus com pressão correta, entre os com leitura e padrão conhecidos.
    const pctCorreta = comPadraoELeitura.length ? (faixaCounts.correta / comPadraoELeitura.length) * 100 : 0;
    // Quadro 3: % pneus inspecionados nesta quinzena/mês, sobre o universo de pneus do escopo.
    // No modo "Geral" NÃO é rows/universoFilial (seria sempre 100%, rows===universoFilial por
    // construção) e também NÃO é união (pedido explícito do Joao, 2026-09-14): é a SOMA direta
    // das 2 quinzenas — conta o universo 2x (uma vez por quinzena) e soma quem foi lido em cada
    // uma, pra bater "1ª: X de Y" + "2ª: X de Y" = "Geral: soma dos X de soma dos Y".
    const pressaoQuadro3Geral = {
      insp1: {
        count: insp1Geral.length, total: universoFilial.length,
        disponivel: !!(mesDadosGeral && mesDadosGeral.insp1 && mesDadosGeral.insp1.disponivel),
      },
      insp2: {
        count: insp2Geral.length, total: universoFilial.length,
        disponivel: !!(mesDadosGeral && mesDadosGeral.insp2 && mesDadosGeral.insp2.disponivel),
      },
    };
    pressaoQuadro3Geral.somaCount = pressaoQuadro3Geral.insp1.count + pressaoQuadro3Geral.insp2.count;
    pressaoQuadro3Geral.somaTotal = pressaoQuadro3Geral.insp1.total + pressaoQuadro3Geral.insp2.total;
    const pctInspecionados = round === "geral"
      ? (pressaoQuadro3Geral.somaTotal ? (pressaoQuadro3Geral.somaCount / pressaoQuadro3Geral.somaTotal) * 100 : 0)
      : (universoFilial.length ? (rows.length / universoFilial.length) * 100 : 0);
    // Quadro 4: % pneus com pressão 0 (sem leitura), sobre os pneus considerados na rodada.
    const pctPressaoZero = rows.length ? (semLeitura.length / rows.length) * 100 : 0;
    // Quadro 1: nível veículo, igual à aba Inspeções Pendentes.
    const insp = pctVeiculosInspecionados(round);

    // Filtro cruzado dos 4 quadros sobre os 2 gráficos abaixo (união entre os selecionados).
    const pendentesSet = new Set(linhasPendentesNoRound(round).map((r) => r.veiculo));
    const QUADRO_CRIT = {
      veiculos_inspecionados: (t) => !pendentesSet.has(t.veiculo),
      pressao_correta: (t) => !t.semLeitura && !t.semPadrao && t.faixa === "correta",
      pneus_inspecionados: round === "geral" ? (t) => pneusInspecionadosGeralSet.has(t.pneu) : () => true,
      pressao_zero: (t) => t.semLeitura,
    };
    const sel = state.pressaoFiltroSel;
    // Seleção de faixa feita clicando na legenda do donut. IMPORTANTE: essa seleção NÃO filtra
    // o próprio donut (chartRows/pieData abaixo) — só destaca (dim nas outras fatias, já feito
    // em renderDonut). Se filtrasse o donut também, selecionar "Baixa" faria as OUTRAS faixas
    // sumirem do próprio gráfico de composição, o mesmo bug de auto-colapso já corrigido pro
    // gráfico de barras de filial (rows filtrado pela própria seleção que ele exibe). A seleção
    // de faixa só cruza pro gráfico de barras (chartRowsTodas abaixo), que é o que de fato deve
    // ser filtrado/somado por faixa.
    const selFaixa = state.pressaoFaixaSel;
    // Pneu sem leitura (pressão 0) não tem uma "faixa" de calibragem de verdade — pro filtro
    // cruzado (e pro donut) ele conta como a fatia especial "zero", não pelo `t.faixa` cru.
    const chaveFaixa = (t) => (t.semLeitura ? "zero" : t.faixa);
    const passaFaixa = (t) => selFaixa.size === 0 || selFaixa.has(chaveFaixa(t));
    const chartRows = rows.filter((t) => (sel.size === 0 || Array.from(sel).some((tipo) => QUADRO_CRIT[tipo](t))));

    // Mesmo filtro cruzado dos quadros, mas sobre rowsTodas (ignora selFiliais) — só pro gráfico
    // de barras por filial, que precisa continuar mostrando TODAS as filiais (destacando as
    // selecionadas) pra permitir comparação, em vez de sumir com as demais quando você seleciona
    // uma barra. Aqui SIM aplica `passaFaixa`: clicar numa faixa do donut deve filtrar/destacar
    // este gráfico pra mostrar quais filiais têm mais daquela faixa — Ctrl+clique soma faixas
    // (união), mostrando o total combinado por filial.
    const QUADRO_CRIT_TODAS = {
      veiculos_inspecionados: QUADRO_CRIT.veiculos_inspecionados,
      pressao_correta: QUADRO_CRIT.pressao_correta,
      pneus_inspecionados: round === "geral" ? (t) => pneusInspecionadosGeralSetTodas.has(t.pneu) : () => true,
      pressao_zero: QUADRO_CRIT.pressao_zero,
    };
    const chartRowsTodas = rowsTodas.filter((t) => (sel.size === 0 || Array.from(sel).some((tipo) => QUADRO_CRIT_TODAS[tipo](t))) && passaFaixa(t));

    // Colunas empilhadas por filial: cada barra soma os pneus lidos daquela filial, desmembrada
    // nas 6 categorias (5 faixas + "zero"). `chartRowsTodas` já veio filtrado por `passaFaixa`
    // (pedido do Joao, 2026-09-15) — sem faixa selecionada no donut, entram as 6; selecionando
    // uma ou mais (Ctrl+clique soma), a pilha mostra só as selecionadas, ou vira barra de 1 cor
    // só quando é uma faixa única. "sem padrão" nunca entra (dado não classificável).
    const porFilialFaixa = new Map();
    chartRowsTodas.forEach((t) => {
      if (t.semPadrao) return;
      const k = chaveFaixa(t);
      if (!porFilialFaixa.has(t.filial)) {
        porFilialFaixa.set(t.filial, { filial: t.filial, total: 0, muito_baixa: 0, baixa: 0, correta: 0, alta: 0, muito_alta: 0, zero: 0 });
      }
      const entry = porFilialFaixa.get(t.filial);
      entry[k] = (entry[k] || 0) + 1;
      entry.total += 1;
    });
    const barData = Array.from(porFilialFaixa.values()).sort((a, b) => b.total - a.total);

    // "zero" (pressão zero/sem leitura) entra como fatia própria (cinza) no donut, ao lado das
    // 5 faixas — pedido do Joao. "sem padrão" continua fora do donut (dado não classificável).
    const faixaCountsChart = { muito_baixa: 0, baixa: 0, correta: 0, alta: 0, muito_alta: 0, zero: 0 };
    chartRows.filter((t) => !t.semPadrao).forEach((t) => { const k = chaveFaixa(t); faixaCountsChart[k] = (faixaCountsChart[k] || 0) + 1; });
    const pieData = Object.entries(faixaCountsChart).filter(([, v]) => v > 0)
      .map(([k, v]) => ({ key: k, name: FAIXA_PRESSAO_LABEL[k], value: v, color: FAIXA_PRESSAO_TONE[k] }));

    // Quadro "Veículos com pneus fora do padrão" (pedido do Joao, 2026-09-16): lista, por
    // veículo, quais pneus vieram fora da faixa "correta" — excluindo semLeitura (pressão zero
    // é falta de dado, não pressão fora do padrão) e semPadrao (medida não reconhecida, não dá
    // pra classificar). Parte de `rows` (já tem filial/busca/seleção de barra + rodada aplicados)
    // e respeita TAMBÉM os outros 2 filtros cruzados da aba (quadros e faixa do donut), pra ficar
    // consistente com o resto da página: clicar em "Muito baixa" no donut, por exemplo, estreita
    // esta lista só pros veículos com pneu muito baixo.
    const foraPadraoDetalhe = rows.filter((t) => !t.semLeitura && !t.semPadrao && t.faixa !== "correta"
      && (sel.size === 0 || Array.from(sel).some((tipo) => QUADRO_CRIT[tipo](t)))
      && passaFaixa(t));
    const porVeiculoForaPadrao = new Map();
    foraPadraoDetalhe.forEach((t) => {
      if (!porVeiculoForaPadrao.has(t.veiculo)) {
        porVeiculoForaPadrao.set(t.veiculo, { veiculo: t.veiculo, filial: t.filial, tipoDesc: t.tipoDesc, itens: [] });
      }
      porVeiculoForaPadrao.get(t.veiculo).itens.push({ posicao: t.posicao, faixa: t.faixa, pctPadrao: t.pctPadrao, pressaoAtual: t.pressaoAtual });
    });
    const veiculosForaPadrao = Array.from(porVeiculoForaPadrao.values())
      .map((v) => ({ ...v, qtd: v.itens.length }))
      .sort((a, b) => b.qtd - a.qtd || a.veiculo.localeCompare(b.veiculo));

    return {
      round, disponivel, rows, universoFilial, foraPadrao, semLeitura, semPadrao, cobertura, faixaCounts,
      pctCorreta, pctInspecionados, pctPressaoZero, insp, barData, pieData, pressaoQuadro3Geral,
      foraPadraoDetalhe, veiculosForaPadrao,
    };
  }

  function renderPressaoPanel() {
    const d = computePressao();
    const filiais = Array.from(new Set(DATA.pressaoTires.map((t) => t.filial))).sort();
    const scopeLabel = scopeLabelText();
    const roundsPressao = `<div class="seg-group">
        <button class="seg-btn ${state.pressaoRound === "insp1" ? "active" : ""}" data-pressao-round="insp1">1ª quinzena</button>
        <button class="seg-btn ${state.pressaoRound === "insp2" ? "active" : ""}" data-pressao-round="insp2">2ª quinzena</button>
        <button class="seg-btn ${state.pressaoRound === "geral" ? "active" : ""}" data-pressao-round="geral">Geral (mês)</button>
      </div>`;
    const rodadaLabel = state.pressaoRound === "insp1" ? "1ª quinzena" : state.pressaoRound === "insp2" ? "2ª quinzena" : "mês";
    const desc = d.round !== "geral" && !d.disponivel
      ? `A ${rodadaLabel} ainda não tem leitura de pressão atualizada.`
      : `Percentual da pressão coletada em relação ao padrão da medida do pneu (275→110psi, 295→120psi, 1100→120psi, 215→105psi) — ${rodadaLabel}${scopeLabel}.`;
    const isSel = (k) => state.pressaoFiltroSel.has(k);

    return `
      ${panelHeader("Pressão de Ar", desc, filiais, roundsPressao)}
      <div class="kpi-grid">
        ${kpiCard("% veículos inspecionados", fmtPct(d.insp.pctAtingido), `${Math.max(0, d.insp.denom - d.insp.pendentes)} de ${d.insp.denom} veículos${scopeLabel} — ${rodadaLabel}`, ICONS.truck, d.insp.pctAtingido >= 85 ? "var(--success)" : d.insp.pctAtingido >= 70 ? "var(--warning)" : "var(--danger)", "veiculos_inspecionados", isSel("veiculos_inspecionados"))}
        ${kpiCard("% pressão correta", fmtPct(d.pctCorreta), `${d.faixaCounts.correta} de ${d.rows.length - d.semLeitura.length - d.semPadrao.length} pneus com leitura e padrão conhecidos${scopeLabel}`, ICONS.ring, d.pctCorreta >= 70 ? "var(--success)" : d.pctCorreta >= 40 ? "var(--warning)" : "var(--danger)", "pressao_correta", isSel("pressao_correta"))}
        ${kpiCard("% pneus inspecionados", fmtPct(d.pctInspecionados), pressaoQuadro3Hint(d, scopeLabel, rodadaLabel), ICONS.clipboard, d.pctInspecionados >= 85 ? "var(--success)" : d.pctInspecionados >= 60 ? "var(--warning)" : "var(--danger)", "pneus_inspecionados", isSel("pneus_inspecionados"))}
        ${kpiCard("% pressão zero", fmtPct(d.pctPressaoZero), `${d.semLeitura.length} de ${d.rows.length} pneus sem leitura${scopeLabel}`, ICONS.alert, d.pctPressaoZero >= 15 ? "var(--danger)" : d.pctPressaoZero >= 5 ? "var(--warning)" : "var(--success)", "pressao_zero", isSel("pressao_zero"))}
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-title">${state.pressaoFaixaSel.size > 0 ? `Qtd. de pneus (${Array.from(state.pressaoFaixaSel).map((k) => FAIXA_PRESSAO_LABEL[k] || k).join(", ")}), por filial` : "Qtd. de pneus lidos, por filial (por faixa)"}</div>
          ${pressaoQuadroHint()}
          ${chartHint()}
          <div id="chart-pressao-bar"></div>
        </div>
        <div class="card">
          <div class="card-title">Composição por faixa${scopeLabel}</div>
          ${pressaoFaixaHint()}
          <div id="chart-pressao-pie"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Veículos com pneus fora do padrão</div>
        <div class="chart-hint">${d.foraPadraoDetalhe.length} pneu(s) em ${d.veiculosForaPadrao.length} veículo(s)${scopeLabel} — ${rodadaLabel}. Não inclui pressão zero (sem leitura) nem medida sem padrão cadastrado.</div>
        <div class="table-wrap" style="margin-top:8px;">
          <table>
            <thead><tr>${sortTh("fp_placa", "Placa")}${sortTh("fp_filial", "Filial")}${sortTh("fp_tipo", "Tipo")}${sortTh("fp_qtd", "Qtd. fora do padrão")}<th>Detalhe</th></tr></thead>
            <tbody>
              ${d.veiculosForaPadrao.length === 0 ? emptyRow(5, "Nenhum veículo com pneu fora do padrão nesse filtro.") :
                applySort(d.veiculosForaPadrao, {
                  fp_placa: (v) => v.veiculo, fp_filial: (v) => normalizeText(filialFullName(v.filial)),
                  fp_tipo: (v) => v.tipoDesc, fp_qtd: (v) => v.qtd,
                }).map((v) => {
                  const grave = v.itens.some((i) => i.faixa === "muito_baixa" || i.faixa === "muito_alta");
                  const detalhe = v.itens.map((i) => `${i.posicao ? "Pos " + i.posicao : "pneu"}: ${FAIXA_PRESSAO_LABEL[i.faixa] || i.faixa} (${i.pctPadrao}%)`).join(" · ");
                  return `<tr>
                    <td class="mono" style="font-weight:600;">${escapeHtml(v.veiculo)}</td>
                    <td>${escapeHtml(filialSigla(v.filial))} <span style="color:var(--text-faint)">— ${escapeHtml(filialFullName(v.filial))}</span></td>
                    <td style="color:var(--text-dim);">${escapeHtml(v.tipoDesc || "—")}</td>
                    <td class="mono">${v.qtd}</td>
                    <td>${severityPill(grave ? "danger" : "warning", detalhe)}</td>
                  </tr>`;
                }).join("")}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  // ------------------------------------------------------------------
  // Layout comum
  // ------------------------------------------------------------------
  function emptyRow(colspan, msg) { return `<tr class="empty-row"><td colspan="${colspan}">${escapeHtml(msg)}</td></tr>`; }

  function panelHeader(title, desc, filiais, extraControl) {
    const showFilial = true;
    return `
      <div class="panel-header">
        <div>
          <div class="eyebrow">Auditoria de Frota · Pneus</div>
          <h2 class="panel-title">${escapeHtml(title)}</h2>
          <p class="panel-desc">${escapeHtml(desc)}</p>
        </div>
        <div class="toolbar">
          ${extraControl || ""}
          ${showFilial ? `<select id="ctl-filial">
            <option value="all">Todas as filiais (${filiais.length})</option>
            ${filiais.map((f) => `<option value="${escapeHtml(f)}" ${state.filtroFilial === f ? "selected" : ""}>${escapeHtml(filialFullName(f))}</option>`).join("")}
          </select>` : ""}
          <div class="search-wrap">${ICONS.search}<input id="ctl-busca" placeholder="Buscar placa" value="${escapeHtml(state.busca)}"></div>
        </div>
      </div>`;
  }

  function sidebarHtml() {
    const counts = {
      vazias: DATA.vazias.length,
      inspecoes: new Set([...DATA.insp1.map((r) => r.veiculo), ...DATA.insp2.map((r) => r.veiculo)]).size,
      sulco: new Set(DATA.sulcoTires.filter((t) => t.sulco != null && t.sulco <= 5).map((t) => t.veiculo)).size,
      pressao: new Set(DATA.pressaoTires.filter((t) => t.faixa && t.faixa !== "correta").map((t) => t.veiculo)).size,
    };
    return `
      <div class="brand">
        <div class="brand-mark">${ICONS.truck}</div>
        <div>
          <div class="brand-name">Auditoria de Pneus</div>
          <div class="brand-sub mono">RAJA · Gestão de Frota</div>
        </div>
      </div>
      <div class="updated-strip"><span class="dot"></span>Atualizado em ${fmtDate(DATA.generatedAt)}</div>
      <nav>
        <div class="nav-label">Painéis</div>
        <div class="nav-list">
          ${PANELS.map((p) => `<button class="nav-btn ${state.panel === p.key ? "active" : ""}" data-panel="${p.key}">
            <span class="nav-icon">${ICONS[p.icon]}</span>${p.label}
            <span class="nav-count mono">${counts[p.key]}</span>
          </button>`).join("")}
        </div>
      </nav>
      <div class="sidebar-foot">Dados consolidados manualmente a partir dos relatórios da operação. Fale com o time de frota para solicitar uma atualização.</div>`;
  }

  // ------------------------------------------------------------------
  // Render + eventos
  // ------------------------------------------------------------------
  function render() {
    // Todo clique (quadro, barra, filial, etc.) passa por aqui, e recriar o innerHTML de
    // #main/#sidebar do zero reseta a rolagem (a página "sobe" sozinha — bug reportado pelo
    // Joao, 2026-09-14). Guarda a posição da janela e da sidebar antes, restaura depois.
    const scrollY = window.scrollY;
    const sidebarEl = document.getElementById("sidebar");
    const sidebarScroll = sidebarEl ? sidebarEl.scrollTop : 0;

    sidebarEl.innerHTML = sidebarHtml();
    const main = document.getElementById("main");
    if (state.panel === "vazias") main.innerHTML = renderVaziasPanel();
    else if (state.panel === "inspecoes") main.innerHTML = renderInspecoesPanel();
    else if (state.panel === "sulco") main.innerHTML = renderSulcoPanel();
    else main.innerHTML = renderPressaoPanel();

    bindNav();
    bindToolbar();
    bindSortHeaders();
    bindSulcoRows();
    bindVaziasRows();
    drawCharts();

    window.scrollTo(0, scrollY);
    if (sidebarEl) sidebarEl.scrollTop = sidebarScroll;
  }

  function bindVaziasRows() {
    document.querySelectorAll(".vazias-row").forEach((tr) => tr.addEventListener("click", () => {
      const p = tr.getAttribute("data-placa");
      state.selVeiculoVazias = state.selVeiculoVazias === p ? null : p;
      render();
    }));
  }

  function bindSulcoRows() {
    document.querySelectorAll(".sulco-row").forEach((tr) => tr.addEventListener("click", () => {
      const v = tr.getAttribute("data-veiculo");
      state.selVeiculoSulco = state.selVeiculoSulco === v ? null : v;
      render();
    }));
  }

  function bindNav() {
    document.querySelectorAll(".nav-btn").forEach((btn) => btn.addEventListener("click", () => {
      state.panel = btn.getAttribute("data-panel");
      state.filtroFilial = "all"; state.busca = ""; state.selFiliais.clear(); state.inspMes = null;
      state.sortKey = null; state.sortDir = 1; state.selVeiculoSulco = null; state.selVeiculoVazias = null;
      state.pressaoFiltroSel.clear(); state.pressaoFaixaSel.clear();
      state.sidebarOpen = false;
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("overlay").classList.remove("open");
      render();
    }));
  }

  function bindToolbar() {
    const selF = document.getElementById("ctl-filial");
    if (selF) selF.addEventListener("change", () => { state.filtroFilial = selF.value; state.selFiliais.clear(); state.pressaoFiltroSel.clear(); state.pressaoFaixaSel.clear(); render(); });
    const inputB = document.getElementById("ctl-busca");
    if (inputB) inputB.addEventListener("input", () => {
      state.busca = inputB.value;
      const caret = inputB.selectionStart;
      render();
      const newInputB = document.getElementById("ctl-busca");
      if (newInputB) {
        newInputB.focus();
        newInputB.setSelectionRange(caret, caret);
      }
    });
    document.querySelectorAll(".seg-btn[data-round]").forEach((btn) => btn.addEventListener("click", () => {
      state.inspRound = btn.getAttribute("data-round"); state.selFiliais.clear(); render();
    }));
    const selMes = document.getElementById("ctl-mes-insp");
    if (selMes) selMes.addEventListener("change", () => { state.inspMes = selMes.value; state.selFiliais.clear(); render(); });
    document.querySelectorAll(".seg-btn[data-sulco-filter]").forEach((btn) => btn.addEventListener("click", () => {
      state.sulcoSoTrocar = btn.getAttribute("data-sulco-filter") === "trocar"; render();
    }));
    document.querySelectorAll(".seg-btn[data-pressao-round]").forEach((btn) => btn.addEventListener("click", () => {
      state.pressaoRound = btn.getAttribute("data-pressao-round"); state.selFiliais.clear(); state.pressaoFiltroSel.clear(); state.pressaoFaixaSel.clear(); render();
    }));
    document.querySelectorAll("[data-quadro]").forEach((card) => card.addEventListener("click", (ev) => {
      togglePressaoQuadro(card.getAttribute("data-quadro"), ev.ctrlKey || ev.metaKey);
    }));
    const clearBtn = document.getElementById("clear-sel");
    if (clearBtn) clearBtn.addEventListener("click", () => { state.selFiliais.clear(); render(); });
    const clearQuadroBtn = document.getElementById("clear-quadro-sel");
    if (clearQuadroBtn) clearQuadroBtn.addEventListener("click", (ev) => { ev.stopPropagation(); state.pressaoFiltroSel.clear(); render(); });
    const clearFaixaBtn = document.getElementById("clear-faixa-sel");
    if (clearFaixaBtn) clearFaixaBtn.addEventListener("click", (ev) => { ev.stopPropagation(); state.pressaoFaixaSel.clear(); render(); });
  }

  // Clique numa barra: seleciona só ela (ou desmarca se já era a única selecionada).
  // Ctrl/Cmd+clique: alterna essa filial dentro da seleção, mantendo as demais (soma).
  function toggleFilialSelection(filial, multi) {
    if (multi) {
      if (state.selFiliais.has(filial)) state.selFiliais.delete(filial);
      else state.selFiliais.add(filial);
    } else {
      if (state.selFiliais.size === 1 && state.selFiliais.has(filial)) state.selFiliais.clear();
      else { state.selFiliais.clear(); state.selFiliais.add(filial); }
    }
    render();
  }

  function drawCharts() {
    if (state.panel === "vazias") {
      const d = computeVazias();
      renderBarChart("chart-vazias-bar", d.barData, "veiculos", state.selFiliais, toggleFilialSelection, "var(--chart1)", { percent: false });
      renderDonut("chart-vazias-pie", d.pieData);
    } else if (state.panel === "inspecoes") {
      const d = computeInspecoes();
      renderBarChart("chart-insp-bar", d.barData, "veiculos", state.selFiliais, toggleFilialSelection, "var(--chart2)", { percent: false });
      if (d.geral) renderDonut("chart-insp-pie", d.pieData);
    } else if (state.panel === "sulco") {
      const d = computeSulco();
      renderBarChart("chart-sulco-bar", d.barData, "pneus", state.selFiliais, toggleFilialSelection, "var(--danger)", { percent: false });
    } else if (state.panel === "pressao") {
      const d = computePressao();
      renderStackedBarChart("chart-pressao-bar", d.barData, FAIXA_PRESSAO_ORDEM.map((k) => ({ key: k, label: FAIXA_PRESSAO_LABEL[k], color: FAIXA_PRESSAO_TONE[k] })), state.selFiliais, toggleFilialSelection);
      renderDonut("chart-pressao-pie", d.pieData, state.pressaoFaixaSel, togglePressaoFaixa);
    }
  }

  document.getElementById("menuBtn").addEventListener("click", () => {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("overlay").classList.add("open");
  });
  document.getElementById("overlay").addEventListener("click", () => {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("open");
  });
  window.addEventListener("resize", drawCharts);

  render();
})();
</script>
</body>
</html>
