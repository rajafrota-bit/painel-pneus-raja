<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoria de Pneus RAJA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161b;
    --bg-elev: #191c22;
    --surface: #1e222a;
    --surface-2: #262b34;
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.16);
    --text: #edeff3;
    --text-dim: #9aa0ac;
    --text-faint: #676d79;
    --accent: #e08a4d;
    --accent-dim: rgba(224,138,77,0.14);
    --accent-border: rgba(224,138,77,0.4);
    --danger: #e2584a;
    --danger-bg: rgba(226,88,74,0.14);
    --warning: #d9ad55;
    --warning-bg: rgba(217,173,85,0.14);
    --success: #4bbd85;
    --success-bg: rgba(75,189,133,0.14);
    --chart1: #e08a4d;
    --chart2: #6b8fd6;
    --chart3: #d9ad55;
    --chart4: #4bbd85;
    --chart5: #b06bd6;
    --radius: 12px;
    --radius-sm: 7px;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(224,138,77,0.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(107,143,214,0.05), transparent 55%);
    background-attachment: fixed;
  }
  h1, h2, h3, .display { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; text-wrap: balance; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  button, select, input { font-family: inherit; color: var(--text); }
  select, input {
    background: var(--bg-elev); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 7px 9px; font-size: 13px; width: 100%;
  }
  select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent-border); outline-offset: 1px; }
  button { cursor: pointer; border: none; background: none; }

  #app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 272px; flex-shrink: 0; padding: 22px 18px;
    display: flex; flex-direction: column; gap: 22px;
    border-right: 1px solid var(--border);
    background: rgba(25,28,34,0.9);
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    background: var(--accent-dim); border: 1px solid var(--accent-border);
    display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .brand-name { font-size: 14px; font-weight: 700; line-height: 1.2; }
  .brand-sub { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }

  .updated-strip {
    display: flex; align-items: center; gap: 8px; padding: 9px 11px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 11.5px; color: var(--text-dim);
  }
  .updated-strip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; box-shadow: 0 0 6px var(--success); }

  nav .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); margin-bottom: 8px; padding: 0 4px; }
  .nav-list { display: flex; flex-direction: column; gap: 3px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border-radius: var(--radius-sm); padding: 9px 10px; font-size: 13px; font-weight: 500;
    background: transparent; border: 1px solid transparent; color: var(--text-dim);
  }
  .nav-btn:hover { background: var(--surface); color: var(--text); }
  .nav-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); font-weight: 600; }
  .nav-btn .nav-icon { flex-shrink: 0; display: flex; opacity: .85; }
  .nav-btn .nav-count {
    margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    background: var(--surface-2); padding: 1px 6px; border-radius: 99px; color: var(--text-dim);
  }
  .nav-btn.active .nav-count { background: rgba(224,138,77,.22); color: var(--accent); }

  .sidebar-foot { margin-top: auto; font-size: 10.5px; color: var(--text-faint); line-height: 1.6; }
  .sidebar-foot a { text-decoration: underline; text-decoration-color: var(--border-strong); }

  /* ---------- Main ---------- */
  #main { flex: 1; min-width: 0; padding: 30px 36px 60px; display: flex; flex-direction: column; gap: 22px; }
  .panel-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .22em; color: var(--accent); }
  .panel-title { font-size: 26px; font-weight: 700; margin-top: 5px; }
  .panel-desc { font-size: 13px; color: var(--text-dim); margin-top: 5px; max-width: 60ch; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar select, .toolbar input { width: auto; min-width: 150px; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
  .search-wrap input { padding-left: 30px; min-width: 170px; }

  .seg-group { display: flex; background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
  .seg-btn { padding: 6px 12px; font-size: 12.5px; border-radius: 5px; color: var(--text-dim); font-weight: 500; }
  .seg-btn.active { background: var(--accent); color: #191c22; font-weight: 700; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 14px; }
  .card {
    background: linear-gradient(160deg, var(--surface), var(--bg-elev));
    border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px;
  }
  .kpi { position: relative; overflow: hidden; }
  .kpi-glow { position: absolute; top: -20px; right: -20px; width: 110px; height: 110px; border-radius: 50%; filter: blur(46px); opacity: .25; pointer-events: none; }
  .kpi-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .kpi-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); font-weight: 600; }
  .kpi-icon { flex-shrink: 0; padding: 6px; border-radius: 7px; display: flex; }
  .kpi-value { font-size: 25px; font-weight: 700; margin-top: 10px; line-height: 1.1; }
  .kpi-hint { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; white-space: pre-line; }
  .kpi-clicavel { cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease; }
  .kpi-clicavel:hover { border-color: var(--accent-border); }
  .kpi-selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-border) inset; }

  .kpi-ring { display: flex; align-items: center; gap: 18px; min-width: 260px; }
  .ring-visual { width: 88px; height: 88px; border-radius: 50%; position: relative; flex-shrink: 0; }
  .ring-hole { position: absolute; inset: 11px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; }
  .ring-pct { font-family: 'JetBrains Mono', monospace; font-size: 15.5px; font-weight: 700; }
  .ring-info { display: flex; flex-direction: column; min-width: 0; }

  .grid-2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }
  @media (max-width: 1050px) { .grid-2 { grid-template-columns: 1fr; } }

  .card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); margin-bottom: 2px; }
  .chart-hint { font-size: 11px; color: var(--text-faint); margin-bottom: 12px; }
  .clear-sel-btn { background: none; border: none; padding: 0; margin-left: 6px; font-size: 11px; color: var(--accent); text-decoration: underline; cursor: pointer; font-family: inherit; }

  .sulco-layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
  @media (max-width: 1050px) { .sulco-layout { grid-template-columns: 1fr; } }
  .detail-card { position: sticky; top: 16px; }
  .detail-plate-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); margin-bottom: 4px; }
  .detail-plate { font-size: 22px; font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-bottom: 4px; }
  .detail-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .tire-diagram { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
  .axle-row { display: flex; flex-direction: column; gap: 6px; }
  .axle-tiers { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .axle-side { display: flex; gap: 6px; flex-wrap: nowrap; }
  .axle-side.left { justify-content: flex-end; }
  .axle-label { font-size: 10px; color: var(--text-faint); text-align: center; white-space: nowrap; font-family: 'JetBrains Mono', monospace; }
  .axle-estepes { margin-top: 2px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .tire-chip { width: 52px; flex-shrink: 0; border: 1.5px solid; border-radius: 6px; padding: 5px 2px; text-align: center; }
  .tire-chip-val { font-size: 11.5px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .tire-chip-pos { font-size: 8px; color: var(--text-faint); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
  .tire-chip-pneu { font-size: 8px; color: var(--text-dim); margin-top: 1px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  .qtd-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; font-size: 11px; font-weight: 700; }
  .sulco-row, .vazias-row { cursor: pointer; }
  .sulco-row.selected td, .vazias-row.selected td { background: rgba(255,255,255,0.06); }
  .detail-empty { font-size: 12.5px; color: var(--text-faint); padding: 34px 10px; text-align: center; }
  .bar-rect { cursor: pointer; transition: opacity .15s; }

  .legend-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); transition: opacity .12s ease; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .legend-clicavel { cursor: pointer; border-radius: var(--radius-sm); padding: 3px 6px; margin: -3px -6px; }
  .legend-clicavel:hover { background: var(--surface); }
  .legend-selected { color: var(--text); font-weight: 600; }
  .legend-selected .legend-dot { box-shadow: 0 0 0 2px var(--accent-border); }

  .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 560px; }
  thead th {
    text-align: left; padding: 10px 14px; color: var(--text-dim); font-weight: 600;
    background: var(--surface-2); border-bottom: 1px solid var(--border);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
    position: sticky; top: 0;
  }
  thead th[data-sort] { cursor: pointer; user-select: none; }
  thead th[data-sort]:hover { color: var(--text); }
  .sort-arrow { display: inline-block; width: 9px; margin-left: 3px; font-size: 9px; color: var(--text-faint); }
  .sort-arrow.active { color: var(--accent); }
  tbody td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .pill-danger { background: var(--danger-bg); color: var(--danger); }
  .pill-warning { background: var(--warning-bg); color: var(--warning); }
  .pill-success { background: var(--success-bg); color: var(--success); }
  .pill-neutral { background: var(--surface-2); color: var(--text-dim); }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .sever-bar { width: 64px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: inline-block; vertical-align: middle; }
  .sever-fill { height: 100%; border-radius: 99px; }

  .empty-row td { text-align: center; padding: 34px; color: var(--text-faint); }
  .table-note { font-size: 10.5px; color: var(--text-faint); padding: 8px 14px; }

  .cal-table th, .cal-table td { text-align: center; }
  .cal-table td:first-child, .cal-table th:first-child { text-align: left; }
  .cal-check { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
  .cal-dot { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .cal-dot.done { background: var(--success-bg); color: var(--success); }
  .cal-dot.missed { background: var(--danger-bg); color: var(--danger); }
  .cal-date { font-size: 9.5px; color: var(--text-faint); }

  #topbar { display: none; }
  @media (max-width: 920px) {
    #app { flex-direction: column; }
    #topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev);
      position: sticky; top: 0; z-index: 20;
    }
    #sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 30; width: 270px; height: 100vh;
      transform: translateX(-100%); transition: transform .2s ease; box-shadow: 20px 0 40px rgba(0,0,0,.4);
    }
    #sidebar.open { transform: translateX(0); }
    #overlay { display: none; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.6); }
    #overlay.open { display: block; }
    #main { padding: 20px 16px 48px; }
    .grid-2 { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="topbar">
  <button id="menuBtn" aria-label="Abrir menu" style="display:flex;align-items:center;gap:8px;color:var(--text);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    <span style="font-size:13px;font-weight:600;">Menu</span>
  </button>
  <span class="mono" style="font-size:11px;color:var(--text-dim);">Auditoria de Pneus</span>
</div>

<div id="app">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<script src="dados.js"></script>
<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------
  // Helpers
  // ------------------------------------------------------------------
  const SIGLA_MAP = {
    "RAJA LIMEIRA": "LIM", "RAJA BELEM": "BEL", "RAJA RECIFE": "REC", "RAJA JEQUIE": "JEQ",
    "RAJA SALVADOR": "SAL", "RAJA SPOT": "SPT", "RAJA SERRA": "SER", "RAJA TEIXEIRA": "TXE",
    "KEMIGAS NANUQUE": "KNQ", "RAJA ILHEUS": "IHE", "RAJA MARANHAO": "MAR", "RAJA GOIAS": "GOI",
    "RAJA GOV VALADARES": "GVN", "RAJA CONQUISTA": "VCQ", "KEMIGAS GV": "KGV", "SUCATA": "SUC",
  };
  function normalizeText(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().trim().replace(/\s+/g, " ");
  }
  function filialFullName(filial) {
    const m = String(filial || "").match(/^[A-Z]{2,5}\s*-\s*(.+)$/);
    return (m ? m[1] : filial || "—").trim();
  }
  function filialSigla(filial) {
    if (!filial) return "—";
    const raw = String(filial);
    const m = raw.match(/^([A-Z]{2,5})\s*-\s*.+$/);
    if (m) return m[1];
    const key = normalizeText(raw);
    if (SIGLA_MAP[key]) return SIGLA_MAP[key];
    const words = key.split(" ").filter(Boolean);
    if (words.length >= 2) return (words[0][0] + words[1][0] + (words[2]?.[0] ?? words[1][1] ?? "")).slice(0, 3);
    return key.slice(0, 3);
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtDate(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return "—";
    const [y, m, d] = iso.slice(0, 10).split("-");
    return `${d}/${m}/${y}`;
  }

  // ------------------------------------------------------------------
  // Saneamento: filial "SUCATA" (veículo descartado/sucateado, não é frota ativa) deve ser
  // ignorada em TODOS os painéis (pedido do Joao, 2026-09-15). O gerador (generate_data.py)
  // já exclui SUCATA na maioria dos pontos, mas o dados.js atual ainda tem alguns furos
  // (sulcoTires nunca teve esse filtro no gerador, e o denominador "registrados" também não)
  // — filtramos aqui, direto em DATA, ANTES de qualquer painel ler os dados, pra garantir que
  // nenhum cálculo (KPI, gráfico, dropdown de filial) inclua sucata, mesmo sem reprocessar as
  // planilhas. Fica redundante com o que o gerador já faz nos outros pontos, o que é
  // inofensivo (filter de uma lista já sem SUCATA simplesmente não remove nada).
  function ehFilialSucata(filial) {
    return /SUCATA/.test(normalizeText(filial));
  }
  function semSucata(lista) {
    return Array.isArray(lista) ? lista.filter((item) => !ehFilialSucata(item && item.filial)) : lista;
  }
  (function saneiaDadosSucata() {
    if (!DATA) return;
    DATA.vazias = semSucata(DATA.vazias);
    DATA.insp1 = semSucata(DATA.insp1);
    DATA.insp2 = semSucata(DATA.insp2);
    DATA.sulcoTires = semSucata(DATA.sulcoTires);
    DATA.pressaoTires = semSucata(DATA.pressaoTires);
    Object.values(DATA.historicoMensal || {}).forEach((mes) => {
      mes.insp1 = semSucata(mes.insp1);
      mes.insp2 = semSucata(mes.insp2);
    });
    Object.values(DATA.pressaoHistoricoMensal || {}).forEach((mes) => {
      if (mes.insp1) mes.insp1.pneus = semSucata(mes.insp1.pneus);
      if (mes.insp2) mes.insp2.pneus = semSucata(mes.insp2.pneus);
    });
    // "registrados" não é uma lista de registros, é {total, porFilial: {chaveNormalizada: qtd}}
    // — usado como denominador do quadro "% veículos inspecionados". Sem tirar SUCATA daqui, o
    // denominador ficava inflado (contando veículo sucateado que nunca entra no numerador).
    if (DATA.registrados && DATA.registrados.porFilial) {
      Object.keys(DATA.registrados.porFilial).forEach((chave) => {
        if (ehFilialSucata(chave)) {
          DATA.registrados.total -= DATA.registrados.porFilial[chave];
          delete DATA.registrados.porFilial[chave];
        }
      });
    }
  })();
  function fmtInt(n) { return Number(n || 0).toLocaleString("pt-BR"); }
  function fmtPct(n) { return `${(Math.round(n * 10) / 10).toLocaleString("pt-BR")}%`; }
  const MESES_PT = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
  function fmtMesAno(chave) {
    const [ano, mes] = chave.split("-").map(Number);
    return `${MESES_PT[mes - 1] || chave}/${ano}`;
  }
  // Mês mais recente disponível em DATA.historicoMensal (sempre inclui o mês atual, ver
  // build_historico_mensal no gerador). Usado como default quando state.inspMes é null.
  function mesInspPadrao() {
    const chaves = Object.keys(DATA.historicoMensal || {}).sort();
    return chaves.length ? chaves[chaves.length - 1] : null;
  }
  // Equivalente pra DATA.pressaoHistoricoMensal. A aba Pressão de Ar não tem seletor de mês
  // (só quinzena), então sempre usamos o mês mais recente disponível (= mês corrente, ver
  // build_historico_mensal_pressao no gerador).
  function mesPressaoPadrao() {
    const chaves = Object.keys(DATA.pressaoHistoricoMensal || {}).sort();
    return chaves.length ? chaves[chaves.length - 1] : null;
  }
  // Linhas (veiculo+filial) pendentes no round indicado, pro mês corrente — mesma lógica de
  // pendência de computeInspecoes(), mas parametrizada por round explícito (não lê
  // state.inspRound, pra não interferir com o toggle da aba Inspeções Pendentes) e sem
  // aplicar filtro de filial/busca ainda (isso é feito por quem consome).
  function linhasPendentesNoRound(round) {
    const mesAtivo = mesInspPadrao();
    const mesDados = (DATA.historicoMensal && DATA.historicoMensal[mesAtivo]) || {
      insp1: DATA.insp1, insp2: DATA.insp2, insp1Disponivel: DATA.insp1Disponivel, insp2Disponivel: DATA.insp2Disponivel,
    };
    if (round === "geral") {
      const insp1Ok = mesDados.insp1Disponivel !== false;
      const insp2Ok = mesDados.insp2Disponivel !== false;
      const map1 = new Map(mesDados.insp1.map((r) => [r.veiculo, r]));
      const map2 = new Map(mesDados.insp2.map((r) => [r.veiculo, r]));
      const veiculos = Array.from(new Set([...map1.keys(), ...map2.keys()]));
      const pendenteFn = insp1Ok && insp2Ok ? (v) => map1.has(v) && map2.has(v)
        : insp1Ok ? (v) => map1.has(v)
        : insp2Ok ? (v) => map2.has(v)
        : () => false;
      return veiculos.filter(pendenteFn).map((v) => {
        const base = map2.get(v) || map1.get(v);
        return { veiculo: v, filial: base.filial };
      });
    }
    const source = round === "insp1" ? mesDados.insp1 : mesDados.insp2;
    return source.map((r) => ({ veiculo: r.veiculo, filial: r.filial }));
  }
  // Quadro 1 da aba Pressão de Ar: "% veículos inspecionados", igual à aba Inspeções
  // Pendentes (100 - % pendente), respeitando filial/busca/seleção de filiais ativos.
  function pctVeiculosInspecionados(round) {
    let rows = linhasPendentesNoRound(round);
    if (state.filtroFilial !== "all") rows = rows.filter((r) => r.filial === state.filtroFilial);
    if (state.busca) rows = rows.filter((r) => r.veiculo.toLowerCase().includes(state.busca.toLowerCase()));
    rows = scopeRows(rows);
    const denom = registradosTotal(activeScope());
    const pct = denom ? (rows.length / denom) * 100 : 0;
    return { pctAtingido: 100 - pct, pendentes: rows.length, denom };
  }
  function registradosTotal(filial) {
    if (filial instanceof Set) {
      if (filial.size === 0) return DATA.registrados.total;
      let sum = 0;
      filial.forEach((f) => { sum += registradosTotal(f); });
      return sum;
    }
    if (!filial || filial === "all") return DATA.registrados.total;
    const key = normalizeText(filialFullName(filial));
    return DATA.registrados.porFilial[key] || 0;
  }
  // Escopo ativo: seleção múltipla no gráfico (Ctrl+clique) tem prioridade sobre o dropdown de filial.
  function activeScope() { return state.selFiliais.size ? state.selFiliais : state.filtroFilial; }
  function scopeRows(rows) { return state.selFiliais.size ? rows.filter((r) => state.selFiliais.has(r.filial)) : rows; }
  function scopeLabelText() {
    if (state.selFiliais.size === 1) return ` — ${filialFullName(Array.from(state.selFiliais)[0])}`;
    if (state.selFiliais.size > 1) return ` — ${Array.from(state.selFiliais).map(filialSigla).join(" + ")} (${state.selFiliais.size} filiais)`;
    if (state.filtroFilial !== "all") return ` — ${filialFullName(state.filtroFilial)}`;
    return "";
  }
  // Ordenação de tabelas: clique no cabeçalho ordena crescente, clique de novo inverte.
  // `accessors` é um mapa { chaveDaColuna: (linha) => valor } específico de cada tabela.
  function sortTh(key, label) {
    const active = state.sortKey === key;
    const arrow = active ? (state.sortDir === 1 ? "▲" : "▼") : "";
    return `<th data-sort="${key}">${escapeHtml(label)}<span class="sort-arrow${active ? " active" : ""}">${arrow}</span></th>`;
  }
  function applySort(rows, accessors) {
    const acc = state.sortKey && accessors[state.sortKey];
    if (!acc) return rows;
    const dir = state.sortDir;
    return rows.slice().sort((a, b) => {
      const va = acc(a), vb = acc(b);
      if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
      return String(va).localeCompare(String(vb), "pt-BR", { numeric: true, sensitivity: "base" }) * dir;
    });
  }
  function bindSortHeaders() {
    document.querySelectorAll("th[data-sort]").forEach((th) => th.addEventListener("click", () => {
      const key = th.getAttribute("data-sort");
      if (state.sortKey === key) state.sortDir = -state.sortDir;
      else { state.sortKey = key; state.sortDir = 1; }
      render();
    }));
  }

  function chartHint() {
    if (state.selFiliais.size === 0) {
      return `<div class="chart-hint">Clique numa barra para filtrar · Ctrl+clique (Cmd no Mac) para comparar várias filiais juntas.</div>`;
    }
    const names = Array.from(state.selFiliais).map(filialSigla).join(", ");
    return `<div class="chart-hint">Filtrando: <strong style="color:var(--text-dim)">${escapeHtml(names)}</strong><button class="clear-sel-btn" id="clear-sel">limpar seleção</button></div>`;
  }

  // ------------------------------------------------------------------
  // Chart primitives (SVG, sem libs externas)
  // ------------------------------------------------------------------
  function renderBarChart(containerId, data, valueKey, selected, onClick, color, opts) {
    opts = opts || {};
    const el = document.getElementById(containerId);
    if (!el) return;
    const W = Math.max(el.clientWidth || 560, 280);
    const H = 260;
    const padL = 38, padB = 28, padT = 12, padR = 8;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const maxVal = Math.max(1, ...data.map((d) => d[valueKey]));
    const niceMax = opts.percent ? 100 : (Math.ceil(maxVal / 4) * 4 || 4);
    const fmtAxis = (v) => opts.percent ? `${v}%` : `${v}`;
    const fmtTip = (v) => opts.percent ? fmtPct(v) : v;
    const barW = data.length > 0 ? innerW / data.length : innerW;
    const gap = Math.min(barW * 0.38, 20);

    let grid = "";
    for (let i = 0; i <= 4; i++) {
      const v = Math.round((niceMax / 4) * i);
      const y = padT + innerH - (v / niceMax) * innerH;
      grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(255,255,255,0.07)" stroke-dasharray="3 3"/>`;
      grid += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#767c88">${fmtAxis(v)}</text>`;
    }
    let bars = "";
    data.forEach((d, i) => {
      const x = padL + i * barW + gap / 2;
      const w = Math.max(barW - gap, 3);
      const h = (Math.min(d[valueKey], niceMax) / niceMax) * innerH;
      const y = padT + innerH - h;
      const isSel = selected instanceof Set ? selected.has(d.filial) : selected === d.filial;
      const hasSel = selected instanceof Set ? selected.size > 0 : !!selected;
      const dim = hasSel && !isSel;
      bars += `<g class="bar-rect" data-filial="${escapeHtml(d.filial)}" style="opacity:${dim ? 0.32 : 1}">
        <rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, 0)}" rx="4" fill="${color}" ${isSel ? 'stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"' : ""}>
          <title>${escapeHtml(filialFullName(d.filial))}: ${fmtTip(d[valueKey])}</title>
        </rect>
        <text x="${x + w / 2}" y="${padT + innerH + 17}" text-anchor="middle" font-size="10.5" fill="#9aa0ac" font-family="'JetBrains Mono',monospace">${escapeHtml(filialSigla(d.filial))}</text>
      </g>`;
    });
    el.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">${grid}${bars}</svg>`;
    el.querySelectorAll(".bar-rect").forEach((g) => g.addEventListener("click", (ev) => onClick(g.getAttribute("data-filial"), ev.ctrlKey || ev.metaKey)));
  }

  // Colunas empilhadas por filial: cada barra soma vários segmentos coloridos (`segments`:
  // [{key, label, color}], nessa ordem de baixo pra cima). Usado só pela aba Pressão de Ar
  // (colunas desmembradas nas faixas de pressão), mas escrito genérico como os outros charts
  // primitivos. Clique em qualquer parte da barra seleciona a filial — mesmo padrão Ctrl+clique
  // soma já usado em renderBarChart (state.selFiliais).
  function renderStackedBarChart(containerId, data, segments, selectedFiliais, onClickFilial) {
    const el = document.getElementById(containerId);
    if (!el) return;
    if (!data.length) { el.innerHTML = `<p style="font-size:12px;color:var(--text-faint);text-align:center;padding:40px 0;">Sem dados.</p>`; return; }
    const W = Math.max(el.clientWidth || 560, 280);
    const H = 260;
    const padL = 38, padB = 28, padT = 12, padR = 8;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const maxVal = Math.max(1, ...data.map((d) => d.total));
    const niceMax = Math.ceil(maxVal / 4) * 4 || 4;
    const barW = data.length > 0 ? innerW / data.length : innerW;
    const gap = Math.min(barW * 0.38, 20);

    let grid = "";
    for (let i = 0; i <= 4; i++) {
      const v = Math.round((niceMax / 4) * i);
      const y = padT + innerH - (v / niceMax) * innerH;
      grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(255,255,255,0.07)" stroke-dasharray="3 3"/>`;
      grid += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#767c88">${v}</text>`;
    }
    let bars = "";
    data.forEach((d, i) => {
      const x = padL + i * barW + gap / 2;
      const w = Math.max(barW - gap, 3);
      const isSel = selectedFiliais instanceof Set ? selectedFiliais.has(d.filial) : selectedFiliais === d.filial;
      const hasSel = selectedFiliais instanceof Set ? selectedFiliais.size > 0 : !!selectedFiliais;
      const dim = hasSel && !isSel;
      let yCursor = padT + innerH; // empilha de baixo pra cima
      let segsHtml = "";
      segments.forEach((seg) => {
        const v = d[seg.key] || 0;
        if (v <= 0) return;
        const h = (Math.min(v, niceMax) / niceMax) * innerH;
        const y = yCursor - h;
        segsHtml += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, 0)}" fill="${seg.color}"><title>${escapeHtml(filialFullName(d.filial))} — ${escapeHtml(seg.label)}: ${v}</title></rect>`;
        yCursor = y;
      });
      bars += `<g class="bar-rect" data-filial="${escapeHtml(d.filial)}" style="opacity:${dim ? 0.32 : 1}">
        ${segsHtml}
        <rect x="${x}" y="${padT + innerH - (Math.min(d.total, niceMax) / niceMax) * innerH}" width="${w}" height="${Math.max((Math.min(d.total, niceMax) / niceMax) * innerH, 0)}" fill="transparent" ${isSel ? 'stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"' : ""}><title>${escapeHtml(filialFullName(d.filial))}: ${d.total} pneu(s)</title></rect>
        <text x="${x + w / 2}" y="${padT + innerH + 17}" text-anchor="middle" font-size="10.5" fill="#9aa0ac" font-family="'JetBrains Mono',monospace">${escapeHtml(filialSigla(d.filial))}</text>
      </g>`;
    });
    el.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">${grid}${bars}</svg>`;
    el.querySelectorAll(".bar-rect").forEach((g) => g.addEventListener("click", (ev) => onClickFilial(g.getAttribute("data-filial"), ev.ctrlKey || ev.metaKey)));
  }

  // Converte cor hex (#RRGGBB) pra rgba com alpha reduzido, usado só pra "apagar" fatias não
  // selecionadas no conic-gradient (que não suporta opacity por trecho, só cor). Cores em
  // formato var(--x) (usadas pelas outras abas, sem seleção clicável) passam direto.
  function hexToRgba(cor, alpha) {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(cor);
    if (!m) return cor;
    const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  // `selected`/`onClick` são opcionais: só usados pelo donut "Composição por faixa" de Pressão
  // de Ar (filtro cruzado clicando na legenda, mesmo padrão BI dos quadros/barras — Ctrl+clique
  // soma). Chamadas existentes sem esses 2 params continuam gerando o mesmo HTML de antes.
  // Cada item de `data` precisa de um `key` pra ser clicável (sem `key`, fica só decorativo).
  function renderDonut(containerId, data, selected, onClick) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const palette = ["var(--chart1)", "var(--chart2)", "var(--chart3)", "var(--chart4)", "var(--chart5)"];
    const colors = data.map((d, i) => d.color || palette[i % palette.length]);
    const total = data.reduce((s, d) => s + d.value, 0);
    if (total === 0) { el.innerHTML = `<p style="font-size:12px;color:var(--text-faint);text-align:center;padding:40px 0;">Sem dados.</p>`; return; }
    const hasSel = selected instanceof Set && selected.size > 0;
    const isSel = (d) => selected instanceof Set && d.key != null && selected.has(d.key);
    let acc = 0;
    // Guarda o intervalo em graus de cada fatia (mesmo cálculo do conic-gradient) pra permitir
    // clicar direto na cor da rosca, não só na legenda — ver o listener de clique mais abaixo.
    const fatias = [];
    const stops = data.map((d, i) => {
      const start = (acc / total) * 360; acc += d.value;
      const end = (acc / total) * 360;
      fatias.push({ key: d.key, start, end });
      const dim = hasSel && !isSel(d);
      const cor = dim ? hexToRgba(colors[i % colors.length], 0.22) : colors[i % colors.length];
      return `${cor} ${start}deg ${end}deg`;
    }).join(", ");
    const legend = data.map((d, i) => {
      const clicavel = !!onClick && d.key != null;
      const classes = ["legend-item"];
      if (clicavel) classes.push("legend-clicavel");
      if (isSel(d)) classes.push("legend-selected");
      const dim = hasSel && !isSel(d);
      const dataAttr = clicavel ? ` data-faixa="${escapeHtml(d.key)}"` : "";
      return `<div class="${classes.join(" ")}"${dataAttr} style="${dim ? "opacity:.4" : ""}"><span class="legend-dot" style="background:${colors[i % colors.length]}"></span>${escapeHtml(d.name)} <span class="mono" style="color:var(--text-faint)">(${d.value} · ${fmtPct((d.value / total) * 100)})</span></div>`;
    }).join("");
    el.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:4px;">
        <div class="donut-ring" style="width:158px;height:158px;border-radius:50%;background:conic-gradient(${stops});position:relative;${onClick ? "cursor:pointer;" : ""}">
          <div style="position:absolute;inset:24px;border-radius:50%;background:var(--surface);"></div>
        </div>
        <div class="legend-row" style="justify-content:center;margin-bottom:0;">${legend}</div>
      </div>`;
    if (onClick) {
      el.querySelectorAll("[data-faixa]").forEach((it) => it.addEventListener("click", (ev) => onClick(it.getAttribute("data-faixa"), ev.ctrlKey || ev.metaKey)));
      // Clique direto na cor da rosca: calcula o ângulo do clique em relação ao centro (mesma
      // convenção do conic-gradient — 0° no topo, sentido horário) e acha a fatia correspondente
      // pelo intervalo [start, end) guardado em `fatias`. Clique no buraco central (raio menor
      // que o anel) ou fora do círculo (raio maior que o externo) é ignorado.
      const ring = el.querySelector(".donut-ring");
      if (ring) {
        ring.addEventListener("click", (ev) => {
          const rect = ring.getBoundingClientRect();
          const R = rect.width / 2;
          const dx = ev.clientX - (rect.left + R);
          const dy = ev.clientY - (rect.top + R);
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > R || dist < R - 24) return;
          let ang = Math.atan2(dx, -dy) * (180 / Math.PI);
          if (ang < 0) ang += 360;
          if (ang >= 360) ang -= 360;
          const fatia = fatias.find((f) => f.key != null && ang >= f.start && ang < f.end);
          if (fatia) onClick(fatia.key, ev.ctrlKey || ev.metaKey);
        });
      }
    }
  }

  // ------------------------------------------------------------------
  // Shared UI builders
  // ------------------------------------------------------------------
  // `quadro`/`selected` são opcionais: só usados pelos KPIs "clicáveis" (padrão BI de
  // filtro cruzado, ver Pressão de Ar). Chamadas existentes sem esses 2 params continuam
  // gerando o mesmo HTML de antes.
  function kpiCard(label, value, hint, icon, tone, quadro, selected) {
    const classes = ["card", "kpi"];
    if (quadro) classes.push("kpi-clicavel");
    if (selected) classes.push("kpi-selected");
    const dataAttr = quadro ? ` data-quadro="${escapeHtml(quadro)}"` : "";
    return `<div class="${classes.join(" ")}"${dataAttr}>
      <div class="kpi-glow" style="background:${tone}"></div>
      <div class="kpi-top">
        <span class="kpi-label">${escapeHtml(label)}</span>
        <span class="kpi-icon" style="color:${tone};background:${tone}1f;border:1px solid ${tone}40;">${icon}</span>
      </div>
      <div class="kpi-value">${escapeHtml(String(value))}</div>
      ${hint ? `<div class="kpi-hint">${escapeHtml(hint)}</div>` : ""}
    </div>`;
  }
  function severityPill(level, label) {
    const cls = level === "danger" ? "pill-danger" : level === "warning" ? "pill-warning" : level === "success" ? "pill-success" : "pill-neutral";
    return `<span class="pill ${cls}"><span class="pill-dot"></span>${escapeHtml(label)}</span>`;
  }
  function ringKpi(pct, tone, totalValue, feitos, pendentes) {
    const track = "rgba(255,255,255,0.09)";
    const clamped = Math.max(0, Math.min(100, pct));
    const deg = clamped * 3.6;
    return `<div class="card kpi-ring">
      <div class="ring-visual" style="background:conic-gradient(${tone} 0deg ${deg}deg, ${track} ${deg}deg 360deg);">
        <div class="ring-hole"><span class="ring-pct" style="color:${tone}">${fmtPct(pct)}</span></div>
      </div>
      <div class="ring-info">
        <span class="kpi-label">Total da frota</span>
        <div class="kpi-value">${fmtInt(totalValue)}</div>
        <div class="kpi-hint">${fmtInt(feitos)} feitos · ${fmtInt(pendentes)} pendentes</div>
      </div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // Painel: Posições Vazias
  // ------------------------------------------------------------------
  function computeVazias() {
    let rows = DATA.vazias;
    if (state.filtroFilial !== "all") rows = rows.filter((r) => r.filial === state.filtroFilial);
    if (state.busca) rows = rows.filter((r) => r.placa.toLowerCase().includes(state.busca.toLowerCase()));
    const filtered = scopeRows(rows);
    const totalPos = filtered.reduce((s, r) => s + r.posicoes.length, 0);
    const denom = registradosTotal(activeScope());
    const pct = denom ? (filtered.length / denom) * 100 : 0;
    const byFilialMap = new Map();
    rows.forEach((r) => byFilialMap.set(r.filial, (byFilialMap.get(r.filial) || 0) + 1));
    const barData = Array.from(byFilialMap, ([filial, veiculos]) => {
      const reg = registradosTotal(filial);
      return { filial, veiculos, pct: reg ? (veiculos / reg) * 100 : 0 };
    }).sort((a, b) => b.veiculos - a.veiculos);
    const top = barData[0] || { filial: "—", veiculos: 0, pct: 0 };
    const tipoMap = new Map();
    filtered.forEach((r) => tipoMap.set(r.tipoCod, (tipoMap.get(r.tipoCod) || 0) + 1));

  // ------------------------------------------------------------------
  // Painel: Inspeções Pendentes
  // ------------------------------------------------------------------
  function computeInspecoes() {
    // Mês selecionado no dropdown (ou o mais recente disponível, por padrão). historicoMensal
    // guarda um snapshot insp1/insp2 por mês; sem ele (DATA antigo), cai de volta pros campos
    // DATA.insp1/insp2 direto (mês corrente), pra não quebrar painéis já gerados antes disso.
    const mesAtivo = state.inspMes || mesInspPadrao();
    const mesDados = (DATA.historicoMensal && DATA.historicoMensal[mesAtivo]) || {
      insp1: DATA.insp1, insp2: DATA.insp2, insp1Disponivel: DATA.insp1Disponivel, insp2Disponivel: DATA.insp2Disponivel,
    };
    if (state.inspRound === "geral") {
      // Disponível = false só quando a quinzena foi explicitamente zerada (sem dado ainda),
      // não quando ela genuinamente tem zero pendências. DATA antigo (sem essas chaves) é
      // tratado como "disponível", pra não quebrar painéis já gerados antes dessa correção.
      const insp1Ok = mesDados.insp1Disponivel !== false;
      const insp2Ok = mesDados.insp2Disponivel !== false;
      const map1 = new Map(mesDados.insp1.map((r) => [r.veiculo, r]));
      const map2 = new Map(mesDados.insp2.map((r) => [r.veiculo, r]));
      const veiculos = Array.from(new Set([...map1.keys(), ...map2.keys()]));
      const unionAll = veiculos.map((veiculo) => {
        const r1 = map1.get(veiculo), r2 = map2.get(veiculo);
        const status = r1 && r2 ? "cronico" : r1 && !r2 ? "so_q1" : "so_q2";
        const base = r2 || r1;
        return { veiculo, filial: base.filial, classe: base.classe, emQ1: !!r1, emQ2: !!r2, status };
      });
      let rows = unionAll;
      if (state.filtroFilial !== "all") rows = rows.filter((r) => r.filial === state.filtroFilial);
      if (state.busca) rows = rows.filter((r) => r.veiculo.toLowerCase().includes(state.busca.toLowerCase()));
      const filtered = scopeRows(rows);
      const scopeFilial = activeScope();
      const denom = registradosTotal(scopeFilial);
      const cronico = filtered.filter((r) => r.status === "cronico").length;
      const soQ1 = filtered.filter((r) => r.status === "so_q1").length;
      const soQ2 = filtered.filter((r) => r.status === "so_q2").length;
      // "Pendente" de verdade, com as DUAS quinzenas disponíveis, é crônico (não inspecionado
      // em nenhuma das duas). Mas se uma quinzena ainda não tem dado (zerada), crônico sempre
      // dá 0 — o que faria parecer que "tudo foi feito" quando na real só falta dado da outra
      // quinzena. Nesse caso, "pendente" cai pro que a quinzena disponível mostra.
      const pendenteFn = insp1Ok && insp2Ok ? (r) => r.status === "cronico"
        : insp1Ok ? (r) => r.emQ1
        : insp2Ok ? (r) => r.emQ2
        : () => false;
      const pendentesReais = filtered.filter(pendenteFn).length;
      const pct = denom ? (pendentesReais / denom) * 100 : 0;
      const pctAtingido = 100 - pct;
      const byFilialMap = new Map();
      rows.filter(pendenteFn).forEach((r) => byFilialMap.set(r.filial, (byFilialMap.get(r.filial) || 0) + 1));
      const barData = Array.from(byFilialMap, ([filial, veiculos]) => {
        const reg = registradosTotal(filial);
        return { filial, veiculos, pct: reg ? (veiculos / reg) * 100 : 0 };
      }).sort((a, b) => b.veiculos - a.veiculos);
      const pieData = [
        { name: "Pendente nas 2 quinzenas", value: cronico, color: "var(--danger)" },
        { name: "Só pendente na 1ª quinzena", value: soQ1, color: "var(--text-faint)" },
        { name: "Só pendente na 2ª quinzena", value: soQ2, color: "var(--warning)" },
      ].filter((p) => p.value > 0);
      return { filtered, barData, source: unionAll, cronico, soQ1, soQ2, pendentesReais, pct, pctAtingido, denom, scopeFilial, pieData, geral: true, insp1Ok, insp2Ok, mesAtivo };
    }
    const source = state.inspRound === "insp1" ? mesDados.insp1 : mesDados.insp2;
    let rows = source;
    if (state.filtroFilial !== "all") rows = rows.filter((r) => r.filial === state.filtroFilial);
    if (state.busca) rows = rows.filter((r) => r.veiculo.toLowerCase().includes(state.busca.toLowerCase()));
    const filtered = scopeRows(rows);
    const scopeFilial = activeScope();
    const denom = registradosTotal(scopeFilial);
    const pct = denom ? (filtered.length / denom) * 100 : 0;
    const pctAtingido = 100 - pct;
    const byFilialMap = new Map();
    rows.forEach((r) => byFilialMap.set(r.filial, (byFilialMap.get(r.filial) || 0) + 1));
    const barData = Array.from(byFilialMap, ([filial, veiculos]) => {
      const reg = registradosTotal(filial);
      return { filial, veiculos, pct: reg ? (veiculos / reg) * 100 : 0 };
    }).sort((a, b) => b.veiculos - a.veiculos);
    const top = barData[0] || { filial: "—", veiculos: 0, pct: 0 };
    return { filtered, barData, top, source, pct, pctAtingido, denom, scopeFilial, geral: false, mesAtivo };
  }
