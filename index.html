<style>
  :root {
    --bg: #14161b;
    --bg-elev: #191c22;

  function renderBarChart(containerId, data, valueKey, selected, onClick, color, opts) {
    opts = opts || {};

    if (!el) return;
    const W = Math.max(el.clientWidth || 560, 280);
    const H = 260;
    const padL = 38, padB = 28, padT = 12, padR = 8;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const maxVal = Math.max(1, ...data.map((d) => d[valueKey]));

    const fmtAxis = (v) => opts.percent ? `${v}%` : `${v}`;
    const fmtTip = (v) => opts.percent ? fmtPct(v) : v;
    const barW = data.length > 0 ? innerW / data.length : innerW;
    const gap = Math.min(barW * 0.38, 20);

    let grid = "";
    for (let i = 0; i <= 4; i++) {
      const v = Math.round((niceMax / 4) * i);
      const y = padT + innerH - (v / niceMax) * innerH;
      grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(255,255,255,0.07)" stroke-dasharray="3 3"/>`;
      grid += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#767c88">${fmtAxis(v)}</text>`;
    }
    let bars = "";
    data.forEach((d, i) => {
      const x = padL + i * barW + gap / 2;
      const w = Math.max(barW - gap, 3);
      const h = (Math.min(d[valueKey], niceMax) / niceMax) * innerH;
      const y = padT + innerH - h;
      const isSel = selected instanceof Set ? selected.has(d.filial) : selected === d.filial;
      const hasSel = selected instanceof Set ? selected.size > 0 : !!selected;
      const dim = hasSel && !isSel;
      bars += `<g class="bar-rect" data-filial="${escapeHtml(d.filial)}" style="opacity:${dim ? 0.32 : 1}">
        <rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, 0)}" rx="4" fill="${color}" ${isSel ? 'stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"' : ""}>
          <title>${escapeHtml(filialFullName(d.filial))}: ${fmtTip(d[valueKey])}</title>
        </rect>

      bars += `<g class="bar-rect" data-filial="${escapeHtml(d.filial)}" style="opacity:${dim ? 0.32 : 1}">
        ${segsHtml}
        <rect x="${x}" y="${padT + innerH - (Math.min(d.total, niceMax) / niceMax) * innerH}" width="${w}" height="${Math.max((Math.min(d.total, niceMax) / niceMax) * innerH, 0)}" fill="transparent" ${isSel ? 'stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"' : ""}><title>${escapeHtml(filialFullName(d.filial))}: ${d.total} pneu(s)</title></rect>
        <text x="${x + w / 2}" y="${padT + innerH + 17}" text-anchor="middle" font-size="10.5" fill="#9aa0ac" font-family="'JetBrains Mono',monospace">${escapeHtml(filialSigla(d.filial))}</text>
      </g>`;
    });
    el.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">${grid}${bars}</svg>`;
    el.querySelectorAll(".bar-rect").forEach((g) => g.addEventListener("click", (ev) => onClickFilial(g.getAttribute("data-filial"), ev.ctrlKey || ev.metaKey)));
  }

  // Converte cor hex (#RRGGBB) pra rgba com alpha reduzido, usado só pra "apagar" fatias não
  // selecionadas no conic-gradient (que não suporta opacity por trecho, só cor). Cores em
  // formato var(--x) (usadas pelas outras abas, sem seleção clicável) passam direto.
  function hexToRgba(cor, alpha) {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(cor);
    if (!m) return cor;
    const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  // `selected`/`onClick` são opcionais: só usados pelo donut "Composição por faixa" de Pressão
  // de Ar (filtro cruzado clicando na legenda, mesmo padrão BI dos quadros/barras — Ctrl+clique
  // soma). Chamadas existentes sem esses 2 params continuam gerando o mesmo HTML de antes.
  // Cada item de `data` precisa de um `key` pra ser clicável (sem `key`, fica só decorativo).
  function renderDonut(containerId, data, selected, onClick) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const palette = ["var(--chart1)", "var(--chart2)", "var(--chart3)", "var(--chart4)", "var(--chart5)"];
    const colors = data.map((d, i) => d.color || palette[i % palette.length]);
    const total = data.reduce((s, d) => s + d.value, 0);
    if (total === 0) { el.innerHTML = `<p style="font-size:12px;color:var(--text-faint);text-align:center;padding:40px 0;">Sem dados.</p>`; return; }
    const hasSel = selected instanceof Set && selected.size > 0;
    const isSel = (d) => selected instanceof Set && d.key != null && selected.has(d.key);
    let acc = 0;
    // Guarda o intervalo em graus de cada fatia (mesmo cálculo do conic-gradient) pra permitir
    // clicar direto na cor da rosca, não só na legenda — ver o listener de clique mais abaixo.
    const fatias = [];
    const stops = data.map((d, i) => {
      const start = (acc / total) * 360; acc += d.value;
      const end = (acc / total) * 360;
      fatias.push({ key: d.key, start, end });
      const dim = hasSel && !isSel(d);
      const cor = dim ? hexToRgba(colors[i % colors.length], 0.22) : colors[i % colors.length];
      return `${cor} ${start}deg ${end}deg`;
    }).join(", ");
    const legend = data.map((d, i) => {
      const clicavel = !!onClick && d.key != null;
      const classes = ["legend-item"];
      if (clicavel) classes.push("legend-clicavel");
      if (isSel(d)) classes.push("legend-selected");
      const dim = hasSel && !isSel(d);
      const dataAttr = clicavel ? ` data-faixa="${escapeHtml(d.key)}"` : "";
      return `<div class="${classes.join(" ")}"${dataAttr} style="${dim ? "opacity:.4" : ""}"><span class="legend-dot" style="background:${colors[i % colors.length]}"></span>${escapeHtml(d.name)} <span class="mono" style="color:var(--text-faint)">(${d.value} · ${fmtPct((d.value / total) * 100)})</span></div>`;
    }).join("");
    el.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:4px;">
        <div class="donut-ring" style="width:158px;height:158px;border-radius:50%;background:conic-gradient(${stops});position:relative;${onClick ? "cursor:pointer;" : ""}">
          <div style="position:absolute;inset:24px;border-radius:50%;background:var(--surface);"></div>
        </div>
        <div class="legend-row" style="justify-content:center;margin-bottom:0;">${legend}</div>
      </div>`;
    if (onClick) {
      el.querySelectorAll("[data-faixa]").forEach((it) => it.addEventListener("click", (ev) => onClick(it.getAttribute("data-faixa"), ev.ctrlKey || ev.metaKey)));
      // Clique direto na cor da rosca: calcula o ângulo do clique em relação ao centro (mesma
      // convenção do conic-gradient — 0° no topo, sentido horário) e acha a fatia correspondente
      // pelo intervalo [start, end) guardado em `fatias`. Clique no buraco central (raio menor
      // que o anel) ou fora do círculo (raio maior que o externo) é ignorado.
      const ring = el.querySelector(".donut-ring");
      if (ring) {
        ring.addEventListener("click", (ev) => {
          const rect = ring.getBoundingClientRect();
          const R = rect.width / 2;
          const dx = ev.clientX - (rect.left + R);
          const dy = ev.clientY - (rect.top + R);
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > R || dist < R - 24) return;
          let ang = Math.atan2(dx, -dy) * (180 / Math.PI);
          if (ang < 0) ang += 360;
          if (ang >= 360) ang -= 360;
          const fatia = fatias.find((f) => f.key != null && ang >= f.start && ang < f.end);
          if (fatia) onClick(fatia.key, ev.ctrlKey || ev.metaKey);
        });
      }
    }
  }

  // ------------------------------------------------------------------
  // Shared UI builders
  // ------------------------------------------------------------------
  // `quadro`/`selected` são opcionais: só usados pelos KPIs "clicáveis" (padrão BI de
  // filtro cruzado, ver Pressão de Ar). Chamadas existentes sem esses 2 params continuam
  // gerando o mesmo HTML de antes.
  function kpiCard(label, value, hint, icon, tone, quadro, selected, extraHtml, valueArrowHtml) {
    const classes = ["card", "kpi"];
    if (quadro) classes.push("kpi-clicavel");
    if (selected) classes.push("kpi-selected");
    const dataAttr = quadro ? ` data-quadro="${escapeHtml(quadro)}"` : "";
    return `<div class="${classes.join(" ")}"${dataAttr}>
      <div class="kpi-glow" style="background:${tone}"></div>
      <div class="kpi-top">
        <span class="kpi-label">${escapeHtml(label)}</span>
        <span class="kpi-icon" style="color:${tone};background:${tone}1f;border:1px solid ${tone}40;">${icon}</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:8px;">
        <div class="kpi-value">${escapeHtml(String(value))}</div>
        ${valueArrowHtml || ""}
      </div>
      ${hint ? `<div class="kpi-hint">${escapeHtml(hint)}</div>` : ""}
      ${extraHtml || ""}
    </div>`;
  }
  // Histórico do "% pressão correta" no card do quadro (pedido do Joao, 2026-09-17): mostra
  // os últimos dias em que os dados foram atualizados (não é diário de verdade — só existe
  // ponto novo quando a planilha é atualizada e o painel é regerado, ver
  // build_pressao_correta_historico em generate_data.py), do mais recente pro mais antigo,
  // menor conforme mais antigo, com seta comparando cada ponto com o ANTERIOR a ele (verde
  // subiu, vermelho caiu, traço = igual). É a frota inteira/todas as filiais/última leitura
  // conhecida de cada pneu — pode não bater exatamente com o valor grande do card quando um
  // filtro de filial ou quinzena está ativo (por isso o rótulo deixa isso explícito).
  // Compara um ponto do histórico com o ANTERIOR a ele na série completa (não só dentro do
  // recorte exibido) e devolve o símbolo/cor da seta — compartilhado entre o histórico pequeno
  // embaixo do card e a seta ao lado do valor grande (mesma fonte, mesma regra).
  function setaPressaoCorreta(hist, idx) {
    const p = hist[idx];
    const anterior = idx > 0 ? hist[idx - 1] : null;
    if (!anterior) return { seta: "·", cor: "var(--text-faint)" };
    if (p.pctCorreta > anterior.pctCorreta) return { seta: "▲", cor: "var(--success)" };
    if (p.pctCorreta < anterior.pctCorreta) return { seta: "▼", cor: "var(--danger)" };
    return { seta: "—", cor: "var(--text-faint)" };
  }
  // Monta a série do histórico de "% pressão correta" pro ESCOPO DE FILIAL ativo agora
  // (pedido do Joao, 2026-09-17: "quero que puxe o historico por filial também. Se eu
  // clicar em limeira quero ver o historico só de limeira"). Reusa `activeScope()` — o
  // mesmo helper que já decide filial/seleção de barras pro resto da aba (donut, gráfico,
  // quadros clicáveis), então clicar numa barra OU escolher no dropdown "Todas as filiais"
  // já atualiza esse histórico automaticamente, sem código novo de filtro.
  // - escopo "all" (nada selecionado): usa DATA.pressaoCorretaHistorico (frota inteira).
  // - escopo 1 filial: usa DATA.pressaoCorretaHistoricoPorFilial[filial] direto.
  // - escopo Set de várias filiais (Ctrl+clique): SOMA corretos/totalComPadrao ponto a
  //   ponto (mesma data) entre as filiais selecionadas e recalcula o %, igual a rosca e
  //   os quadros já fazem quando várias filiais estão marcadas juntas.
  // dados.js gerado ANTES desta mudança não tem `pressaoCorretaHistoricoPorFilial` — nesse
  // caso cai de volta pro histórico geral (sem quebrar o card em painel antigo).
  //
  // Quinzena (pedido do Joao, 2026-09-25 — mesmo bug já corrigido no Sulco Baixo): o
  // histórico ficava sempre preso na série "geral" (mês inteiro) mesmo com "1ª quinzena"
  // ou "2ª quinzena" selecionadas no toggle de Pressão de Ar, então escolhemos a série
  // base (geral/Q1/Q2) conforme `state.pressaoRound` ANTES de aplicar o escopo de filial.
  // dados.js gerado antes desta mudança não tem as chaves Q1/Q2 — cai de volta pra geral.
  function pressaoCorretaSerieBase() {
    if (state.pressaoRound === "insp1") return DATA.pressaoCorretaHistoricoQ1 || DATA.pressaoCorretaHistorico || [];
    if (state.pressaoRound === "insp2") return DATA.pressaoCorretaHistoricoQ2 || DATA.pressaoCorretaHistorico || [];
    return DATA.pressaoCorretaHistorico || [];
  }
  function pressaoCorretaSerieBasePorFilial() {
    if (state.pressaoRound === "insp1") return DATA.pressaoCorretaHistoricoQ1PorFilial || DATA.pressaoCorretaHistoricoPorFilial;
    if (state.pressaoRound === "insp2") return DATA.pressaoCorretaHistoricoQ2PorFilial || DATA.pressaoCorretaHistoricoPorFilial;
    return DATA.pressaoCorretaHistoricoPorFilial;
  }
  function pressaoCorretaSerieParaEscopo() {
    const escopo = activeScope();
    const porFilial = pressaoCorretaSerieBasePorFilial();
    if (escopo === "all" || !porFilial) return pressaoCorretaSerieBase();
    const filiais = escopo instanceof Set ? Array.from(escopo) : [escopo];
    const series = filiais.map((f) => porFilial[f]).filter(Boolean);
    if (!series.length) return [];
    if (series.length === 1) return series[0];
    // Soma por data (todas as séries vêm do mesmo gerador, com a mesma lista de datas —
    // mas por segurança casamos por `data`, não por índice, e tratamos filial sem ponto
    // naquela data como 0/0, não como ausente).
    const porData = new Map();
    series.forEach((serie) => serie.forEach((p) => {
      const acc = porData.get(p.data) || { data: p.data, corretos: 0, totalComPadrao: 0 };
      acc.corretos += p.corretos || 0;
      acc.totalComPadrao += p.totalComPadrao || 0;
      porData.set(p.data, acc);
    }));
    return Array.from(porData.values())
      .sort((a, b) => a.data.localeCompare(b.data))
      .map((p) => ({ ...p, pctCorreta: p.totalComPadrao ? Math.round((p.corretos / p.totalComPadrao) * 1000) / 10 : null }));
  }
  // Rótulo do escopo pro cabeçalho do histórico — mesma convenção de `scopeLabelText()`
  // (usada nos outros hints da aba), só que sem o " — " na frente e com "Todas as
  // filiais" por extenso quando nada está filtrado (em vez de string vazia).
  function pressaoCorretaEscopoLabel() {
    const escopo = activeScope();
    const base = escopo === "all" ? "Todas as filiais"
      : escopo instanceof Set ? (escopo.size === 1 ? filialFullName(Array.from(escopo)[0]) : Array.from(escopo).map(filialSigla).join(" + "))
      : filialFullName(escopo);
    // Deixa explícito de qual quinzena é o histórico (2026-09-25, junto com a correção do
    // histórico não acompanhar o seletor de quinzena) — sem isso "Todas as filiais" sozinho
    // não diz se é 1ª, 2ª ou o mês inteiro.
    const rodada = state.pressaoRound === "insp1" ? " · 1ª quinzena" : state.pressaoRound === "insp2" ? " · 2ª quinzena" : "";
    return base + rodada;
  }
  // Seta ao lado do valor grande "% pressão correta" (2026-09-17, ajustado 2026-09-18): o
  // valor grande É o ponto mais recente da série (hoje) — o histórico abaixo (ver
  // `pressaoCorretaTrendHtml`) não repete essa data, só mostra os pontos ANTERIORES a ela.
  // Essa seta compara o ponto de hoje com o dia anterior, igual qualquer outra linha do
  // histórico compara com o dia anterior a ELA — é o mesmo tipo de seta, só que pro ponto
  // que agora "mora" no valor grande em vez de aparecer como uma linha do histórico.
  function pressaoCorretaValueArrowHtml() {
    const hist = pressaoCorretaSerieParaEscopo().filter((p) => p.pctCorreta != null);
    if (hist.length < 2) return "";
    const { seta, cor } = setaPressaoCorreta(hist, hist.length - 1);
    return `<span style="color:${cor};font-size:20px;font-weight:700;" title="Tendência (${escapeHtml(pressaoCorretaEscopoLabel())}) vs. a atualização anterior — só pneu lido no mesmo mês de cada ponto, mesma regra do valor ao lado">${seta}</span>`;
  }
  // Histórico dos pontos ANTERIORES ao mais recente. O ponto mais recente (hoje) já é o
  // próprio valor grande do card, com sua seta ao lado (`pressaoCorretaValueArrowHtml`) —
  // pedido do Joao, 2026-09-18: "quero que valor mais recente [...] não seja refletido no
  // maior", com o exemplo "xxx 14/09, 41,4 15/09, 42 16/09, GRANDE - 41,8 17/09" — ou seja,
  // o histórico embaixo do card lista só os pontos ANTES de hoje (não repete a data/valor
  // de hoje, que já é o "GRANDE"). Cada linha do histórico mostra sua PRÓPRIA seta,
  // comparando com o ponto anterior a ELA na série completa (não com o valor grande).
  function pressaoCorretaTrendHtml() {
    const hist = pressaoCorretaSerieParaEscopo().filter((p) => p.pctCorreta != null);
    if (hist.length < 2) return "";
    const semMaisRecente = hist.slice(0, -1); // tira o ponto de hoje, que já é o valor grande
    const ultimos = semMaisRecente.slice(-3);
    const linhas = ultimos.map((p) => {
      const idx = hist.indexOf(p);
      const { seta, cor } = setaPressaoCorreta(hist, idx);
      const diaMes = /^\d{4}-\d{2}-\d{2}/.test(p.data) ? `${p.data.slice(8, 10)}/${p.data.slice(5, 7)}` : p.data;
      return { pctCorreta: p.pctCorreta, diaMes, seta, cor };
    }).reverse();
    if (!linhas.length) return "";
    const linhasHtml = linhas.map((l, i) => {
      const fonte = i === 0 ? "12.5px" : i === 1 ? "11.5px" : "11px";
      const peso = i === 0 ? "700" : "600";
      return `<div style="display:flex;align-items:center;gap:5px;font-size:${fonte};font-weight:${peso};color:var(--text-dim);margin-top:3px;">
        <span style="color:${l.cor};width:10px;display:inline-block;text-align:center;">${l.seta}</span>
        <span style="color:var(--text);">${fmtPct(l.pctCorreta)}</span>
        <span style="color:var(--text-faint);font-weight:400;">${l.diaMes}</span>
      </div>`;
    }).join("");
    return `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-strong);">
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:2px;" title="Cada ponto conta só pneu lido no mês daquele ponto (mesma régua do valor grande) — não mistura leitura de mês passado. Não repete a data de hoje, que já é o valor grande acima.">Histórico · ${escapeHtml(pressaoCorretaEscopoLabel())}</div>
      ${linhasHtml}
    </div>`;
  }

  // ------------------------------------------------------------------
  // Histórico/seta dos 4 primeiros quadros da aba Sulco Baixo (pedido do Joao,
  // 2026-09-18: "quero essa mesma regra pros 4 primeiros quadros do sulco baixo" — mesmo
  // padrão de valor grande + seta + histórico sem repetir hoje já usado em "% pressão
  // correta", com filtro por filial desde o início (ele pediu explicitamente dessa vez).
  // Diferença importante de cor: em pressão, MAIS "% correta" é sempre melhor (verde =
  // subiu). Em sulco é o oposto — mais veículo/pneu afetado é sempre PIOR, então aqui
  // "subiu" é vermelho e "desceu" é verde. `setaTendenciaPior` existe só por causa dessa
  // inversão; `setaPressaoCorreta` (pressão) continua com a convenção normal, sem mudança.
  // ------------------------------------------------------------------
  function setaTendenciaPior(atual, anterior) {
    if (atual == null || anterior == null) return { seta: "·", cor: "var(--text-faint)" };
    if (atual > anterior) return { seta: "▲", cor: "var(--danger)" };
    if (atual < anterior) return { seta: "▼", cor: "var(--success)" };
    return { seta: "—", cor: "var(--text-faint)" };
  }
  // Série de pontos {data, veiculosAfetados, totalRegistrados, pneusParaTrocar,
  // pneusEmAtencao} pro escopo de filial ativo — mesmo padrão de
  // pressaoCorretaSerieParaEscopo() (soma os 4 números quando várias filiais estão
  // selecionadas via Ctrl+clique, e recalcula quem depende de razão — % da frota — em
  // cima da soma, não da média das razões individuais).
  function sulcoKpisSerieParaEscopo() {
    const escopo = activeScope();
    const porFilial = DATA.sulcoKpisHistoricoPorFilial;
    if (escopo === "all" || !porFilial) return DATA.sulcoKpisHistorico || [];
    const filiais = escopo instanceof Set ? Array.from(escopo) : [escopo];
    const series = filiais.map((f) => porFilial[f]).filter(Boolean);
    if (!series.length) return [];
    if (series.length === 1) return series[0];
    const porData = new Map();
    series.forEach((serie) => serie.forEach((p) => {
      const acc = porData.get(p.data) || { data: p.data, veiculosAfetados: 0, totalRegistrados: 0, pneusParaTrocar: 0, pneusEmAtencao: 0, veiculosParaTrocar: 0, _temVeiculosParaTrocar: false };
      acc.veiculosAfetados += p.veiculosAfetados || 0;
      acc.totalRegistrados += p.totalRegistrados || 0;
      acc.pneusParaTrocar += p.pneusParaTrocar || 0;
      acc.pneusEmAtencao += p.pneusEmAtencao || 0;
      // veiculosParaTrocar é campo novo (2026-09-24) — pontos antigos não têm essa chave.
      // Só soma (e marca "tem dado") quando o ponto de origem realmente traz o campo;
      // senão o ponto agregado fica sem o campo (null), não com um 0 enganoso.
      if (p.veiculosParaTrocar != null) { acc.veiculosParaTrocar += p.veiculosParaTrocar; acc._temVeiculosParaTrocar = true; }
      porData.set(p.data, acc);
    }));
    return Array.from(porData.values()).map((acc) => {
      if (!acc._temVeiculosParaTrocar) acc.veiculosParaTrocar = null;
      delete acc._temVeiculosParaTrocar;
      return acc;
    }).sort((a, b) => a.data.localeCompare(b.data));
  }
  // `metricFn` extrai o número a exibir de um ponto da série (ex.: p => p.veiculosAfetados,
  // ou p => % calculada a partir de veiculosAfetados/totalRegistrados). `formatFn` formata
  // esse número pro texto (fmtInt ou fmtPct). Reaproveitado pelas 4 versões abaixo (uma por
  // quadro) em vez de 4 cópias quase idênticas da mesma lógica de seta/histórico.
  function sulcoKpiValueArrowHtml(metricFn) {
    // Pontos sem o campo que metricFn usa (ex.: veiculosParaTrocar não existe em pontos
    // gravados antes de 2026-09-24) são tratados como "não fazem parte da série" — não
    // como 0/null misturado na sequência, senão a seta compararia hoje contra um "0" que
    // na real é só ausência de dado antigo.
    const serie = sulcoKpisSerieParaEscopo().map((p) => metricFn(p)).filter((v) => v != null);
    if (serie.length < 2) return "";
    const { seta, cor } = setaTendenciaPior(serie[serie.length - 1], serie[serie.length - 2]);
    return `<span style="color:${cor};font-size:20px;font-weight:700;" title="Tendência (${escapeHtml(pressaoCorretaEscopoLabel())}) vs. a atualização anterior">${seta}</span>`;
  }
  function sulcoKpiTrendHtml(metricFn, formatFn) {
    const pontos = sulcoKpisSerieParaEscopo().filter((p) => metricFn(p) != null);
    const serie = pontos.map((p) => metricFn(p));
    if (serie.length < 2) return "";
    // mesma regra da Vigésima terceira mudança (pressão): o ponto de hoje já é o valor
    // grande, o histórico abaixo lista só os pontos ANTERIORES a ele.
    const semMaisRecente = pontos.slice(0, -1);
    const ultimos = semMaisRecente.slice(-3);
    const linhas = ultimos.map((p) => {
      const idx = pontos.indexOf(p);
      const valor = metricFn(p);
      const anterior = idx > 0 ? metricFn(pontos[idx - 1]) : null;
      const { seta, cor } = setaTendenciaPior(valor, anterior);
      const diaMes = /^\d{4}-\d{2}-\d{2}/.test(p.data) ? `${p.data.slice(8, 10)}/${p.data.slice(5, 7)}` : p.data;
      return { valor, diaMes, seta, cor };
    }).reverse();
    if (!linhas.length) return "";
    const linhasHtml = linhas.map((l, i) => {
      const fonte = i === 0 ? "12.5px" : i === 1 ? "11.5px" : "11px";
      const peso = i === 0 ? "700" : "600";
      return `<div style="display:flex;align-items:center;gap:5px;font-size:${fonte};font-weight:${peso};color:var(--text-dim);margin-top:3px;">
        <span style="color:${l.cor};width:10px;display:inline-block;text-align:center;">${l.seta}</span>
        <span style="color:var(--text);">${formatFn(l.valor)}</span>
        <span style="color:var(--text-faint);font-weight:400;">${l.diaMes}</span>
      </div>`;
    }).join("");
    return `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-strong);">
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:2px;" title="1 ponto por dia — atualizar de novo no mesmo dia substitui o ponto de hoje, não duplica. Não repete a data de hoje, que já é o valor grande acima.">Histórico · ${escapeHtml(pressaoCorretaEscopoLabel())}</div>
      ${linhasHtml}
    </div>`;
  }
  // % da frota afetada arredondado (1 casa) — usado IGUAL tanto na seta do valor grande quanto
  // no histórico, pra não correr risco de arredondamento fazer os dois discordarem sobre se
  // subiu/desceu/empatou (ex.: 52.44% vs 52.46% arredondam pro mesmo 52.4%, então tem que ser
  // sempre o valor JÁ arredondado que entra no setaTendenciaPior, não o raw ratio).
  function sulcoPctFrotaMetric(p) {
    return p.totalRegistrados ? Math.round((p.veiculosAfetados / p.totalRegistrados) * 1000) / 10 : null;
  }
  // Mesma conta de sulcoPctFrotaMetric, mas em cima de veiculosParaTrocar (critério ≤3mm) —
  // usada quando o toggle "Somente ≤3mm (trocar)" está ativo (2026-09-24, corrige o
  // histórico do quadro "% da frota afetada" não acompanhar o número grande nesse modo).
  function sulcoPctFrotaParaTrocarMetric(p) {
    if (!p.totalRegistrados || p.veiculosParaTrocar == null) return null;
    return Math.round((p.veiculosParaTrocar / p.totalRegistrados) * 1000) / 10;
  }
  function severityPill(level, label) {
    const cls = level === "danger" ? "pill-danger" : level === "warning" ? "pill-warning" : level === "success" ? "pill-success" : "pill-neutral";
    return `<span class="pill ${cls}"><span class="pill-dot"></span>${escapeHtml(label)}</span>`;
  }
  function ringKpi(pct, tone, totalValue, feitos, pendentes) {
    const track = "rgba(255,255,255,0.09)";
    const clamped = Math.max(0, Math.min(100, pct));
    const deg = clamped * 3.6;
    return `<div class="card kpi-ring">
      <div class="ring-visual" style="background:conic-gradient(${tone} 0deg ${deg}deg, ${track} ${deg}deg 360deg);">
        <div class="ring-hole"><span class="ring-pct" style="color:${tone}">${fmtPct(pct)}</span></div>
      </div>
      <div class="ring-info">
        <span class="kpi-label">Total da frota</span>
        <div class="kpi-value">${fmtInt(totalValue)}</div>
        <div class="kpi-hint">${fmtInt(feitos)} feitos · ${fmtInt(pendentes)} pendentes</div>
      </div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // Painel: Posições Vazias
  // ------------------------------------------------------------------
  function computeVazias() {
    let rows = DATA.vazias;
    if (state.filtroFilial !== "all") rows = rows.filter((r) => r.filial === state.filtroFilial);
    if (state.busca) rows = rows.filter((r) => r.placa.toLowerCase().includes(state.busca.toLowerCase()));
    const filtered = scopeRows(rows);
    const totalPos = filtered.reduce((s, r) => s + r.posicoes.length, 0);
    const denom = registradosTotal(activeScope());
    const pct = denom ? (filtered.length / denom) * 100 : 0;
    const byFilialMap = new Map();
    rows.forEach((r) => byFilialMap.set(r.filial, (byFilialMap.get(r.filial) || 0) + 1));
    const barData = Array.from(byFilialMap, ([filial, veiculos]) => {
      const reg = registradosTotal(filial);
      return { filial, veiculos, pct: reg ? (veiculos / reg) * 100 : 0 };
    }).sort((a, b) => b.veiculos - a.veiculos);
    const top = barData[0] || { filial: "—", veiculos: 0, pct: 0 };
    const tipoMap = new Map();
    filtered.forEach((r) => tipoMap.set(r.tipoCod, (tipoMap.get(r.tipoCod) || 0) + 1));
    const pieData = Array.from(tipoMap, ([name, value]) => ({ name, value }));
    return { filtered, totalPos, barData, top, denom, pct, pieData };
  }

  function renderVaziasPanel() {
    const d = computeVazias();
    const filiais = Array.from(new Set(DATA.vazias.map((r) => r.filial))).sort();
    return `
      ${panelHeader("Posições Vazias", "Veículos com posições de pneu vazias no sistema de gestão.", filiais)}
      <div class="kpi-grid">
        ${kpiCard("Veículos com falha", d.filtered.length, `de ${d.denom} veículos registrados${scopeLabelText()}`, ICONS.truck, "var(--warning)")}
        ${kpiCard("% da frota com posição vazia", fmtPct(d.pct), `veículos com falha ÷ frota registrada${scopeLabelText()}`, ICONS.gauge, d.pct >= 30 ? "var(--danger)" : d.pct >= 15 ? "var(--warning)" : "var(--success)")}
        ${kpiCard("Posições vazias", d.totalPos, "soma de posições ausentes", ICONS.alert, "var(--danger)")}
        ${kpiCard("Filial mais crítica (%)", filialSigla(d.top.filial), d.top.veiculos > 0 ? `${d.top.veiculos} de ${registradosTotal(d.top.filial)} (${fmtPct(d.top.pct)}) — ${filialFullName(d.top.filial)}` : "—", ICONS.building, "var(--accent)")}
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-title">Qtd. de veículos com posição vazia, por filial</div>
          ${chartHint()}
          <div id="chart-vazias-bar"></div>
        </div>
        <div class="card">
          <div class="card-title">Por tipo de veículo</div>
          <div id="chart-vazias-pie"></div>
        </div>
      </div>
      <div class="sulco-layout">
        <div class="table-wrap" style="margin:0;">
          <table>
            <thead><tr>${sortTh("placa", "Placa")}${sortTh("filial", "Filial")}${sortTh("tipo", "Tipo")}${sortTh("odometro", "Odômetro")}${sortTh("data", "Data")}${sortTh("posicoes", "Posições removidas")}</tr></thead>
            <tbody>
              ${d.filtered.length === 0 ? emptyRow(6, "Nenhum veículo com posição vazia.") :
                applySort(d.filtered, {
                  placa: (r) => r.placa, filial: (r) => normalizeText(filialFullName(r.filial)),
                  tipo: (r) => r.tipoDesc, odometro: (r) => r.odometro, data: (r) => r.dataEm,
                  posicoes: (r) => r.posicoes.length,
                }).map((r) => `<tr class="vazias-row ${state.selVeiculoVazias === r.placa ? "selected" : ""}" data-placa="${escapeHtml(r.placa)}">
                  <td class="mono" style="font-weight:600;">${escapeHtml(r.placa)}</td>
                  <td>${escapeHtml(filialSigla(r.filial))} <span style="color:var(--text-faint)">— ${escapeHtml(filialFullName(r.filial))}</span></td>
                  <td style="color:var(--text-dim);">${escapeHtml(r.tipoDesc)}</td>
                  <td class="mono">${fmtInt(r.odometro)} km</td>
                  <td class="mono">${fmtDate(r.dataEm)}</td>
                  <td>${severityPill(r.posicoes.length >= 4 ? "danger" : r.posicoes.length >= 2 ? "warning" : "neutral", r.posicoes.join(" · "))}</td>
                </tr>`).join("")}
            </tbody>
          </table>
          <div class="table-note">Clique numa linha pra ver no mapa qual posição está sem pneu.</div>
        </div>
        ${renderVaziasDetail(d)}
      </div>`;
  }

  // ------------------------------------------------------------------
  // Painel: Inspeções Pendentes
  // ------------------------------------------------------------------
  // Rótulos das 3 fatias da rosca "Composição das pendências" (modo Geral) — mesmas chaves já
  // usadas em `r.status` (cronico/so_q1/so_q2), reaproveitadas como `key` do donut pra permitir
  // clique/Ctrl+clique, igual à rosca "Composição por faixa" de Pressão de Ar.
  const INSP_GERAL_FAIXA_LABEL = { cronico: "Pendente nas 2 quinzenas", so_q1: "Só pendente na 1ª quinzena", so_q2: "Só pendente na 2ª quinzena" };
  // Clicar numa fatia/legenda da rosca filtra o gráfico de barras por filial e a tabela abaixo
  // pra só aquela(s) situação(ões) — Ctrl+clique soma mais de uma, mesmo padrão BI já usado em
  // Pressão de Ar. NÃO filtra a própria rosca (mesmo motivo já documentado em `togglePressaoFaixa`
  // — filtrar o donut pela própria seleção faria as outras fatias sumirem dele mesmo).
  function toggleInspGeralFaixa(faixa, multi) {
    if (multi) {
      if (state.inspGeralFaixaSel.has(faixa)) state.inspGeralFaixaSel.delete(faixa);
      else state.inspGeralFaixaSel.add(faixa);
    } else {
      if (state.inspGeralFaixaSel.size === 1 && state.inspGeralFaixaSel.has(faixa)) state.inspGeralFaixaSel.clear();
      else { state.inspGeralFaixaSel.clear(); state.inspGeralFaixaSel.add(faixa); }
    }
    render();
  }
  function inspGeralFaixaHint() {
    if (state.inspGeralFaixaSel.size === 0) {
      return `<div class="chart-hint">Clique numa fatia acima pra filtrar o gráfico de barras e a tabela · Ctrl+clique pra combinar várias.</div>`;
    }
    const names = Array.from(state.inspGeralFaixaSel).map((k) => INSP_GERAL_FAIXA_LABEL[k] || k).join(", ");
    return `<div class="chart-hint">Filtrando por situação: <strong style="color:var(--text-dim)">${escapeHtml(names)}</strong><button class="clear-sel-btn" id="clear-insp-faixa-sel">limpar seleção</button></div>`;
  }
  function computeInspecoes() {
    // Mês selecionado no dropdown (ou o mais recente disponível, por padrão). historicoMensal
    // guarda um snapshot insp1/insp2 por mês; sem ele (DATA antigo), cai de volta pros campos
    // DATA.insp1/insp2 direto (mês corrente), pra não quebrar painéis já gerados antes disso.
    const mesAtivo = state.inspMes || mesInspPadrao();
    const mesDados = (DATA.historicoMensal && DATA.historicoMensal[mesAtivo]) || {
      insp1: DATA.insp1, insp2: DATA.insp2, insp1Disponivel: DATA.insp1Disponivel, insp2Disponivel: DATA.insp2Disponivel,
    };
    if (state.inspRound === "geral") {
      // Disponível = false só quando a quinzena foi explicitamente zerada (sem dado ainda),
      // não quando ela genuinamente tem zero pendências. DATA antigo (sem essas chaves) é
      // tratado como "disponível", pra não quebrar painéis já gerados antes dessa correção.
      const insp1Ok = mesDados.insp1Disponivel !== false;
      const insp2Ok = mesDados.insp2Disponivel !== false;
      const map1 = new Map(mesDados.insp1.map((r) => [r.veiculo, r]));
      const map2 = new Map(mesDados.insp2.map((r) => [r.veiculo, r]));
      const veiculos = Array.from(new Set([...map1.keys(), ...map2.keys()]));
      const unionAll = veiculos.map((veiculo) => {
        const r1 = map1.get(veiculo), r2 = map2.get(veiculo);
        const status = r1 && r2 ? "cronico" : r1 && !r2 ? "so_q1" : "so_q2";
        const base = r2 || r1;
        return { veiculo, filial: base.filial, classe: base.classe, emQ1: !!r1, emQ2: !!r2, status };
      });
      let rows = unionAll;
      if (state.filtroFilial !== "all") rows = rows.filter((r) => r.filial === state.filtroFilial);
      if (state.busca) rows = rows.filter((r) => r.veiculo.toLowerCase().includes(state.busca.toLowerCase()));
      const filtered = scopeRows(rows);
      const scopeFilial = activeScope();
      const denom = registradosTotal(scopeFilial);
      const cronico = filtered.filter((r) => r.status === "cronico").length;
      const soQ1 = filtered.filter((r) => r.status === "so_q1").length;
      const soQ2 = filtered.filter((r) => r.status === "so_q2").length;
      // "Pendente" de verdade, com as DUAS quinzenas disponíveis, é crônico (não inspecionado
      // em nenhuma das duas). Mas se uma quinzena ainda não tem dado (zerada), crônico sempre
      // dá 0 — o que faria parecer que "tudo foi feito" quando na real só falta dado da outra
      // quinzena. Nesse caso, "pendente" cai pro que a quinzena disponível mostra.
      const pendenteFn = insp1Ok && insp2Ok ? (r) => r.status === "cronico"
        : insp1Ok ? (r) => r.emQ1
        : insp2Ok ? (r) => r.emQ2
        : () => false;
      const pendentesReais = filtered.filter(pendenteFn).length;
      const pct = denom ? (pendentesReais / denom) * 100 : 0;
      const pctAtingido = 100 - pct;
      // Seleção da rosca "Composição das pendências" (clique/Ctrl+clique numa fatia). NÃO entra
      // nos números acima (cronico/soQ1/soQ2/pendentesReais/pct) — esses continuam sendo o
      // resumo "de verdade" do mês, igual ao "% pressão correta" de Pressão de Ar não mudar só
      // porque uma faixa foi selecionada na rosca de lá. A seleção só cruza pro gráfico de
      // barras (abaixo) e pra tabela (via `filteredTabela`, retornado separado de `filtered`).
      const selFaixaInsp = state.inspGeralFaixaSel;
      const passaFaixaInsp = (r) => selFaixaInsp.size === 0 || selFaixaInsp.has(r.status);
      const byFilialMap = new Map();
      const rowsParaBarra = selFaixaInsp.size === 0 ? rows.filter(pendenteFn) : rows.filter(passaFaixaInsp);
      rowsParaBarra.forEach((r) => byFilialMap.set(r.filial, (byFilialMap.get(r.filial) || 0) + 1));
      const barData = Array.from(byFilialMap, ([filial, veiculos]) => {
        const reg = registradosTotal(filial);
        return { filial, veiculos, pct: reg ? (veiculos / reg) * 100 : 0 };
      }).sort((a, b) => b.veiculos - a.veiculos);
      const pieData = [
        { key: "cronico", name: INSP_GERAL_FAIXA_LABEL.cronico, value: cronico, color: "var(--danger)" },
        { key: "so_q1", name: INSP_GERAL_FAIXA_LABEL.so_q1, value: soQ1, color: "var(--text-faint)" },
        { key: "so_q2", name: INSP_GERAL_FAIXA_LABEL.so_q2, value: soQ2, color: "var(--warning)" },
      ].filter((p) => p.value > 0);
      const filteredTabela = filtered.filter(passaFaixaInsp);
      return { filtered, filteredTabela, barData, source: unionAll, cronico, soQ1, soQ2, pendentesReais, pct, pctAtingido, denom, scopeFilial, pieData, geral: true, insp1Ok, insp2Ok, mesAtivo };
    }
    const source = state.inspRound === "insp1" ? mesDados.insp1 : mesDados.insp2;
    let rows = source;
    if (state.filtroFilial !== "all") rows = rows.filter((r) => r.filial === state.filtroFilial);
    if (state.busca) rows = rows.filter((r) => r.veiculo.toLowerCase().includes(state.busca.toLowerCase()));
    const filtered = scopeRows(rows);
    const scopeFilial = activeScope();
    const denom = registradosTotal(scopeFilial);
    const pct = denom ? (filtered.length / denom) * 100 : 0;
    const pctAtingido = 100 - pct;
    const byFilialMap = new Map();
    rows.forEach((r) => byFilialMap.set(r.filial, (byFilialMap.get(r.filial) || 0) + 1));
    const barData = Array.from(byFilialMap, ([filial, veiculos]) => {
      const reg = registradosTotal(filial);
      return { filial, veiculos, pct: reg ? (veiculos / reg) * 100 : 0 };
    }).sort((a, b) => b.veiculos - a.veiculos);
    const top = barData[0] || { filial: "—", veiculos: 0, pct: 0 };
    // Quinzena ainda sem leitura (ex.: 2ª quinzena antes do dia 16): "0 pendentes" aqui NÃO
    // significa "100% inspecionado", significa "não sei ainda". Mesmo critério do Geral acima
    // e do quadro "% veículos inspecionados" da aba Pressão de Ar (xDisponivel !== false).
    const disponivel = state.inspRound === "insp1" ? mesDados.insp1Disponivel !== false : mesDados.insp2Disponivel !== false;
    return { filtered, barData, top, source, pct, pctAtingido, denom, scopeFilial, geral: false, mesAtivo, disponivel };
  }

  function renderInspecoesPanel() {
    const d = computeInspecoes();
    const filiais = Array.from(new Set(d.source.map((r) => r.filial))).sort();
    const rounds = `<div class="seg-group">
        <button class="seg-btn ${state.inspRound === "insp1" ? "active" : ""}" data-round="insp1">1ª quinzena</button>
        <button class="seg-btn ${state.inspRound === "insp2" ? "active" : ""}" data-round="insp2">2ª quinzena</button>
        <button class="seg-btn ${state.inspRound === "geral" ? "active" : ""}" data-round="geral">Geral (mês)</button>
      </div>`;
    // Seletor de mês: só aparece quando há mais de um mês acumulado no histórico (o retroativo
    // não existe — o painel começa só com o mês atual e vai ganhando opções com o tempo).
    const mesesDisponiveis = Object.keys(DATA.historicoMensal || {}).sort();
    const mesSelect = mesesDisponiveis.length > 1 ? `<select id="ctl-mes-insp">
        ${mesesDisponiveis.slice().reverse().map((m) => `<option value="${m}" ${m === d.mesAtivo ? "selected" : ""}>${escapeHtml(fmtMesAno(m))}</option>`).join("")}
      </select>` : "";

    const scopeLabel = scopeLabelText();

    if (d.geral) {
      const ambosOk = d.insp1Ok && d.insp2Ok;
      const nenhumOk = !d.insp1Ok && !d.insp2Ok;
      const faltando = !d.insp1Ok ? "1ª" : !d.insp2Ok ? "2ª" : null;
      const descricaoGeral = ambosOk
        ? "Situação do mês: \"pendente\" conta só quem não foi inspecionado em nenhuma das duas quinzenas. A tabela abaixo lista também quem apareceu em só uma delas, para contexto."
        : nenhumOk
        ? "Situação do mês: nenhuma das duas quinzenas tem dado atualizado ainda."
        : `Situação do mês: a quinzena ${faltando} ainda não tem dado atualizado — "pendente" está mostrando só a quinzena disponível, não a interseção das duas.`;
      const cardsExtras = ambosOk
        ? `${kpiCard("Pendente nas 2 quinzenas", d.cronico, "não inspecionado em nenhuma das duas checagens", ICONS.alert, "var(--danger)")}
           ${kpiCard("Pendente em só 1 quinzena", d.soQ1 + d.soQ2, `${d.soQ1} só na 1ª · ${d.soQ2} só na 2ª — não confirma que foi regularizado`, ICONS.clipboard, "var(--warning)")}`
        : nenhumOk
        ? `${kpiCard("Pendente no mês", 0, "sem dado de nenhuma quinzena ainda", ICONS.clipboard, "var(--text-faint)")}`
        : `${kpiCard("Pendente no mês", d.pendentesReais, `quinzena ${faltando} sem dado atualizado — contando só a quinzena disponível`, ICONS.alert, "var(--warning)")}`;
      const tituloBarra = ambosOk ? "Qtd. de veículos pendentes nas 2 quinzenas, por filial" : "Qtd. de veículos pendentes no mês, por filial";
      return `
        ${panelHeader("Inspeções Pendentes", descricaoGeral, filiais, rounds + mesSelect)}
        <div class="kpi-grid">
          ${ringKpi(d.pctAtingido, d.pctAtingido >= 85 ? "var(--success)" : d.pctAtingido >= 70 ? "var(--warning)" : "var(--danger)", d.denom, Math.max(0, d.denom - d.pendentesReais), d.pendentesReais)}
          ${kpiCard("% pendente no mês", fmtPct(d.pct), `de ${d.denom} veículos registrados${scopeLabel}`, ICONS.alert, d.pct >= 30 ? "var(--danger)" : d.pct >= 15 ? "var(--warning)" : "var(--success)")}
          ${cardsExtras}
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-title">${tituloBarra}</div>
            ${chartHint()}
            <div id="chart-insp-bar"></div>
          </div>
          <div class="card">
            <div class="card-title">Composição das pendências no mês${scopeLabel}</div>
            ${inspGeralFaixaHint()}
            <div id="chart-insp-pie"></div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>${sortTh("veiculo", "Veículo")}${sortTh("filial", "Filial")}${sortTh("classe", "Classe")}${sortTh("q1", "1ª quinz.")}${sortTh("q2", "2ª quinz.")}${sortTh("situacao", "Situação")}</tr></thead>
            <tbody>
              ${d.filteredTabela.length === 0 ? emptyRow(6, "Nenhum veículo encontrado.") :
                applySort(d.filteredTabela, {
                  veiculo: (r) => r.veiculo, filial: (r) => normalizeText(filialFullName(r.filial)),
                  classe: (r) => r.classe || "", q1: (r) => r.emQ1 ? 1 : 0, q2: (r) => r.emQ2 ? 1 : 0,
                  situacao: (r) => r.status === "cronico" ? 2 : r.status === "so_q2" ? 1 : 0,
                }).map((r) => `<tr>
                  <td class="mono" style="font-weight:600;">${escapeHtml(r.veiculo)}</td>
                  <td>${escapeHtml(filialSigla(r.filial))} <span style="color:var(--text-faint)">— ${escapeHtml(filialFullName(r.filial))}</span></td>
                  <td style="color:var(--text-dim);">${escapeHtml(r.classe || "—")}</td>
                  <td>${r.emQ1 ? severityPill("neutral", "sim") : `<span style="color:var(--text-faint)">—</span>`}</td>
                  <td>${r.emQ2 ? severityPill("neutral", "sim") : `<span style="color:var(--text-faint)">—</span>`}</td>
                  <td>${r.status === "cronico" ? severityPill("danger", "Nas 2 quinzenas") : r.status === "so_q1" ? severityPill("neutral", "Só 1ª quinzena") : severityPill("warning", "Só 2ª quinzena")}</td>
                </tr>`).join("")}
            </tbody>
          </table>
          <div class="table-note">${d.filteredTabela.length} de ${d.source.length} veículos únicos no mês${scopeLabel} · aparecer em só uma quinzena não confirma regularização, apenas que não constou pendente na outra checagem.</div>
        </div>`;
    }

    if (d.disponivel === false) {
      const qLabel = state.inspRound === "insp1" ? "1ª" : "2ª";
      return `
        ${panelHeader("Inspeções Pendentes", "Veículos não inspecionados no período, por quinzena de auditoria.", filiais, rounds + mesSelect)}
        <div class="kpi-grid">
          ${kpiCard("Total da frota", d.denom, `veículos registrados${scopeLabel}`, ICONS.truck, "var(--text-faint)")}
          ${kpiCard("% da frota parada", "—", `${qLabel} quinzena ainda sem leitura`, ICONS.alert, "var(--text-faint)")}
        </div>
        <div class="card">
          <div class="card-title">${qLabel} quinzena ainda sem dado</div>
          <div class="chart-hint">A ${qLabel} quinzena de ${escapeHtml(fmtMesAno(d.mesAtivo))} ainda não tem leitura de inspeção atualizada${state.inspRound === "insp2" ? " (ela só começa no dia 16)" : ""}. Isso não quer dizer que todos os veículos foram inspecionados — quando a primeira leitura entrar, os números aparecem aqui.</div>
        </div>`;
    }

    return `
      ${panelHeader("Inspeções Pendentes", "Veículos não inspecionados no período, por quinzena de auditoria.", filiais, rounds + mesSelect)}
      <div class="kpi-grid">
        ${ringKpi(d.pctAtingido, d.pctAtingido >= 85 ? "var(--success)" : d.pctAtingido >= 70 ? "var(--warning)" : "var(--danger)", d.denom, Math.max(0, d.denom - d.filtered.length), d.filtered.length)}
        ${kpiCard("% da frota parada", fmtPct(d.pct), `pendentes ÷ frota registrada${scopeLabel}`, ICONS.alert, d.pct >= 30 ? "var(--danger)" : d.pct >= 15 ? "var(--warning)" : "var(--success)")}
        ${kpiCard("Filial mais crítica (%)", filialSigla(d.top.filial), d.top.veiculos > 0 ? `${d.top.veiculos} de ${registradosTotal(d.top.filial)} (${fmtPct(d.top.pct)}) — ${filialFullName(d.top.filial)}` : "—", ICONS.building, "var(--danger)")}
        ${kpiCard("Filiais afetadas", d.barData.length, "com ao menos 1 pendência", ICONS.clipboard, "var(--accent)")}
      </div>
      <div class="card">
        <div class="card-title">Qtd. de veículos pendentes por filial</div>
        ${chartHint()}
        <div id="chart-insp-bar"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>${sortTh("veiculo", "Veículo")}${sortTh("filial", "Filial")}${sortTh("classe", "Classe")}</tr></thead>
          <tbody>
            ${d.filtered.length === 0 ? emptyRow(3, "Nenhum veículo pendente.") :
              applySort(d.filtered, {
                veiculo: (r) => r.veiculo, filial: (r) => normalizeText(filialFullName(r.filial)),
                classe: (r) => r.classe || "",
              }).map((r) => `<tr>
                <td class="mono" style="font-weight:600;">${escapeHtml(r.veiculo)}</td>
                <td>${escapeHtml(filialSigla(r.filial))} <span style="color:var(--text-faint)">— ${escapeHtml(filialFullName(r.filial))}</span></td>
                <td style="color:var(--text-dim);">${escapeHtml(r.classe || "—")}</td>
              </tr>`).join("")}
          </tbody>
        </table>
        <div class="table-note">${d.filtered.length} de ${d.source.length} veículos na ${state.inspRound === "insp1" ? "1ª" : "2ª"} quinzena${scopeLabel}.</div>
      </div>`;
  }

  // ------------------------------------------------------------------
  // Painel: Sulco Baixo
  // ------------------------------------------------------------------
  // Classificação: <=3mm precisa trocar já; 3,1 a 5mm requer atenção (troca em breve); >5mm ok.
  function tireStatus(sulco) {
    if (sulco == null) return "ok";
    if (sulco <= 3) return "trocar";
    if (sulco <= 5) return "atencao";
    return "ok";
  }
  function tireColor(status) {
    return status === "trocar" ? "var(--danger)" : status === "atencao" ? "var(--warning)" : "var(--text-faint)";
  }
  function tireBg(status) {
    return status === "trocar" ? "var(--danger-bg)" : status === "atencao" ? "var(--warning-bg)" : "var(--surface-2)";
  }
  // Decodifica o código de posição do pneu (ex.: "1LEE", "TDI", "2DE", "ZZZ") em eixo/lado/externo-interno,
  // inferido a partir dos códigos observados na planilha. Códigos não reconhecidos caem em "outro".
  // Decodifica o código de posição em {group, kind, side, io}. NÃO tentamos inferir a ordem
  // física do eixo a partir do número embutido no código (ex.: "1L" vs "2T") — comparando com
  // os prints de referência do sistema de origem, essa ordem numérica não é consistente entre
  // categorias de veículo (ex.: um "T" sem número pode vir ANTES de um "1L"). A ordem física
  // real (dianteira → traseira) é a ordem em que as posições aparecem na planilha de origem,
  // que é a mesma ordem em que os pneus do veículo chegam aqui — por isso a ordenação dos eixos
  // é feita em renderTireDiagram() pela ordem de primeira ocorrência, não por este código.
  function parsePosicao(code) {
    if (code === "ZZZ" || code === "ZZZ1") return { group: "estepe", kind: "spare", side: null, io: null, letter: null, num: null };
    let m = code.match(/^(\d*)L([DE])([EI])$/);
    if (m) return { group: "L" + (m[1] || "0"), kind: "dual", side: m[2], io: m[3], letter: "L", num: m[1] ? Number(m[1]) : null };
    m = code.match(/^(\d*)T([DE])([EI])$/);
    if (m) return { group: "T" + (m[1] || "0"), kind: "dual", side: m[2], io: m[3], letter: "T", num: m[1] ? Number(m[1]) : null };
    m = code.match(/^(\d*)D([DE])$/);
    if (m) return { group: "D" + (m[1] || "0"), kind: "single", side: m[2], io: null, letter: "D", num: m[1] ? Number(m[1]) : null };
    return { group: "outro:" + code, kind: "outro", side: null, io: null, letter: null, num: null };
  }
  // Rótulo do eixo conforme a convenção confirmada por Joao: D = Direcional, T = Tração, L = Livre.
  // Um número antes da letra indica a ordem dentro daquele tipo (ex.: "2D" = 2º Eixo Direcional).
  function axleLabel(g) {
    const names = { D: "Direcional", T: "de Tração", L: "Livre" };
    if (!g.letter) return null;
    return g.num ? `${g.num}º Eixo ${names[g.letter]}` : `Eixo ${names[g.letter]}`;
  }
  // ---- Modo "Todos os veículos" (2026-10-08) ----
  // Referência de "hoje" = data de geração dos dados (DATA.generatedAt), não o relógio do
  // navegador, pra o aviso de mapa desatualizado bater com o que foi publicado.
  function quinzenaAtualJanela() {
    const h = String(DATA.generatedAt || new Date().toISOString()).slice(0, 10);
    const [y, m, d] = h.split("-").map(Number);
    const mm = String(m).padStart(2, "0");
    return d <= 15 ? { ini: `${y}-${mm}-01`, rotulo: "1ª quinzena" } : { ini: `${y}-${mm}-16`, rotulo: "2ª quinzena" };
  }
  function bannerMapaDesatualizado(ultima, rotulo) {
    const quando = ultima ? `Última inspeção feita nele: <b>${escapeHtml(fmtDate(ultima))}</b>.` : "<b>Nenhuma inspeção registrada</b> para este veículo.";
    return `<div class="stale-banner"><span class="stale-ico">⚠</span><div><b>Mapa desatualizado</b> — este veículo não teve inspeção ${/^mês/.test(rotulo) ? "no" : "na"} ${escapeHtml(rotulo)}. ${quando}</div></div>`;
  }
  function computeSulco() {
    let rows = DATA.sulcoTires;
    if (state.filtroFilial !== "all") rows = rows.filter((t) => t.filial === state.filtroFilial);
    if (state.busca) rows = rows.filter((t) => t.veiculo.toLowerCase().includes(state.busca.toLowerCase()));
    const tires = scopeRows(rows);

    const groupByVeiculo = (list, limit = 5) => {
      const byVeiculo = new Map();
      list.forEach((t) => { if (!byVeiculo.has(t.veiculo)) byVeiculo.set(t.veiculo, []); byVeiculo.get(t.veiculo).push(t); });
      return Array.from(byVeiculo.values()).map((vt) => {
        const flagged = vt.filter((t) => t.sulco != null && t.sulco <= limit).sort((a, b) => a.sulco - b.sulco);
        return {
          veiculo: vt[0].veiculo, filial: vt[0].filial, tipoDesc: vt[0].tipoDesc, odometro: vt[0].odometro,
          tires: vt, flagged, worst: flagged.some((t) => t.sulco <= 3) ? "trocar" : "atencao",
          minSulco: flagged.length ? flagged[0].sulco : Infinity,
        };
      }).filter((v) => v.flagged.length > 0);
    };

    // Botão "Somente ≤3mm": quando ativo, o limite de corte da tabela/KPIs vira 3mm em vez de
    // 5mm — os pneus em atenção (3,1–5mm) continuam calculados abaixo (atencaoCount) para quem
    // quiser ver esse número, só não entram na lista/tabela principal.
    const limit = state.sulcoSoTrocar ? 3 : 5;
    const filtered = groupByVeiculo(tires, limit).sort((a, b) => a.minSulco - b.minSulco);
    const trocarCount = tires.filter((t) => t.sulco != null && t.sulco <= 3).length;
    const atencaoCount = tires.filter((t) => t.sulco != null && t.sulco > 3 && t.sulco <= 5).length;
    const denom = registradosTotal(activeScope());
    const pctFrota = denom ? (filtered.length / denom) * 100 : 0;

    const byFilialMap = new Map();
    groupByVeiculo(rows).filter((v) => v.worst === "trocar").forEach((v) => byFilialMap.set(v.filial, (byFilialMap.get(v.filial) || 0) + 1));
    const barDataVeiculos = Array.from(byFilialMap, ([filial, veiculos]) => {
      const reg = registradosTotal(filial);
      return { filial, veiculos, pct: reg ? (veiculos / reg) * 100 : 0 };
    }).sort((a, b) => b.veiculos - a.veiculos);
    const top = barDataVeiculos[0] || { filial: "—", veiculos: 0, pct: 0 };

    // Eixo Y do gráfico "Sulco Baixo" mostra QUANTIDADE DE PNEUS (não veículos nem %):
    // conta cada pneu individualmente flagado (sulco <= limit) por filial.
    const tireCountMap = new Map();
    rows.filter((t) => t.sulco != null && t.sulco <= limit).forEach((t) => tireCountMap.set(t.filial, (tireCountMap.get(t.filial) || 0) + 1));
    const barData = Array.from(tireCountMap, ([filial, pneus]) => ({ filial, pneus }))
      .sort((a, b) => b.pneus - a.pneus);

    // Lista do modo "Todos os veículos": todos os pneus (sulcoTires + sulcoOutros), agrupados por
    // veículo, com a data da última inspeção. Só alimenta a tabela/mapa — KPIs e gráfico acima
    // continuam calculados do jeito de sempre (só veículos afetados).
    let todos = null;
    if (state.sulcoTodos) {
      const janela = quinzenaAtualJanela();
      const info = DATA.veiculosInfo || {};
      let all = (DATA.sulcoTires || []).concat(DATA.sulcoOutros || []);
      if (state.filtroFilial !== "all") all = all.filter((t) => t.filial === state.filtroFilial);
      if (state.busca) all = all.filter((t) => t.veiculo.toLowerCase().includes(state.busca.toLowerCase()));
      all = scopeRows(all);
      const por = new Map();
      all.forEach((t) => { if (!por.has(t.veiculo)) por.set(t.veiculo, []); por.get(t.veiculo).push(t); });
      const monta = (placa, vt, meta) => {
        const flagged = vt.filter((t) => t.sulco != null && t.sulco <= 5).sort((a, b) => a.sulco - b.sulco);
        const comSulco = vt.filter((t) => t.sulco != null).map((t) => t.sulco);
        const ultima = (info[placa] && info[placa].ultimaInsp) || null;
        return {
          veiculo: placa, filial: meta.filial, tipoDesc: meta.tipoDesc, odometro: meta.odometro,
          tires: vt, flagged,
          worst: vt.length === 0 ? "sem_dado" : flagged.some((t) => t.sulco <= 3) ? "trocar" : flagged.length ? "atencao" : "ok",
          minSulco: comSulco.length ? Math.min(...comSulco) : Infinity,
          ultimaInsp: ultima, desatualizado: !ultima || ultima < janela.ini,
        };
      };
      todos = Array.from(por, ([placa, vt]) => monta(placa, vt, vt[0]));
      // veículos registrados que nem aparecem no relatório de sulco (sem pneu cadastrado)
      Object.entries(info).forEach(([placa, i]) => {
        if (por.has(placa)) return;
        if (state.filtroFilial !== "all" && i.filial !== state.filtroFilial) return;
        if (state.busca && !placa.toLowerCase().includes(state.busca.toLowerCase())) return;
        if (state.selFiliais.size && !state.selFiliais.has(i.filial)) return;
        todos.push(monta(placa, [], i));
      });
      todos.sort((a, b) => a.minSulco - b.minSulco);
      todos.janela = janela;
    }

    return { filtered, trocarCount, atencaoCount, barData, top, denom, pctFrota, todos };
  }

  function reformaReparoInfo(t) {
    const r = t.reformas || 0, p = t.reparos || 0;
    if (!r && !p) return null;
    const parts = [];
    if (r) parts.push(`R${r}`);
    if (p) parts.push(`C${p}`);
    const title = [r ? `${r} reforma(s)` : "", p ? `${p} reparo(s)` : ""].filter(Boolean).join(" · ");
    return { text: parts.join("·"), title };
  }

  function tireExtrasBadge(t) {
    const info = reformaReparoInfo(t);
    if (!info) return "";
    return `<sup title="${info.title}" style="font-size:8.5px;color:var(--text-faint);margin-left:2px;font-weight:700;">${info.text}</sup>`;
  }

  function tireChip(t) {
    if (t.vazio) {
      return `<div class="tire-chip" style="border-color:var(--danger);background:var(--danger-bg);border-style:dashed;" title="${escapeHtml(t.posicao)} · Posição vazia (sem pneu)">
        <div class="tire-chip-val" style="color:var(--danger);font-size:10px;">VAZIO</div>
        <div class="tire-chip-pos">${escapeHtml(t.posicao)}</div>
      </div>`;
    }
    if (t.semDado) {
      return `<div class="tire-chip" style="border-color:var(--border-strong);background:var(--bg-elev);" title="${escapeHtml(t.posicao)} · Sem dado de sulco para esta posição (provavelmente tem pneu)">
        <div class="tire-chip-val" style="color:var(--text-faint);font-size:12px;">—</div>
        <div class="tire-chip-pos">${escapeHtml(t.posicao)}</div>
      </div>`;
    }
    const status = tireStatus(t.sulco);
    const rr = reformaReparoInfo(t);
    const tituloChip = `${t.posicao} · Pneu ${t.pneu}${t.produto ? ` · ${t.produto}` : ""}`;
    return `<div class="tire-chip" style="border-color:${tireColor(status)};background:${tireBg(status)}" title="${escapeHtml(tituloChip)}" data-pneu="${escapeHtml(t.pneu)}" data-posicao="${escapeHtml(t.posicao)}" data-sulco="${t.sulco != null ? t.sulco.toFixed(1) : ""}">
      <div class="tire-chip-val" style="color:${tireColor(status)}">${t.sulco != null ? t.sulco.toFixed(1) : "—"}</div>
      <div class="tire-chip-pos">${escapeHtml(t.posicao)}</div>
      <div class="tire-chip-pneu" style="white-space:nowrap;">Nº ${escapeHtml(t.pneu)}</div>
      ${rr ? `<div style="font-size:8.5px;color:var(--text-faint);font-weight:700;margin-top:1px;" title="${rr.title}">${rr.text}</div>` : ""}
    </div>`;
  }

  // Chip de pneu pro mapa do veículo na aba Pressão de Ar (reaproveita renderTireDiagram, que
  // já cuida de agrupar por eixo/estepe — só a "cara" de cada pneu muda). Cor = faixa de
  // pressão (mesma paleta do donut, FAIXA_PRESSAO_TONE); "zero" (semLeitura) e "sem padrão"
  // (semPadrao) têm tratamento visual próprio, igual ao tireChip original faz com vazio/semDado.
  function pressaoTireChip(t) {
    if (t.semPadrao) {
      // Medida não reconhecida: não temos padrão pra comparar, mas a leitura em si (psi) pode
      // existir — mostra ela quando tiver, em vez de forçar "—" (pedido do Joao, 2026-09-16:
      // mostrar a pressão de fato, não %).
      const valorSemPadrao = t.pressaoAtual != null ? `${t.pressaoAtual}` : "—";
      return `<div class="tire-chip" style="border-color:var(--border-strong);background:var(--bg-elev);" title="${escapeHtml(t.posicao)} · Pneu ${escapeHtml(t.pneu || "—")} · Medida não reconhecida — sem padrão de pressão pra comparar${t.pressaoAtual != null ? ` · pressão atual ${t.pressaoAtual} psi` : ""}">
        <div class="tire-chip-val" style="color:var(--text-faint);${valorSemPadrao === "—" ? "font-size:12px;" : ""}">${valorSemPadrao}</div>
        <div class="tire-chip-pos">${escapeHtml(t.posicao)}</div>
        <div class="tire-chip-pneu" style="white-space:nowrap;">Nº ${escapeHtml(t.pneu || "—")}</div>
      </div>`;
    }
    const k = t.semLeitura ? "zero" : t.faixa;
    const color = FAIXA_PRESSAO_TONE[k] || "var(--text-faint)";
    const label = FAIXA_PRESSAO_LABEL[k] || "—";
    // Valor do chip é a pressão atual de fato (psi), não o % do padrão — pedido do Joao
    // (2026-09-16). O % continua disponível no tooltip, pra quem passar o mouse.
    const valorTxt = t.semLeitura ? "0" : (t.pressaoAtual != null ? `${t.pressaoAtual}` : "—");
    const pctTxt = t.pctPadrao != null ? ` · ${t.pctPadrao}% do padrão` : "";
    const detalhePsi = t.semLeitura ? "sem leitura registrada" : (t.padraoPsi != null ? `padrão ${t.padraoPsi} psi${pctTxt}` : "");
    const titulo = `${t.posicao} · Pneu ${t.pneu || "—"}${t.produto ? ` · ${t.produto}` : ""} · ${label}${detalhePsi ? ` · ${detalhePsi}` : ""}`;
    return `<div class="tire-chip" style="border-color:${color};background:${color}22" title="${escapeHtml(titulo)}" data-pneu="${escapeHtml(t.pneu || "")}" data-posicao="${escapeHtml(t.posicao)}" data-psi="${t.pressaoAtual != null ? t.pressaoAtual : ""}">
      <div class="tire-chip-val" style="color:${color};">${valorTxt}</div>
      <div class="tire-chip-pos">${escapeHtml(t.posicao)}</div>
      <div class="tire-chip-pneu" style="white-space:nowrap;">Nº ${escapeHtml(t.pneu || "—")}</div>
    </div>`;
  }

  function renderTireDiagram(vehicle, chipFn = tireChip) {
    // A Map preserva a ordem de primeira inserção — como vehicle.tires já está na mesma ordem
    // da planilha de origem (confirmada como ordem física dianteira→traseira pelos prints de
    // referência), essa ordem natural é o que usamos para posicionar os eixos, em vez de tentar
    // recalcular a partir do número do código de posição (ver nota em parsePosicao).
    const groups = new Map();
    vehicle.tires.forEach((t) => {
      const p = parsePosicao(t.posicao);
      if (!groups.has(p.group)) groups.set(p.group, { kind: p.kind, letter: p.letter, num: p.num, tires: [] });
      groups.get(p.group).tires.push({ t, p });
    });
    const allGroups = Array.from(groups.values());
    const axleGroups = allGroups.filter((g) => g.kind !== "spare");
    const estepes = allGroups.find((g) => g.kind === "spare");
    const bySide = (g, side, ioOrder) => g.tires.filter((x) => x.p.side === side)
      .sort((a, b) => ioOrder.indexOf(a.p.io) - ioOrder.indexOf(b.p.io)).map((x) => x.t);

    const axles = axleGroups.map((g) => {
      if (g.kind === "outro") {
        return `<div class="axle-row">
          <div class="axle-tiers" style="justify-content:center;">${g.tires.map((x) => chipFn(x.t)).join("")}</div>
        </div>`;
      }
      const label = axleLabel(g);
      const left = g.kind === "single" ? g.tires.filter((x) => x.p.side === "E").map((x) => x.t) : bySide(g, "E", ["E", "I"]);
      const right = g.kind === "single" ? g.tires.filter((x) => x.p.side === "D").map((x) => x.t) : bySide(g, "D", ["I", "E"]);
      return `<div class="axle-row">
        ${label ? `<div class="axle-label">${escapeHtml(label)}</div>` : ""}
        <div class="axle-tiers">
          <div class="axle-side left">${left.map(chipFn).join("")}</div>
          <div class="axle-side">${right.map(chipFn).join("")}</div>
        </div>
      </div>`;
    }).join("");

    const estepesHtml = estepes ? `
      <div class="axle-estepes">
        <div class="axle-label" style="margin-bottom:8px;">Estepes</div>
        <div class="axle-tiers" style="justify-content:center;">${estepes.tires.map((x) => chipFn(x.t)).join("")}</div>
      </div>` : "";

    return `<div class="tire-diagram">${axles}${estepesHtml}</div>`;
  }

  function renderSulcoDetail(d) {
    const listaDetalhe = state.sulcoTodos && d.todos ? d.todos : d.filtered;
    const v = state.selVeiculoSulco ? listaDetalhe.find((x) => x.veiculo === state.selVeiculoSulco) : null;
    if (!v) {
      return `<div class="card detail-card">
        <div class="card-title">Esquema do veículo</div>
        <div class="detail-empty">${state.sulcoTodos ? "Clique numa linha da tabela para ver o sulco de todos os pneus do veículo." : "Clique numa linha da tabela para ver em qual posição está o pneu com sulco baixo."}</div>
      </div>`;
    }
    const worstColor = v.worst === "trocar" ? "var(--danger)" : v.worst === "atencao" ? "var(--warning)" : "var(--text-dim)";
    const pillSulco = v.worst === "trocar" ? severityPill("danger", `${v.flagged.filter((t) => t.sulco <= 3).length} pneu(s) para trocar`)
      : v.worst === "atencao" ? severityPill("warning", "pneu(s) em atenção")
      : v.worst === "ok" ? severityPill("success", "Nenhum pneu abaixo de 5mm")
      : severityPill("neutral", "Sem pneus no relatório de sulco");
    const bannerSulco = state.sulcoTodos && v.desatualizado && d.todos ? bannerMapaDesatualizado(v.ultimaInsp, d.todos.janela.rotulo) : "";
    return `<div class="card detail-card">
      <div class="detail-plate-label">Veículo selecionado</div>
      <div class="detail-plate">${escapeHtml(v.veiculo)}</div>
      <div class="detail-sub">${escapeHtml(filialSigla(v.filial))} — ${escapeHtml(filialFullName(v.filial))} · ${escapeHtml(v.tipoDesc)}${v.odometro ? ` · ${fmtInt(v.odometro)} km` : ""}</div>
      ${pillSulco}
      ${bannerSulco}
      <div class="card-title" style="margin-top:18px;">Esquema do veículo <span style="color:${worstColor}">· ${escapeHtml(v.tipoDesc)}</span></div>
      ${v.tires.length ? renderTireDiagram(v) : `<div class="detail-empty">Este veículo não aparece no relatório de sulco.</div>`}
      <div class="table-note" style="padding-left:0;">Números em cada pneu = sulco atual (mm). <span style="color:var(--danger)">Vermelho</span> ≤ 3mm (trocar) · <span style="color:var(--warning)">amarelo</span> 3,1–5mm (atenção). Sobrescrito ao lado do nº do pneu: <sup style="font-weight:700;">R</sup>=reformas, <sup style="font-weight:700;">C</sup>=reparos.</div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // Esquema do veículo para o painel de Posições Vazias
  // ------------------------------------------------------------------
  // DATA.vazias só traz as posições SEM pneu — não a lista completa de pneus do veículo.
  // Quando o mesmo veículo aparece em DATA.sulcoTires (pneu com sulco baixo em algum lugar),
  // aproveitamos essa lista completa de posições reais para desenhar o esquema. Quando não
  // aparece, buscamos o layout típico (mesmo conjunto de posições) de outros veículos do
  // mesmo tipo (tipoCod) já presentes em DATA.sulcoTires, para desenhar o esquema completo
  // do veículo mesmo sem dado de sulco — só a(s) posição(ões) realmente vazia(s) é que vem
  // marcada(s) como tal; as demais aparecem como "sem dado" (não inventamos sulco/nº de pneu).
  function positionTemplateParaTipo(tipoCod, excluirVeiculo) {
    const porVeiculo = new Map();
    DATA.sulcoTires.forEach((t) => {
      if (t.tipoCod !== tipoCod || t.veiculo === excluirVeiculo) return;
      if (!porVeiculo.has(t.veiculo)) porVeiculo.set(t.veiculo, []);
      porVeiculo.get(t.veiculo).push(t.posicao);
    });
    if (porVeiculo.size === 0) return null;
    // conta a frequência de cada conjunto exato de posições e usa o mais comum entre os
    // veículos desse tipo (evita misturar variações raras, ex.: um estepe a mais/a menos)
    const freq = new Map();
    for (const posicoes of porVeiculo.values()) {
      const key = posicoes.slice().sort().join("|");
      if (!freq.has(key)) freq.set(key, { count: 0, posicoes });
      freq.get(key).count++;
    }
    let best = null;
    for (const v of freq.values()) if (!best || v.count > best.count) best = v;
    return best.posicoes;
  }

  // Este painel é um mapa de "onde falta pneu", não um raio-x do estado dos outros pneus —
  // por isso as posições que TÊM pneu aparecem só com a posição (chip neutro "—"), mesmo
  // quando temos o sulco real delas via Sulco Baixo. Só a posição efetivamente vazia é
  // marcada (vermelho/VAZIO). O esquema de posições vem de, em ordem de preferência:
  // (1) as posições reais deste veículo no Sulco Baixo, (2) o layout típico de outros
  // veículos do mesmo tipo, ou (3) só as posições vazias conhecidas, se nenhum dos dois
  // acima existir.
  function buildVeiculoParaVazias(v) {
    const reais = DATA.sulcoTires.filter((t) => t.veiculo === v.placa);
    const base = { veiculo: v.placa, filial: v.filial, tipoDesc: v.tipoDesc, odometro: v.odometro };
    const vaziasSet = new Set(v.posicoes);
    let posicoes, temEsquemaTipico = false;
    if (reais.length > 0) {
      posicoes = Array.from(new Set([...reais.map((t) => t.posicao), ...v.posicoes]));
    } else {
      const template = positionTemplateParaTipo(v.tipoCod, v.placa);
      if (template) {
        posicoes = Array.from(new Set([...template, ...v.posicoes]));
        temEsquemaTipico = true;
      } else {
        posicoes = v.posicoes.slice();
      }
    }
    const tires = posicoes.map((p) => vaziasSet.has(p)
      ? { ...base, posicao: p, sulco: null, pneu: null, vazio: true }
      : { ...base, posicao: p, sulco: null, pneu: null, semDado: true });
    return { ...base, tires, temContexto: reais.length > 0, temEsquemaTipico };
  }

  function renderVaziasDetail(d) {
    const v = state.selVeiculoVazias ? d.filtered.find((x) => x.placa === state.selVeiculoVazias) : null;
    if (!v) {
      return `<div class="card detail-card">
        <div class="card-title">Esquema do veículo</div>
        <div class="detail-empty">Clique numa linha da tabela para ver em qual posição falta pneu.</div>
      </div>`;
    }
    const vehicle = buildVeiculoParaVazias(v);
    return `<div class="card detail-card">
      <div class="detail-plate-label">Veículo selecionado</div>
      <div class="detail-plate">${escapeHtml(v.placa)}</div>
      <div class="detail-sub">${escapeHtml(filialSigla(v.filial))} — ${escapeHtml(filialFullName(v.filial))} · ${escapeHtml(v.tipoDesc)}${v.odometro ? ` · ${fmtInt(v.odometro)} km` : ""}</div>
      ${severityPill("danger", `${v.posicoes.length} posição(ões) vazia(s)`)}
      <div class="card-title" style="margin-top:18px;">Esquema do veículo <span style="color:var(--danger)">· ${escapeHtml(v.tipoDesc)}</span></div>
      ${renderTireDiagram(vehicle)}
      <div class="table-note" style="padding-left:0;">Posições tracejadas em <span style="color:var(--danger)">vermelho</span> = sem pneu (VAZIO). As demais (cinza, com "—") têm pneu montado, sem detalhar sulco ou número — o esquema de posições ${vehicle.temContexto ? "foi confirmado pelos dados deste veículo no painel de Sulco Baixo." : vehicle.temEsquemaTipico ? "foi estimado a partir do layout típico de outros veículos do mesmo tipo (este veículo não aparece no Sulco Baixo)." : "mostra só as posições vazias conhecidas — este veículo não aparece no Sulco Baixo e não há outro veículo do mesmo tipo pra usar de referência."}</div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // Esquema do veículo pro quadro "Veículos com pneus fora do padrão" (Pressão de Ar)
  // ------------------------------------------------------------------
  function renderPressaoDetail(d) {
    const listaDetalhe = state.pressaoTodos && d.veiculosTodos ? d.veiculosTodos : d.veiculosForaPadrao;
    const v = state.selVeiculoPressao ? listaDetalhe.find((x) => x.veiculo === state.selVeiculoPressao) : null;
    if (!v) {
      return `<div class="card detail-card">
        <div class="card-title">Esquema do veículo</div>
        <div class="detail-empty">Clique numa linha da tabela pra ver o mapa de pressão de cada pneu do veículo — quais estão OK, muito baixo, baixo, etc.</div>
      </div>`;
    }
    // Usa DATA.pressaoTires (último evento conhecido de cada pneu, independente da rodada
    // selecionada — ver build_pressao_tires_atual) em vez de `d.rows`: desde a migração pro
    // R343A, `d.rows` pode ter mais de um evento pra mesma posição (leitura repetida na
    // quinzena), o que desenharia o mesmo pneu 2x no mapa. O mapa sempre mostra o estado
    // mais recente conhecido de cada posição, com todos os pneus do veículo (inclusive os
    // "correta", em verde), não só os fora do padrão.
    const todosMode = state.pressaoTodos && !!d.veiculosTodos;
    const vehicle = { veiculo: v.veiculo, filial: v.filial, tipoDesc: v.tipoDesc, tires: todosMode ? v.tires : DATA.pressaoTires.filter((t) => t.veiculo === v.veiculo) };
    const pillPressao = !todosMode ? severityPill("danger", `${v.qtd} pneu(s) fora do padrão`)
      : v.tires.length === 0 ? severityPill("neutral", "Sem leitura de pressão registrada")
      : v.qtd > 0 ? severityPill(v.grave ? "danger" : "warning", `${v.qtd} pneu(s) fora do padrão`)
      : severityPill("success", "Todos os pneus dentro do padrão");
    const bannerPressao = todosMode && v.desatualizado ? bannerMapaDesatualizado(v.ultimaLeitura, d.veiculosTodos.rotulo) : "";
    return `<div class="card detail-card">
      <div class="detail-plate-label">Veículo selecionado</div>
      <div class="detail-plate">${escapeHtml(v.veiculo)}</div>
      <div class="detail-sub">${escapeHtml(filialSigla(v.filial))} — ${escapeHtml(filialFullName(v.filial))} · ${escapeHtml(v.tipoDesc || "—")}</div>
      ${pillPressao}
      ${bannerPressao}
      <div class="card-title" style="margin-top:18px;">Esquema do veículo <span style="color:var(--danger)">· ${escapeHtml(v.tipoDesc || "")}</span></div>
      ${vehicle.tires.length ? renderTireDiagram(vehicle, pressaoTireChip) : `<div class="detail-empty">Nenhuma leitura de pressão registrada para este veículo.</div>`}
      <div class="table-note" style="padding-left:0;">
        Cor de cada pneu = faixa de pressão: <span style="color:${FAIXA_PRESSAO_TONE.muito_baixa}">muito baixa</span> ·
        <span style="color:${FAIXA_PRESSAO_TONE.baixa}">baixa</span> ·
        <span style="color:${FAIXA_PRESSAO_TONE.correta}">correta (OK)</span> ·
        <span style="color:${FAIXA_PRESSAO_TONE.alta}">alta</span> ·
        <span style="color:${FAIXA_PRESSAO_TONE.muito_alta}">muito alta</span> ·
        <span style="color:${FAIXA_PRESSAO_TONE.zero}">pressão zero (sem leitura)</span>.
        Número em cada pneu = pressão atual (psi) — "0" quando não há leitura, "—" quando o pneu não tem registro de pressão nem medida cadastrada. Passe o mouse pra ver o padrão da medida e o % em relação a ele.
      </div>
    </div>`;
  }

  function renderSulcoPanel() {
    const d = computeSulco();
    const listaSulco = state.sulcoTodos && d.todos ? d.todos : d.filtered;
    const filiais = Array.from(new Set(DATA.sulcoTires.concat(DATA.sulcoOutros || []).map((r) => r.filial))).sort();
    const sulcoFilterToggle = `<div class="seg-group">
        <button class="seg-btn ${!state.sulcoSoTrocar && !state.sulcoTodos ? "active" : ""}" data-sulco-filter="todos">Até 5mm (atenção + trocar)</button>
        <button class="seg-btn ${state.sulcoSoTrocar && !state.sulcoTodos ? "active" : ""}" data-sulco-filter="trocar">Somente ≤ 3mm (trocar)</button>
        <button class="seg-btn ${state.sulcoTodos ? "active" : ""}" data-sulco-filter="veiculos">Todos os veículos</button>
      </div>`;
    const desc = state.sulcoTodos
      ? "Mostrando todos os veículos da frota, com o sulco de todos os pneus de cada um. Os indicadores acima seguem considerando só os veículos com pneu abaixo de 5mm."
      : state.sulcoSoTrocar
      ? "Mostrando somente pneus com sulco de 3mm ou menos, que precisam ser trocados agora."
      : "Pneus com sulco abaixo de 5mm: de 3,1 a 5mm requerem atenção (troca em breve), 3mm ou menos precisam ser trocados agora.";
    return `
      ${panelHeader("Sulco Baixo", desc, filiais, sulcoFilterToggle)}
      <div class="kpi-grid">
        ${kpiCard(state.sulcoSoTrocar ? "Veículos com pneu p/ trocar" : "Veículos afetados", d.filtered.length, `de ${d.denom} veículos registrados${scopeLabelText()}`, ICONS.truck, "var(--warning)", undefined, undefined, sulcoKpiTrendHtml((p) => state.sulcoSoTrocar ? (p.veiculosParaTrocar ?? null) : p.veiculosAfetados, fmtInt), sulcoKpiValueArrowHtml((p) => state.sulcoSoTrocar ? (p.veiculosParaTrocar ?? null) : p.veiculosAfetados))}
        ${kpiCard("% da frota afetada", fmtPct(d.pctFrota), `veículos afetados ÷ frota registrada${scopeLabelText()}`, ICONS.gauge, d.pctFrota >= 30 ? "var(--danger)" : d.pctFrota >= 15 ? "var(--warning)" : "var(--success)", undefined, undefined, sulcoKpiTrendHtml(state.sulcoSoTrocar ? sulcoPctFrotaParaTrocarMetric : sulcoPctFrotaMetric, fmtPct), sulcoKpiValueArrowHtml(state.sulcoSoTrocar ? sulcoPctFrotaParaTrocarMetric : sulcoPctFrotaMetric))}
        ${kpiCard("Pneus para trocar (≤ 3mm)", d.trocarCount, "troca imediata", ICONS.alert, "var(--danger)", undefined, undefined, sulcoKpiTrendHtml((p) => p.pneusParaTrocar, fmtInt), sulcoKpiValueArrowHtml((p) => p.pneusParaTrocar))}
        ${kpiCard("Pneus em atenção (3,1–5mm)", d.atencaoCount, state.sulcoSoTrocar ? "não exibidos na tabela agora" : "programar substituição", ICONS.gauge, "var(--warning)", undefined, undefined, sulcoKpiTrendHtml((p) => p.pneusEmAtencao, fmtInt), sulcoKpiValueArrowHtml((p) => p.pneusEmAtencao))}
        ${kpiCard("Filial mais crítica (%)", filialSigla(d.top.filial), d.top.veiculos > 0 ? `${d.top.veiculos} de ${registradosTotal(d.top.filial)} (${fmtPct(d.top.pct)}) — ${filialFullName(d.top.filial)}` : "—", ICONS.building, "var(--danger)")}
      </div>
      <div class="card">
        <div class="card-title">Qtd. de pneus ${state.sulcoSoTrocar ? "para trocar (≤ 3mm)" : "abaixo de 5mm (atenção + trocar)"}, por filial</div>
        ${chartHint()}
        <div id="chart-sulco-bar"></div>
      </div>
      <div class="sulco-layout">
        <div class="table-wrap" style="margin:0;">
          <table>
            <thead><tr>${sortTh("filial", "Filial")}${sortTh("placa", "Placa")}${sortTh("tipo", "Tipo")}${sortTh("odometro", "Odômetro")}${sortTh("qtd", "Qtd")}<th>Posições</th>${state.sulcoTodos ? sortTh("ult", "Última inspeção") : ""}</tr></thead>
            <tbody>
              ${listaSulco.length === 0 ? emptyRow(state.sulcoTodos ? 7 : 6, state.sulcoTodos ? "Nenhum veículo encontrado." : state.sulcoSoTrocar ? "Nenhum pneu com sulco ≤ 3mm encontrado." : "Nenhum pneu abaixo de 5mm encontrado.") :
                applySort(listaSulco, {
                  filial: (r) => normalizeText(filialFullName(r.filial)), placa: (r) => r.veiculo,
                  tipo: (r) => r.tipoDesc, odometro: (r) => r.odometro || 0, qtd: (r) => r.flagged.length,
                  ult: (r) => r.ultimaInsp || "",
                }).map((v) => `<tr class="sulco-row ${state.selVeiculoSulco === v.veiculo ? "selected" : ""}" data-veiculo="${escapeHtml(v.veiculo)}">
                  <td>${escapeHtml(filialSigla(v.filial))} <span style="color:var(--text-faint)">— ${escapeHtml(filialFullName(v.filial))}</span></td>
                  <td class="mono" style="font-weight:600;">${escapeHtml(v.veiculo)}</td>
                  <td style="color:var(--text-dim);">${escapeHtml(v.tipoDesc)}</td>
                  <td class="mono">${v.odometro ? fmtInt(v.odometro) + " km" : "—"}</td>
                  <td>${v.flagged.length ? `<span class="qtd-badge" style="background:${v.worst === "trocar" ? "var(--danger-bg)" : "var(--warning-bg)"};color:${v.worst === "trocar" ? "var(--danger)" : "var(--warning)"}">${v.flagged.length}</span>` : `<span style="color:var(--text-faint)">—</span>`}</td>
                  <td>${v.flagged.length ? v.flagged.map((t) => `<span class="mono" style="color:${tireColor(tireStatus(t.sulco))};font-weight:600;">${escapeHtml(t.posicao)}${tireExtrasBadge(t)}</span>`).join(" · ") : `<span style="color:var(--text-faint)">${v.worst === "sem_dado" ? "sem dados de sulco" : "todos acima de 5mm"}</span>`}</td>
