                  ${state.sulcoTodos ? `<td class="mono">${v.ultimaInsp ? escapeHtml(fmtDate(v.ultimaInsp)) : "—"}${v.desatualizado ? `<span class="stale-pill">desatualizado</span>` : ""}</td>` : ""}
                </tr>`).join("")}
            </tbody>
          </table>
          <div class="table-note">${state.sulcoTodos ? `${listaSulco.length} veículo(s) no total${scopeLabelText()}, ${listaSulco.filter((v) => v.desatualizado).length} sem inspeção na ${d.todos.janela.rotulo} (mapa marcado como desatualizado). ` : `${d.filtered.length} veículo(s) com ao menos 1 pneu ${state.sulcoSoTrocar ? "com sulco ≤ 3mm (trocar)" : "abaixo de 5mm"}${scopeLabelText()}.`} Sobrescrito ao lado da posição: <sup style="font-weight:700;">R</sup>=reformas, <sup style="font-weight:700;">C</sup>=reparos do pneu (quando houver).</div>
        </div>
        ${renderSulcoDetail(d)}
      </div>`;
  }

  // ------------------------------------------------------------------
  // Painel: Pressão de Ar
  // ------------------------------------------------------------------
  // Faixas e padrões (psi por medida) confirmados pelo Joao (2026-09-09). "Sem leitura"
  // (pressão coletada = 0) e "sem padrão" (produto sem medida reconhecida) ficam de fora
  // das 5 faixas — são problemas de cobertura de dado, não de calibragem em si.
  // "zero" (pressão zero/sem leitura) foi adicionada como uma 6ª fatia própria (cinza) só no
  // donut "Composição por faixa" — não é uma faixa de calibragem de verdade, mas o Joao pediu
  // pra ela aparecer na composição visual junto das outras. "sem padrão" continua de fora.
  const FAIXA_PRESSAO_LABEL = { muito_baixa: "Muito baixa", baixa: "Baixa", correta: "Correta", alta: "Alta", muito_alta: "Muito alta", zero: "Pressão zero" };
  // Paleta de 5 cores distintas pedida pelo Joao (tabela de classificação), uma por faixa —
  // diferente das 3 cores semânticas (danger/warning/success) usadas nos KPIs, que só
  // destacam severidade. Aqui cada faixa precisa ser visualmente distinguível da vizinha.
  // "zero" usa cinza neutro (não é uma cor de severidade, é "sem dado").
  const FAIXA_PRESSAO_TONE = { muito_baixa: "#E15759", baixa: "#F1C232", correta: "#3C9F40", alta: "#3577D4", muito_alta: "#9067C6", zero: "#8A8D93" };
  // Ordem fixa de empilhamento no gráfico de colunas por filial (mesma ordem visual do donut).
  const FAIXA_PRESSAO_ORDEM = ["muito_baixa", "baixa", "correta", "alta", "muito_alta", "zero"];

  // Filtro cruzado (padrão BI) dos 4 quadros: clicar filtra os 2 gráficos abaixo; Ctrl+clique
  // soma quadros (união), igual ao toggleFilialSelection já usado nos gráficos de barra.
  function togglePressaoQuadro(tipo, multi) {
    if (multi) {
      if (state.pressaoFiltroSel.has(tipo)) state.pressaoFiltroSel.delete(tipo);
      else state.pressaoFiltroSel.add(tipo);
    } else {
      if (state.pressaoFiltroSel.size === 1 && state.pressaoFiltroSel.has(tipo)) state.pressaoFiltroSel.clear();
      else { state.pressaoFiltroSel.clear(); state.pressaoFiltroSel.add(tipo); }
    }
    render();
  }
  function pressaoQuadroHint() {
    const labels = { veiculos_inspecionados: "% veículos inspecionados", pressao_correta: "% pressão correta", pneus_inspecionados: "% pneus inspecionados", pressao_zero: "% pressão zero" };
    if (state.pressaoFiltroSel.size === 0) {
      return `<div class="chart-hint">Clique num quadro acima pra filtrar os gráficos abaixo · Ctrl+clique (Cmd no Mac) pra combinar vários.</div>`;
    }
    const names = Array.from(state.pressaoFiltroSel).map((k) => labels[k] || k).join(", ");
    return `<div class="chart-hint">Filtrando por quadro: <strong style="color:var(--text-dim)">${escapeHtml(names)}</strong><button class="clear-sel-btn" id="clear-quadro-sel">limpar seleção</button></div>`;
  }
  // Filtro cruzado clicando na legenda do donut "Composição por faixa": clicar filtra o gráfico
  // de barras (por filial) pra essa faixa; Ctrl+clique soma mais de uma faixa (mesmo padrão BI
  // já usado nos quadros/barras). Combina em AND com a seleção de quadro, se houver alguma.
  function togglePressaoFaixa(faixa, multi) {
    if (multi) {
      if (state.pressaoFaixaSel.has(faixa)) state.pressaoFaixaSel.delete(faixa);
      else state.pressaoFaixaSel.add(faixa);
    } else {
      if (state.pressaoFaixaSel.size === 1 && state.pressaoFaixaSel.has(faixa)) state.pressaoFaixaSel.clear();
      else { state.pressaoFaixaSel.clear(); state.pressaoFaixaSel.add(faixa); }
    }
    render();
  }
  function pressaoFaixaHint() {
    if (state.pressaoFaixaSel.size === 0) {
      return `<div class="chart-hint">Clique numa faixa acima pra filtrar o gráfico de barras · Ctrl+clique pra combinar várias.</div>`;
    }
    const names = Array.from(state.pressaoFaixaSel).map((k) => FAIXA_PRESSAO_LABEL[k] || k).join(", ");
    return `<div class="chart-hint">Filtrando por faixa: <strong style="color:var(--text-dim)">${escapeHtml(names)}</strong><button class="clear-sel-btn" id="clear-faixa-sel">limpar seleção</button></div>`;
  }

  // Hint do quadro 3 (% pneus inspecionados). No modo Geral, detalha 1ª/2ª quinzena separado
  // (pedido do Joao) além do total somado; nas rodadas de quinzena, mantém o formato simples.
  function pressaoQuadro3Hint(d, scopeLabel, rodadaLabel) {
    if (d.round !== "geral") {
      return `${d.posicoesInspecionadas} de ${d.denomQuadro3} pneus${scopeLabel} — ${rodadaLabel}`;
    }
    const g = d.pressaoQuadro3Geral;
    const linha = (label, q) => q.disponivel
      ? `${label} — ${q.count} de ${q.total} pneus (${fmtPct(q.total ? (q.count / q.total) * 100 : 0)})`
      : `${label} — ainda sem leitura`;
    return `${linha("1ª quinzena", g.insp1)}\n${linha("2ª quinzena", g.insp2)}\nGeral — ${g.somaCount} de ${g.somaTotal} pneus${scopeLabel}`;
  }

  // Hint do quadro 1 (% veículos inspecionados) — mesmo formato do quadro 3 (pedido do Joao,
  // 2026-09-18): no modo Geral, detalha 1ª/2ª quinzena separado, com "Geral" sendo a SOMA das
  // duas (não união) — mesma régua do quadro de pneus, pros dois baterem com a mesma lógica.
  function veiculosQuadro1Hint(d, scopeLabel, rodadaLabel) {
    if (d.round !== "geral") {
      // Corrigido (2026-10-01): quinzena sem leitura ainda (ex.: 2ª quinzena no dia 1 do mês)
      // não é "0 pendentes" — é "sem dado". Ver kpiCard do quadro 1 em renderPressaoPanel, que
      // usa esse mesmo d.insp.disponivel pra trocar o valor grande por "—" em vez de "100%".
      if (d.insp.disponivel === false) return `${rodadaLabel} ainda não tem leitura de inspeção atualizada.`;
      return `${Math.max(0, d.insp.denom - d.insp.pendentes)} de ${d.insp.denom} veículos${scopeLabel} — ${rodadaLabel}`;
    }
    const g = d.veiculosQuadro1Geral;
    const linha = (label, q) => q.disponivel
      ? `${label} — ${q.count} de ${q.total} veículos (${fmtPct(q.total ? (q.count / q.total) * 100 : 0)})`
      : `${label} — ainda sem leitura`;
    return `${linha("1ª quinzena", g.insp1)}\n${linha("2ª quinzena", g.insp2)}\nGeral — ${g.somaCount} de ${g.somaTotal} veículos${scopeLabel}`;
  }

  function computePressao() {
    const round = state.pressaoRound;
    // Filtro de filial(dropdown)+busca SEM a seleção de barras (scopeRows) — usado só pra montar
    // o "por filial" do gráfico de barras. Mesmo padrão já usado em computeVazias/computeSulco:
    // sem isso, clicar numa barra faz as OUTRAS desaparecerem do próprio gráfico (bug reportado
    // pelo Joao, 2026-09-14 — selecionar uma filial não pode apagar as demais da comparação).
    const filtraFilialBuscaSemEscopo = (list) => {
      let out = list;
      if (state.filtroFilial !== "all") out = out.filter((t) => t.filial === state.filtroFilial);
      if (state.busca) out = out.filter((t) => t.veiculo.toLowerCase().includes(state.busca.toLowerCase()));
      return out;
    };
    const filtraFilialBusca = (list) => scopeRows(filtraFilialBuscaSemEscopo(list));

    // Migrado pro relatório R343A (2026-09-25, pedido do Joao): cada "round" agora vem de
    // DATA.pressaoHistoricoMensal[mês].insp1/insp2/geral.eventos — uma lista de EVENTOS de
    // leitura (não mais 1 linha por pneu), incluindo repetidos de propósito ("Vamos avaliar
    // todos os pneus lidos, até os repetidos vão entrar nessa conta"). "Geral" não precisa
    // mais nenhuma união/reconstrução no front-end: o backend já entrega só os eventos do mês
    // corrente (pressao_rounds_ate), então é só usar a lista como veio.
    // Seletor de mês (pedido do Joao, 2026-10-01): mesmo padrão do seletor de Inspeções
    // Pendentes (state.inspMes/mesInspPadrao) — state.pressaoMes é null por padrão (cai no
    // mês mais recente arquivado), e só passa a ter valor quando o usuário troca no dropdown.
    const mesAtivoGeral = state.pressaoMes || mesPressaoPadrao();
    const mesDadosGeral = mesAtivoGeral && DATA.pressaoHistoricoMensal[mesAtivoGeral];
    function eventosDoRound(chave) {
      return (mesDadosGeral && mesDadosGeral[chave] && mesDadosGeral[chave].eventos) || [];
    }
    function disponivelDoRound(chave) {
      return !!(mesDadosGeral && mesDadosGeral[chave] && mesDadosGeral[chave].disponivel);
    }

    let rows, disponivel, rowsTodas;
    if (round === "geral") {
      rows = filtraFilialBusca(eventosDoRound("geral"));
      rowsTodas = filtraFilialBuscaSemEscopo(eventosDoRound("geral"));
      disponivel = disponivelDoRound("geral");
    } else {
      rows = filtraFilialBusca(eventosDoRound(round));
      rowsTodas = filtraFilialBuscaSemEscopo(eventosDoRound(round));
      disponivel = disponivelDoRound(round);
    }

    // Quadro 3 (% pneus inspecionados): por POSIÇÃO do veículo, cada posição conta 1x mesmo
    // com leitura repetida na mesma janela — dedup separado do resto (que usa `rows` cru,
    // com repetidos). Denominador vem de DATA.posicoesRegistradas (Pos + Estepes de VEICULOS
    // REGISTRADOS.xlsx), não mais do universo de pneus lidos: uma posição sem NENHUMA leitura
    // no mês não aparece nos eventos, então só os eventos não servem de denominador.
    function posicoesUnicas(lista) {
      const set = new Set();
      lista.forEach((t) => set.add(t.veiculo + "|" + t.posicao));
      return set.size;
    }
    function denomPosicoes(filial) {
      if (filial instanceof Set) {
        if (filial.size === 0) return DATA.posicoesRegistradas.total;
        let sum = 0;
        filial.forEach((f) => { sum += denomPosicoes(f); });
        return sum;
      }
      if (!filial || filial === "all") return DATA.posicoesRegistradas.total;
      const key = normalizeText(filialFullName(filial));
      return DATA.posicoesRegistradas.porFilial[key] || 0;
    }
    const denomQuadro3 = denomPosicoes(activeScope());
    const posicoesInspecionadas = posicoesUnicas(rows);

    const comPadraoELeitura = rows.filter((t) => !t.semLeitura && !t.semPadrao);
    const foraPadrao = comPadraoELeitura.filter((t) => t.faixa !== "correta");
    const semLeitura = rows.filter((t) => t.semLeitura);
    const semPadrao = rows.filter((t) => t.semPadrao);
    const cobertura = rows.length ? ((rows.length - semLeitura.length) / rows.length) * 100 : 0;

    const faixaCounts = { muito_baixa: 0, baixa: 0, correta: 0, alta: 0, muito_alta: 0 };
    comPadraoELeitura.forEach((t) => { faixaCounts[t.faixa] = (faixaCounts[t.faixa] || 0) + 1; });

    // Quadro 2: % pneus com pressão correta. O denominador é "pneus com padrão de medida
    // conhecido" (só exclui semPadrao) — NÃO "com leitura e padrão conhecidos" como era antes
    // (2026-09-17: o Joao notou que esse número não batia com a rosca "Composição por faixa" ao
    // lado, que já conta pressão zero como uma fatia própria no total). Igual foi decidido pro
    // quadro "fora do padrão" nesta mesma sessão, pressão zero é tratada como "não correta" (não
    // como "sem dado a ignorar") — então agora entra no denominador, só não conta como acerto.
    // Isso faz esse % bater exatamente com o "Correta" da rosca (mesmo `rows`, mesma exclusão).
    const totalComPadraoConhecido = rows.length - semPadrao.length;
    const pctCorreta = totalComPadraoConhecido ? (faixaCounts.correta / totalComPadraoConhecido) * 100 : 0;
    // Quadro 3: % de POSIÇÕES inspecionadas nesta quinzena/mês (dedup, ver posicoesUnicas),
    // sobre o total de posições registradas do escopo. No modo "Geral" o resumo ("Geral — X de
    // Y") continua sendo a SOMA direta das 2 quinzenas — mesma convenção de sempre (pedido
    // explícito do Joao, 2026-09-14, reafirmado 2026-09-18 e de novo em 2026-09-25 na migração
    // pro R343A: "nas linhas ja existentes vai contar só como um" — ou seja, mantém a mesma
    // regra, só troca a fonte).
    const posicoesInsp1 = posicoesUnicas(filtraFilialBusca(eventosDoRound("insp1")));
    const posicoesInsp2 = posicoesUnicas(filtraFilialBusca(eventosDoRound("insp2")));
    const pressaoQuadro3Geral = {
      insp1: { count: posicoesInsp1, total: denomQuadro3, disponivel: disponivelDoRound("insp1") },
      insp2: { count: posicoesInsp2, total: denomQuadro3, disponivel: disponivelDoRound("insp2") },
    };
    pressaoQuadro3Geral.somaCount = pressaoQuadro3Geral.insp1.count + pressaoQuadro3Geral.insp2.count;
    pressaoQuadro3Geral.somaTotal = pressaoQuadro3Geral.insp1.total + pressaoQuadro3Geral.insp2.total;
    const pctInspecionados = round === "geral"
      ? (pressaoQuadro3Geral.somaTotal ? (pressaoQuadro3Geral.somaCount / pressaoQuadro3Geral.somaTotal) * 100 : 0)
      : (denomQuadro3 ? (posicoesInspecionadas / denomQuadro3) * 100 : 0);
    // Quadro 4: % pneus com pressão 0 (sem leitura), sobre os pneus considerados na rodada.
    const pctPressaoZero = rows.length ? (semLeitura.length / rows.length) * 100 : 0;
    // Quadro 1: nível veículo, igual à aba Inspeções Pendentes. No modo "Geral" (pedido do Joao,
    // 2026-09-18), mesmo tratamento do quadro 3: mostra 1ª quinzena, 2ª quinzena e "Geral" como
    // SOMA das duas (não união/crônico) — antes "Geral" aqui era deduplicado (só contava
    // veículo pendente se estivesse pendente nas DUAS quinzenas), o que dava um número diferente
    // do padrão de soma já usado no quadro de pneus; agora os dois quadros seguem a mesma regra.
    // Corrigido (2026-10-01, Joao reparou "% veículos inspecionados" mostrando 100% errado
    // depois de trocar de mês na aba Pressão de Ar): esse quadro usa DATA.historicoMensal
    // (snapshot de Inspeções Pendentes), que é uma estrutura SEPARADA de
    // DATA.pressaoHistoricoMensal — antes `pctVeiculosInspecionados` sempre lia o mês mais
    // recente de Inspeções (mesInspPadrao), ignorando qual mês o usuário tinha escolhido no
    // seletor de Pressão de Ar. Resultado: ao olhar Setembro na Pressão, o quadro 1 continuava
    // mostrando Outubro (mês corrente de Inspeções, 2ª quinzena ainda sem dado = "100%"
    // enganoso). Agora passa explicitamente `mesAtivoGeral` (o mesmo mês selecionado no topo da
    // aba), igual os quadros 2/3/4 já faziam.
    const vInsp1 = pctVeiculosInspecionados("insp1", mesAtivoGeral);
    const vInsp2 = pctVeiculosInspecionados("insp2", mesAtivoGeral);
    // Corrigido (2026-10-01, mesmo caso do comentário de pctVeiculosInspecionados acima): uma
    // quinzena indisponível NÃO entra na soma do "Geral" como se tivesse 100% (count=total) —
    // isso inflava o "Geral (mês)" de outubro pra 50% logo no dia 1, antes de qualquer
    // inspeção de verdade. Quinzena indisponível agora soma 0/0 (não participa da conta), igual
    // a convenção já usada em linhasPendentesNoRound (round "geral") quando só uma quinzena tem
    // dado — aqui replicada pro quadro 1 da Pressão de Ar.
    const veiculosQuadro1Geral = {
      insp1: {
        count: vInsp1.disponivel ? Math.max(0, vInsp1.denom - vInsp1.pendentes) : 0,
        total: vInsp1.disponivel ? vInsp1.denom : 0,
        disponivel: vInsp1.disponivel,
      },
      insp2: {
        count: vInsp2.disponivel ? Math.max(0, vInsp2.denom - vInsp2.pendentes) : 0,
        total: vInsp2.disponivel ? vInsp2.denom : 0,
        disponivel: vInsp2.disponivel,
      },
    };
    veiculosQuadro1Geral.somaCount = veiculosQuadro1Geral.insp1.count + veiculosQuadro1Geral.insp2.count;
    veiculosQuadro1Geral.somaTotal = veiculosQuadro1Geral.insp1.total + veiculosQuadro1Geral.insp2.total;
    const insp = round === "geral"
      ? {
          pctAtingido: veiculosQuadro1Geral.somaTotal ? (veiculosQuadro1Geral.somaCount / veiculosQuadro1Geral.somaTotal) * 100 : 0,
          pendentes: veiculosQuadro1Geral.somaTotal - veiculosQuadro1Geral.somaCount,
          denom: veiculosQuadro1Geral.somaTotal,
        }
      : pctVeiculosInspecionados(round, mesAtivoGeral);

    // Filtro cruzado dos 4 quadros sobre os 2 gráficos abaixo (união entre os selecionados).
    const pendentesSet = new Set(linhasPendentesNoRound(round).map((r) => r.veiculo));
    // "pneus_inspecionados" agora é sempre true: `rows` já vem só com os eventos da rodada
    // ativa (ver eventosDoRound acima), então todo item de `rows` já é, por construção,
    // "inspecionado nesta rodada" — não tem mais um universo mais amplo pra filtrar dentro
    // (antes existia porque "Geral" vinha de um universo de pneus com leitura de qualquer
    // data, filtrado depois; migração pro R343A eliminou essa etapa intermediária).
    const QUADRO_CRIT = {
      veiculos_inspecionados: (t) => !pendentesSet.has(t.veiculo),
      pressao_correta: (t) => !t.semLeitura && !t.semPadrao && t.faixa === "correta",
      pneus_inspecionados: () => true,
      pressao_zero: (t) => t.semLeitura,
    };
    const sel = state.pressaoFiltroSel;
    // Seleção de faixa feita clicando na legenda do donut. IMPORTANTE: essa seleção NÃO filtra
    // o próprio donut (chartRows/pieData abaixo) — só destaca (dim nas outras fatias, já feito
    // em renderDonut). Se filtrasse o donut também, selecionar "Baixa" faria as OUTRAS faixas
    // sumirem do próprio gráfico de composição, o mesmo bug de auto-colapso já corrigido pro
    // gráfico de barras de filial (rows filtrado pela própria seleção que ele exibe). A seleção
    // de faixa só cruza pro gráfico de barras (chartRowsTodas abaixo), que é o que de fato deve
    // ser filtrado/somado por faixa.
    const selFaixa = state.pressaoFaixaSel;
    // Pneu sem leitura (pressão 0) não tem uma "faixa" de calibragem de verdade — pro filtro
    // cruzado (e pro donut) ele conta como a fatia especial "zero", não pelo `t.faixa` cru.
    const chaveFaixa = (t) => (t.semLeitura ? "zero" : t.faixa);
    const passaFaixa = (t) => selFaixa.size === 0 || selFaixa.has(chaveFaixa(t));
    const chartRows = rows.filter((t) => (sel.size === 0 || Array.from(sel).some((tipo) => QUADRO_CRIT[tipo](t))));

    // Mesmo filtro cruzado dos quadros, mas sobre rowsTodas (ignora selFiliais) — só pro gráfico
    // de barras por filial, que precisa continuar mostrando TODAS as filiais (destacando as
    // selecionadas) pra permitir comparação, em vez de sumir com as demais quando você seleciona
    // uma barra. Aqui SIM aplica `passaFaixa`: clicar numa faixa do donut deve filtrar/destacar
    // este gráfico pra mostrar quais filiais têm mais daquela faixa — Ctrl+clique soma faixas
    // (união), mostrando o total combinado por filial.
    const QUADRO_CRIT_TODAS = QUADRO_CRIT;
    const chartRowsTodas = rowsTodas.filter((t) => (sel.size === 0 || Array.from(sel).some((tipo) => QUADRO_CRIT_TODAS[tipo](t))) && passaFaixa(t));

    // Colunas empilhadas por filial: cada barra soma os pneus lidos daquela filial, desmembrada
    // nas 6 categorias (5 faixas + "zero"). `chartRowsTodas` já veio filtrado por `passaFaixa`
    // (pedido do Joao, 2026-09-15) — sem faixa selecionada no donut, entram as 6; selecionando
    // uma ou mais (Ctrl+clique soma), a pilha mostra só as selecionadas, ou vira barra de 1 cor
    // só quando é uma faixa única. "sem padrão" nunca entra (dado não classificável).
    const porFilialFaixa = new Map();
    chartRowsTodas.forEach((t) => {
      if (t.semPadrao) return;
      const k = chaveFaixa(t);
      if (!porFilialFaixa.has(t.filial)) {
        porFilialFaixa.set(t.filial, { filial: t.filial, total: 0, muito_baixa: 0, baixa: 0, correta: 0, alta: 0, muito_alta: 0, zero: 0 });
      }
      const entry = porFilialFaixa.get(t.filial);
      entry[k] = (entry[k] || 0) + 1;
      entry.total += 1;
    });
    const barData = Array.from(porFilialFaixa.values()).sort((a, b) => b.total - a.total);

    // "zero" (pressão zero/sem leitura) entra como fatia própria (cinza) no donut, ao lado das
    // 5 faixas — pedido do Joao. "sem padrão" continua fora do donut (dado não classificável).
    const faixaCountsChart = { muito_baixa: 0, baixa: 0, correta: 0, alta: 0, muito_alta: 0, zero: 0 };
    chartRows.filter((t) => !t.semPadrao).forEach((t) => { const k = chaveFaixa(t); faixaCountsChart[k] = (faixaCountsChart[k] || 0) + 1; });
    const pieData = Object.entries(faixaCountsChart).filter(([, v]) => v > 0)
      .map(([k, v]) => ({ key: k, name: FAIXA_PRESSAO_LABEL[k], value: v, color: FAIXA_PRESSAO_TONE[k] }));

    // Quadro "Veículos com pneus fora do padrão" (pedido do Joao, 2026-09-16; ajustado
    // 2026-09-16 pra tratar pressão zero como fora do padrão também). Fora do padrão =
    // qualquer pneu que não seja "correta" — inclui as 4 faixas ruins (muito_baixa, baixa,
    // alta, muito_alta) E semLeitura (pressão 0: sem calibragem nenhuma é o pior caso, não faz
    // sentido tratar como "sem dado" e deixar de fora). Só semPadrao continua excluído (medida
    // não reconhecida, não dá pra classificar contra padrão nenhum). Parte de `rows` (já tem
    // filial/busca/seleção de barra + rodada aplicados) e respeita TAMBÉM os outros 2 filtros
    // cruzados da aba (quadros e faixa do donut), pra ficar consistente com o resto da página:
    // clicar em "Muito baixa" no donut, por exemplo, estreita esta lista só pros veículos com
    // pneu muito baixo.
    // `rows` agora pode ter mais de um evento pra mesma posição (leitura repetida na
    // quinzena) — pra esta tabela (que mostra o ESTADO ATUAL de cada posição, não um
    // histórico de eventos), dedup pro evento mais recente de cada posição dentro da rodada
    // antes de aplicar os filtros cruzados, senão a mesma posição apareceria 2x na lista.
    const ultimoPorPosicaoNaRodada = (() => {
      const porChave = new Map();
      rows.forEach((t) => {
        const chave = t.veiculo + "|" + t.posicao;
        const atual = porChave.get(chave);
        if (!atual || (t.dataInsp || "") >= (atual.dataInsp || "")) porChave.set(chave, t);
      });
      return Array.from(porChave.values());
    })();
    const foraPadraoDetalhe = ultimoPorPosicaoNaRodada.filter((t) => !t.semPadrao && (t.semLeitura || t.faixa !== "correta")
      && (sel.size === 0 || Array.from(sel).some((tipo) => QUADRO_CRIT[tipo](t)))
      && passaFaixa(t));
    const porVeiculoForaPadrao = new Map();
    foraPadraoDetalhe.forEach((t) => {
      if (!porVeiculoForaPadrao.has(t.veiculo)) {
        porVeiculoForaPadrao.set(t.veiculo, { veiculo: t.veiculo, filial: t.filial, tipoDesc: t.tipoDesc, itens: [] });
      }
      porVeiculoForaPadrao.get(t.veiculo).itens.push({ posicao: t.posicao, faixaKey: chaveFaixa(t), pctPadrao: t.pctPadrao, pressaoAtual: t.pressaoAtual });
    });
    const veiculosForaPadrao = Array.from(porVeiculoForaPadrao.values())
      .map((v) => ({ ...v, qtd: v.itens.length }))
      .sort((a, b) => b.qtd - a.qtd || a.veiculo.localeCompare(b.veiculo));

    // Modo "Todos os veículos" (2026-10-08): todos os veículos da frota, cada um com o último
    // estado conhecido de cada posição (pressaoTires = mês corrente + pressaoOutros = meses
    // anteriores) e a data da última leitura. "Desatualizado" = nenhum evento do veículo na
    // rodada/mês que está selecionada no painel (mesma base de eventosDoRound).
    let veiculosTodos = null;
    if (state.pressaoTodos) {
      const info = DATA.veiculosInfo || {};
      const inspecionadosNoPeriodo = new Set(eventosDoRound(round).map((e) => e.veiculo));
      const periodoSemDado = round !== "geral" && !disponivel;
      const rotuloPeriodo = round === "insp1" ? "1ª quinzena" : round === "insp2" ? "2ª quinzena" : "mês selecionado";
      const porVeic = new Map();
      (DATA.pressaoTires || []).concat(DATA.pressaoOutros || []).forEach((tr) => {
        if (!porVeic.has(tr.veiculo)) porVeic.set(tr.veiculo, []);
        porVeic.get(tr.veiculo).push(tr);
      });
      const placas = new Set([...Object.keys(info), ...porVeic.keys()]);
      veiculosTodos = [];
      placas.forEach((placa) => {
        const tires = porVeic.get(placa) || [];
        const meta = tires[0] || info[placa] || {};
        const filial = tires[0] ? tires[0].filial : (info[placa] && info[placa].filial);
        if (!filial || ehFilialSucata(filial)) return;
        if (state.filtroFilial !== "all" && filial !== state.filtroFilial) return;
        if (state.busca && !placa.toLowerCase().includes(state.busca.toLowerCase())) return;
        if (state.selFiliais.size && !state.selFiliais.has(filial)) return;
        const datas = tires.map((x) => x.dataInsp).filter(Boolean).sort();
        const ultima = datas.length ? datas[datas.length - 1] : ((info[placa] && info[placa].ultimaInsp) || null);
        const fora = tires.filter((x) => !x.semPadrao && (x.semLeitura || x.faixa !== "correta"));
        veiculosTodos.push({
          veiculo: placa, filial, tipoDesc: meta.tipoDesc || (info[placa] && info[placa].tipoDesc) || null,
          tires, qtd: fora.length,
          grave: fora.some((x) => x.semLeitura || x.faixa === "muito_baixa" || x.faixa === "muito_alta"),
          ultimaLeitura: ultima,
          desatualizado: !periodoSemDado && !inspecionadosNoPeriodo.has(placa),
        });
      });
      veiculosTodos.sort((a, b) => b.qtd - a.qtd || a.veiculo.localeCompare(b.veiculo));
      veiculosTodos.rotulo = rotuloPeriodo;
    }

    return {
      round, disponivel, rows, posicoesInspecionadas, denomQuadro3, foraPadrao, semLeitura, semPadrao, cobertura, faixaCounts,
      pctCorreta, totalComPadraoConhecido, pctInspecionados, pctPressaoZero, insp, barData, pieData, pressaoQuadro3Geral,
      veiculosQuadro1Geral, foraPadraoDetalhe, veiculosForaPadrao, mesAtivo: mesAtivoGeral, veiculosTodos,
    };
  }

  function renderPressaoPanel() {
    const d = computePressao();
    const listaPressao = state.pressaoTodos && d.veiculosTodos ? d.veiculosTodos : d.veiculosForaPadrao;
    const filiais = Array.from(new Set(DATA.pressaoTires.concat(DATA.pressaoOutros || []).map((t) => t.filial))).sort();
    const scopeLabel = scopeLabelText();
    const roundsPressao = `<div class="seg-group">
        <button class="seg-btn ${state.pressaoRound === "insp1" ? "active" : ""}" data-pressao-round="insp1">1ª quinzena</button>
        <button class="seg-btn ${state.pressaoRound === "insp2" ? "active" : ""}" data-pressao-round="insp2">2ª quinzena</button>
        <button class="seg-btn ${state.pressaoRound === "geral" ? "active" : ""}" data-pressao-round="geral">Geral (mês)</button>
      </div>`;
    // Seletor de mês (pedido do Joao, 2026-10-01: "quero que a parte de pressão também tenha
    // o filtro de data") — mesmo padrão do seletor de Inspeções Pendentes: só aparece quando
    // há mais de 1 mês arquivado em DATA.pressaoHistoricoMensal (ver
    // build_pressao_historico_mensal_arquivo no generate_data.py).
    const mesesDisponiveisPressao = Object.keys(DATA.pressaoHistoricoMensal || {}).sort();
    const mesSelectPressao = mesesDisponiveisPressao.length > 1 ? `<select id="ctl-mes-pressao">
        ${mesesDisponiveisPressao.slice().reverse().map((m) => `<option value="${m}" ${m === d.mesAtivo ? "selected" : ""}>${escapeHtml(fmtMesAno(m))}</option>`).join("")}
      </select>` : "";
    const todosPressaoBtn = `<div class="seg-group">
        <button class="seg-btn ${state.pressaoTodos ? "active" : ""}" data-pressao-todos="1" title="Lista todos os veículos da frota e o mapa de pressão de cada um">Todos os veículos</button>
      </div>`;
    const rodadaLabel = state.pressaoRound === "insp1" ? "1ª quinzena" : state.pressaoRound === "insp2" ? "2ª quinzena" : "mês";
    const vendoMesAtual = d.mesAtivo === mesPressaoPadrao();
    const desc = d.round !== "geral" && !d.disponivel
      ? `A ${rodadaLabel} ainda não tem leitura de pressão atualizada${vendoMesAtual ? "" : ` (${fmtMesAno(d.mesAtivo)})`}.`
      : `Percentual da pressão coletada em relação ao padrão da medida do pneu (275→110psi, 295→120psi, 1100→120psi, 215→105psi) — ${rodadaLabel}${scopeLabel}${vendoMesAtual ? "" : ` · ${fmtMesAno(d.mesAtivo)}`}.`;
    const isSel = (k) => state.pressaoFiltroSel.has(k);
    // Tendência/seta (histórico dia a dia) só faz sentido olhando o mês corrente — é uma série
    // por data de geração, não existe um equivalente por mês passado (ver pressaoCorretaTrendHtml
    // e DATA.pressaoCorretaHistorico, que o backend já restringe ao mês atual desde 2026-09-25).
    const trendHtml = vendoMesAtual ? pressaoCorretaTrendHtml() : "";
    const arrowHtml = vendoMesAtual ? pressaoCorretaValueArrowHtml() : "";

    return `
      ${panelHeader("Pressão de Ar", desc, filiais, roundsPressao + todosPressaoBtn + mesSelectPressao)}
      <div class="kpi-grid">
        ${(() => {
          // Corrigido (2026-10-01): quinzena individual sem leitura ainda mostrava "100%" (0
          // pendentes interpretado como "tudo inspecionado", quando na real é "sem dado
          // nenhum"). Só se aplica no modo quinzena única — no modo Geral a soma já exclui a
          // quinzena indisponível (ver veiculosQuadro1Geral acima), então o % ali já é real.
          const semLeituraInsp = d.round !== "geral" && d.insp.disponivel === false;
          const valor = semLeituraInsp ? "—" : fmtPct(d.insp.pctAtingido);
          const tom = semLeituraInsp ? "var(--text-faint)" : d.insp.pctAtingido >= 85 ? "var(--success)" : d.insp.pctAtingido >= 70 ? "var(--warning)" : "var(--danger)";
          return kpiCard("% veículos inspecionados", valor, veiculosQuadro1Hint(d, scopeLabel, rodadaLabel), ICONS.truck, tom, "veiculos_inspecionados", isSel("veiculos_inspecionados"));
        })()}
        ${kpiCard("% pressão correta", fmtPct(d.pctCorreta), `${d.faixaCounts.correta} de ${d.totalComPadraoConhecido} pneus com padrão de medida conhecido${scopeLabel} — mesmo total da rosca ao lado (pressão zero conta como "não correta")`, ICONS.ring, d.pctCorreta >= 70 ? "var(--success)" : d.pctCorreta >= 40 ? "var(--warning)" : "var(--danger)", "pressao_correta", isSel("pressao_correta"), trendHtml, arrowHtml)}
        ${kpiCard("% pneus inspecionados", fmtPct(d.pctInspecionados), pressaoQuadro3Hint(d, scopeLabel, rodadaLabel), ICONS.clipboard, d.pctInspecionados >= 85 ? "var(--success)" : d.pctInspecionados >= 60 ? "var(--warning)" : "var(--danger)", "pneus_inspecionados", isSel("pneus_inspecionados"))}
        ${kpiCard("% pressão zero", fmtPct(d.pctPressaoZero), `${d.semLeitura.length} de ${d.rows.length} pneus sem leitura${scopeLabel}`, ICONS.alert, d.pctPressaoZero >= 15 ? "var(--danger)" : d.pctPressaoZero >= 5 ? "var(--warning)" : "var(--success)", "pressao_zero", isSel("pressao_zero"))}
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-title">${state.pressaoFaixaSel.size > 0 ? `Qtd. de pneus (${Array.from(state.pressaoFaixaSel).map((k) => FAIXA_PRESSAO_LABEL[k] || k).join(", ")}), por filial` : "Qtd. de pneus lidos, por filial (por faixa)"}</div>

          ${chartHint()}
          <div id="chart-pressao-bar"></div>
        </div>
        <div class="card">
          <div class="card-title">Composição por faixa${scopeLabel}</div>
          ${pressaoFaixaHint()}
          <div id="chart-pressao-pie"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">${state.pressaoTodos ? "Todos os veículos" : "Veículos com pneus fora do padrão"}</div>
        <div class="chart-hint">${state.pressaoTodos && d.veiculosTodos ? `${d.veiculosTodos.length} veículo(s)${scopeLabel} — ${d.veiculosTodos.filter((v) => v.desatualizado).length} sem inspeção na ${d.veiculosTodos.rotulo} (mapa marcado como desatualizado). Mostra o último estado conhecido de cada posição.` : `${d.foraPadraoDetalhe.length} pneu(s) em ${d.veiculosForaPadrao.length} veículo(s)${scopeLabel} — ${rodadaLabel}. Inclui pressão zero (sem leitura); não inclui medida sem padrão cadastrado.`}</div>
        <div class="sulco-layout" style="margin-top:8px;">
          <div class="table-wrap" style="margin:0;">
            <table>
              <thead><tr>${sortTh("fp_placa", "Placa")}${sortTh("fp_filial", "Filial")}${sortTh("fp_tipo", "Tipo")}${sortTh("fp_qtd", "Qtd. fora do padrão")}${state.pressaoTodos ? sortTh("fp_ult", "Última leitura") : ""}</tr></thead>
              <tbody>
                ${listaPressao.length === 0 ? emptyRow(state.pressaoTodos ? 5 : 4, state.pressaoTodos ? "Nenhum veículo encontrado." : "Nenhum veículo com pneu fora do padrão nesse filtro.") :
                  applySort(listaPressao, {
                    fp_placa: (v) => v.veiculo, fp_filial: (v) => normalizeText(filialFullName(v.filial)),
                    fp_tipo: (v) => v.tipoDesc || "", fp_qtd: (v) => v.qtd, fp_ult: (v) => v.ultimaLeitura || "",
                  }).map((v) => {
                    const grave = v.itens ? v.itens.some((i) => i.faixaKey === "muito_baixa" || i.faixaKey === "muito_alta" || i.faixaKey === "zero") : v.grave;

                      ? (v.tires.length === 0 ? `<span style="color:var(--text-faint)">sem leitura</span>` : v.qtd > 0 ? severityPill(grave ? "danger" : "warning", String(v.qtd)) : severityPill("success", "OK"))

                    return `<tr class="pressao-fora-row ${state.selVeiculoPressao === v.veiculo ? "selected" : ""}" data-veiculo="${escapeHtml(v.veiculo)}">

                      <td>${escapeHtml(filialSigla(v.filial))} <span style="color:var(--text-faint)">— ${escapeHtml(filialFullName(v.filial))}</span></td>
                      <td style="color:var(--text-dim);">${escapeHtml(v.tipoDesc || "—")}</td>
                      <td>${celulaQtd}</td>
                      ${state.pressaoTodos ? `<td class="mono">${v.ultimaLeitura ? escapeHtml(fmtDate(v.ultimaLeitura)) : "—"}${v.desatualizado ? `<span class="stale-pill">desatualizado</span>` : ""}</td>` : ""}

              </tbody>

            <div class="table-note">Clique numa linha pra ver o mapa do veículo com o status de cada pneu.</div>
          </div>
          ${renderPressaoDetail(d)}

    if (state.planoStatus === "abertos") l = l.filter((p) => PLANO_ABERTOS.indexOf(p.status) >= 0 || mantem(p));
    else if (state.planoStatus === "atrasados") l = l.filter((p) => planoAtrasado(p) || mantem(p));
    else if (state.planoStatus !== "todos") l = l.filter((p) => p.status === state.planoStatus || mantem(p));
    const q = normalizeText(state.busca);
    if (q) l = l.filter((p) => normalizeText([p.placa, p.acao, p.pneus, p.responsavel, p.origem].concat(planoItens(p.id).map((i) => i.texto)).join(" ")).indexOf(q) >= 0);
    l.sort((a, b) =>
      (PLANO_ORD_STATUS[a.status] - PLANO_ORD_STATUS[b.status]) ||
      (PLANO_ORD_PRIO[a.prioridade] - PLANO_ORD_PRIO[b.prioridade]) ||
      ((a.prazo || "9999").localeCompare(b.prazo || "9999")) ||
      String(b.criadoEm).localeCompare(String(a.criadoEm)));
    return applySort(l, {
      status: (p) => PLANO_ORD_STATUS[p.status], prio: (p) => PLANO_ORD_PRIO[p.prioridade],
      placa: (p) => p.placa, filial: (p) => normalizeText(filialFullName(p.filial)),
      prazo: (p) => p.prazo || "9999", resp: (p) => p.responsavel || "",
    });
  }

  // ---------- Painel ----------
  // Lê o formulário do DOM pro rascunho. O render() chama isso ANTES de trocar o HTML; quem altera
  // o rascunho por código (atalho, clique no pneu, abrir/editar) liga planoSkipSync pra o render
  // não sobrescrever a alteração com o valor antigo que ainda está no DOM.
  function planoSyncDraft() {
    if (state.planoSkipSync) { state.planoSkipSync = false; return; }
    if (state.panel !== "plano" || state.planoView !== "form" || !state.planoDraft) return;
    const g = (id) => { const el = document.getElementById(id); return el ? el.value : null; };
    if (g("pl-placa") === null) return; // DOM antigo não é do formulário
    const d = state.planoDraft;
    d.placa = limpaPlaca(g("pl-placa"));
    const op = g("pl-op"); if (op !== null) d.op = op;
    d.prioridade = g("pl-prio"); d.responsavel = g("pl-resp"); d.prazo = g("pl-prazo"); d.origem = g("pl-origem");
    const st = g("pl-status"); if (st) d.status = st;
    const tx = g("pl-acao"); if (tx !== null) d.texto = tx;
    const pn = g("pl-pneus"); if (pn !== null) d.pneus = pn;
  }

  function planoBanner() {
    const partes = [];
    if (PlanoStore.modo === "local") {
      partes.push(`<div class="banner banner-warn"><strong>MODO TESTE LOCAL</strong> — os planos ficam salvos só neste navegador (ninguém mais vê). Para a equipe toda ver os mesmos planos, falta ligar a base compartilhada (Google Planilha).</div>`);
    }
    if (PlanoStore.carregando) partes.push(`<div class="banner">Carregando planos da base compartilhada…</div>`);
    if (PlanoStore.erro) {
      partes.push(`<div class="banner banner-erro">${escapeHtml(PlanoStore.erro)}${PlanoStore.precisaPin ? ` <input id="pl-pin" type="password" placeholder="Senha" value="${escapeHtml(PlanoStore.pin)}" style="width:140px;margin-left:8px;">` : ""}</div>`);
    }
    return partes.join("");
  }

  function renderPlanoPanel() {
    planoSyncDraft();
    const veics = planoVeiculos();
    const filiais = planoFiliais(veics);
    const extra = `
      <input id="ctl-autor" placeholder="Seu nome" value="${escapeHtml(state.planoAutor)}" style="min-width:130px;max-width:150px;" title="Aparece como autor dos planos, ações concluídas e andamentos">
      ${state.planoView === "lista" ? `<select id="pl-status-filtro" title="Filtrar por status">
        <option value="abertos" ${state.planoStatus === "abertos" ? "selected" : ""}>Em aberto (aberto + andamento)</option>
        <option value="atrasados" ${state.planoStatus === "atrasados" ? "selected" : ""}>Atrasados</option>
        <option value="todos" ${state.planoStatus === "todos" ? "selected" : ""}>Todos os status</option>
        ${PLANO_STATUS.map((s) => `<option value="${s}" ${state.planoStatus === s ? "selected" : ""}>${s}</option>`).join("")}
      </select>` : ""}
      ${state.planoView === "lista" ? `<button class="btn btn-primary" data-plano-novo>＋ Novo plano</button>` : ""}`;
    const desc = "Um plano por veículo, com várias ações em checklist. Marque cada ação como concluída conforme a operação executa e gere o relatório de cobrança.";
    const cab = panelHeader("Plano de Ação", desc, filiais, extra);
    if (state.planoView === "form") return cab + planoBanner() + renderPlanoForm(veics);
    return cab + planoBanner() + renderPlanoLista();
  }

  function planoProgressoHtml(p) {
    const it = planoItens(p.id);
    if (!it.length) return `<span style="color:var(--text-faint)">sem ações</span>`;
    const f = it.filter((i) => i.feito).length;
    const pend = it.filter((i) => !i.feito);
    const pct = Math.round((f / it.length) * 100);
    return `<div class="prog-wrap"><div class="prog-top"><span class="mono" style="font-weight:700;">${f}/${it.length}</span>
        <span class="prog-bar"><span class="prog-fill" style="width:${pct}%"></span></span></div>
      ${pend.slice(0, 2).map((i) => `<div class="prog-item">☐ ${escapeHtml(i.texto)}</div>`).join("")}
      ${pend.length > 2 ? `<div class="prog-item" style="color:var(--text-faint)">+${pend.length - 2} pendente(s)</div>` : ""}
      ${pend.length === 0 ? `<div class="prog-item" style="color:var(--success)">todas concluídas</div>` : ""}</div>`;
  }

  function renderPlanoLista() {
    const todosFilial = PlanoStore.planos.filter((p) => state.filtroFilial === "all" || filialSigla(p.filial) === filialSigla(state.filtroFilial));
    const nAb = todosFilial.filter((p) => p.status === "Aberto").length;
    const nAnd = todosFilial.filter((p) => p.status === "Em andamento").length;
    const nAtr = todosFilial.filter(planoAtrasado).length;
    const nCon = todosFilial.filter((p) => p.status === "Concluído").length;
    const lista = planosVisiveis();
    const kpis = `<div class="kpi-grid">
      ${kpiCard("Abertos", nAb, "nenhuma ação concluída ainda", ICONS.clipboard, "var(--warning)")}
      ${kpiCard("Em andamento", nAnd, "operação já está atuando", ICONS.truck, "var(--chart2)")}
      ${kpiCard("Atrasados", nAtr, "prazo vencido e não concluído", ICONS.alert, "var(--danger)")}
      ${kpiCard("Concluídos", nCon, "todas as ações feitas", ICONS.check, "var(--success)")}
    </div>`;
    const relBar = `<div class="rel-bar">
      <span class="rel-label">Relatório da lista abaixo (${lista.length} plano${lista.length === 1 ? "" : "s"}):</span>
      <button class="btn btn-sm" id="pl-rel-print" ${lista.length ? "" : "disabled"}>🖨 Imprimir / salvar PDF</button>
      <button class="btn btn-sm" id="pl-rel-csv" ${lista.length ? "" : "disabled"}>⬇ Baixar Excel (CSV)</button>
      <button class="btn btn-sm" id="pl-rel-wpp" ${lista.length ? "" : "disabled"}>📋 Copiar p/ WhatsApp</button>
    </div>`;
    const linhas = lista.length === 0
      ? emptyRow(9, PlanoStore.planos.length === 0 ? "Nenhum plano criado ainda. Clique em “＋ Novo plano” ou use o botão direito no mapa do veículo (Sulco Baixo / Pressão de Ar)." : "Nenhum plano com esses filtros.")
      : lista.map((p) => planoLinhaHtml(p)).join("");
    return `${kpis}${relBar}
      <div class="table-wrap">
        <table>
          <thead><tr>${sortTh("status", "Status")}${sortTh("prio", "Prioridade")}${sortTh("placa", "Placa")}${sortTh("filial", "Filial")}<th>Ações do plano</th><th>Pneus</th>${sortTh("resp", "Responsável")}${sortTh("prazo", "Prazo")}<th>Último andamento</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
        <div class="table-note">Clique numa linha para abrir o checklist: marque as ações concluídas, adicione novas, registre andamento, edite ou exclua o plano.</div>
      </div>`;
  }

  function planoItemHtml(i) {
    const meta = [];
    if (i.pneus) meta.push(`pneus: ${escapeHtml(i.pneus)}`);
    if (i.feito) meta.push(`concluída ${escapeHtml(fmtDataHora(i.feitoEm))}${i.feitoPor ? ` por ${escapeHtml(i.feitoPor)}` : ""}`);
    return `<div class="item-row ${i.feito ? "done" : ""}">
      <button class="item-check ${i.feito ? "on" : ""}" data-item-toggle="${escapeHtml(i.id)}" data-feito="${i.feito ? "0" : "1"}" title="${i.feito ? "Desmarcar" : "Marcar como concluída"}" aria-label="${i.feito ? "Desmarcar ação" : "Marcar ação como concluída"}">${i.feito ? ICONS.check : ""}</button>
      <div class="item-body"><div class="item-text">${escapeHtml(i.texto)}</div>${meta.length ? `<div class="item-meta">${meta.join(" · ")}</div>` : ""}</div>
      <button class="item-del" data-item-del="${escapeHtml(i.id)}" title="Excluir esta ação" aria-label="Excluir ação">✕</button>
    </div>`;
  }

  function planoLinhaHtml(p) {
    const aberta = state.planoSel === p.id;
    const ult = planoUltimoAndamento(p.id);
    const atras = planoAtrasado(p);
    const linha = `<tr class="plano-row ${aberta ? "selected" : ""}" data-plano-id="${escapeHtml(p.id)}">
      <td>${planoStatusPill(p.status)}</td>
      <td>${planoPrioPill(p.prioridade)}</td>
      <td class="mono" style="font-weight:600;">${escapeHtml(p.placa)}</td>
      <td>${escapeHtml(filialSigla(p.filial))} <span style="color:var(--text-faint)">— ${escapeHtml(filialFullName(p.filial))}</span></td>
      <td style="white-space:normal;min-width:240px;max-width:380px;">${planoProgressoHtml(p)}</td>
      <td class="mono" style="white-space:normal;max-width:140px;">${escapeHtml(p.pneus || "—")}</td>
      <td>${escapeHtml(p.responsavel || "—")}</td>
      <td>${p.prazo ? escapeHtml(fmtDate(p.prazo)) : "—"}${atras ? ` <span class="pill pill-danger">atrasado</span>` : ""}</td>
      <td style="white-space:normal;max-width:220px;color:var(--text-dim);">${ult ? `${escapeHtml(ult.texto)} <span style="color:var(--text-faint)">(${escapeHtml(fmtDataHora(ult.em))})</span>` : "—"}</td>
    </tr>`;
    if (!aberta) return linha;
    const itens = planoItens(p.id);
    const checklist = itens.length === 0 ? `<div class="detail-empty" style="padding:14px;">Este plano ainda não tem ações. Adicione abaixo.</div>` : `<div class="item-list">${itens.map(planoItemHtml).join("")}</div>`;
    const hist = PlanoStore.andamento.filter((a) => a.planoId === p.id).sort((a, b) => String(b.em).localeCompare(String(a.em)));
    const timeline = hist.length === 0 ? `<div class="chart-hint">Sem observações registradas.</div>` :
      `<div class="timeline">${hist.map((a) => `<div class="tl-item">
        <div class="tl-when">${escapeHtml(fmtDataHora(a.em))}${a.autor ? ` · ${escapeHtml(a.autor)}` : ""}${a.status ? ` · → ${planoStatusPill(a.status)}` : ""}</div>
        ${a.texto ? `<div class="tl-text">${escapeHtml(a.texto)}</div>` : ""}
      </div>`).join("")}</div>`;
    const det = `<tr class="plano-detail-row"><td colspan="9">
      <div class="plano-detail">
        <div>
          <div class="card-title">Ações do plano</div>
          <div class="chart-hint">Criado por ${escapeHtml(p.criadoPor || "—")} em ${escapeHtml(fmtDataHora(p.criadoEm))}${p.origem ? ` · origem: ${escapeHtml(p.origem)}` : ""}${p.concluidoEm ? ` · concluído em ${escapeHtml(fmtDataHora(p.concluidoEm))}` : ""}</div>
          ${checklist}
          <div class="item-add">
            <input id="pl-item-texto" placeholder="Nova ação (ex.: Inverter pneus do eixo de tração)" autocomplete="off">
            <input id="pl-item-pneus" placeholder="Pneus nº (opcional)" style="max-width:150px;" autocomplete="off">
            <button class="btn btn-primary btn-sm" data-item-add="${escapeHtml(p.id)}">＋ Adicionar ação</button>
          </div>
        </div>
        <div>
          <div class="card-title">Observações / andamento</div>
          <div class="field"><textarea id="pl-and-texto" rows="3" placeholder="Ex.: Pneu já pedido ao fornecedor, previsão de chegada dia 10."></textarea></div>
          <div class="field" style="margin-top:8px;"><label>Status do plano</label>
            <select id="pl-and-status">${PLANO_STATUS.map((s) => `<option value="${s}" ${p.status === s ? "selected" : ""}>${s}</option>`).join("")}</select>
            <div class="field-hint">O status acompanha as ações sozinho (todas feitas = Concluído). Use aqui só para Cancelar ou forçar.</div></div>
          <div class="form-actions">
            <button class="btn btn-primary btn-sm" data-plano-and="${escapeHtml(p.id)}" ${PlanoStore.ocupado ? "disabled" : ""}>Registrar observação</button>
            <button class="btn btn-sm" data-plano-edit="${escapeHtml(p.id)}">Editar dados do plano</button>
            <button class="btn btn-sm btn-danger" data-plano-del="${escapeHtml(p.id)}">Excluir plano</button>
          </div>
          ${timeline}
        </div>
      </div>
    </td></tr>`;
    return linha + det;
  }

  function renderPlanoForm(veics) {
    const d = state.planoDraft;
    const editando = !!d.id;
    const info = d.placa ? veics.get(d.placa) : null;
    const mapa = info ? planoVehicleMap(d.placa) : null;
    const sel = planoPneusSet(d.pneus);
    const opsLista = planoFiliais(veics);
    const opSel = d.op || "";
    const opOpts = `<option value="">— todas as operações —</option>` +
      opsLista.map((f) => `<option value="${escapeHtml(filialSigla(f))}" ${opSel === filialSigla(f) ? "selected" : ""}>${escapeHtml(filialSigla(f))} — ${escapeHtml(filialFullName(f))}</option>`).join("");
    const opts = Array.from(veics.values()).filter((v) => !opSel || filialSigla(v.filial) === opSel).sort((a, b) => a.placa.localeCompare(b.placa))
      .map((v) => `<option value="${escapeHtml(v.placa)}">${escapeHtml(filialSigla(v.filial))} · ${escapeHtml(v.tipo)}</option>`).join("");
    const modelos = PLANO_MODELOS.map((m, i) => `<button type="button" class="btn btn-sm btn-modelo" data-modelo="${i}">${escapeHtml(m.replace("{pneus}", "…"))}</button>`).join("");
    // Responsável = filial da operação (lista suspensa). Valor antigo fora da lista (plano criado
    // quando era texto livre) continua aparecendo pra não se perder ao editar.
    const nomesFilial = planoFiliais(veics).map(filialFullName);
    const respOpts = `<option value="">— selecione a filial —</option>` +
      (d.responsavel && nomesFilial.indexOf(d.responsavel) < 0 ? `<option value="${escapeHtml(d.responsavel)}" selected>${escapeHtml(d.responsavel)}</option>` : "") +
      nomesFilial.map((n) => `<option value="${escapeHtml(n)}" ${d.responsavel === n ? "selected" : ""}>${escapeHtml(n)}</option>`).join("");
    const dica = !d.placa ? "" : info
      ? `<div class="field-hint">${escapeHtml(filialSigla(info.filial))} — ${escapeHtml(filialFullName(info.filial))} · ${escapeHtml(info.tipo || "tipo não informado")}</div>`
      : `<div class="field-hint" style="color:var(--warning);">Placa fora da base de veículos registrados — o plano será salvo mesmo assim.</div>`;
    const pick = (fn) => (t) => {
      const h = fn(t);
      if (!t.pneu || t.vazio || t.semDado) return h;
      return h.replace('class="tire-chip"', `class="tire-chip chip-pick${sel.has(String(t.pneu)) ? " sel" : ""}"`);
    };
    let lado;
    if (!info) lado = `<div class="card detail-card"><div class="card-title">Esquema do veículo</div><div class="detail-empty">Escolha uma placa conhecida para ver o mapa dos pneus. Clique num pneu do mapa para incluir o nº de fogo na ação.</div></div>`;
    else lado = `<div class="card detail-card">
        <div class="detail-plate-label">Veículo do plano</div>
        <div class="detail-plate">${escapeHtml(info.placa)}</div>
        <div class="detail-sub">${escapeHtml(filialSigla(info.filial))} — ${escapeHtml(filialFullName(info.filial))} · ${escapeHtml(info.tipo || "—")}</div>
        ${mapa ? `<div class="card-title" style="margin-top:18px;">Esquema do veículo <span style="color:var(--text-faint)">· ${mapa.fonte}</span></div>
          ${mapa.temSulco && mapa.temPressao ? `<div class="seg-group" style="margin-top:8px;align-self:flex-start;width:fit-content;">
            <button class="seg-btn ${mapa.atual === "sulco" ? "active" : ""}" data-mapa="sulco">Sulco</button>
            <button class="seg-btn ${mapa.atual === "pressao" ? "active" : ""}" data-mapa="pressao">Pressão</button></div>` : ""}
          ${!mapa.temSulco ? `<div class="field-hint" style="color:var(--warning);">Este veículo não tem leitura de sulco no relatório de Sulco Baixo — mostrando a pressão (psi). O nº de fogo vale igual.</div>` : !mapa.temPressao ? `<div class="field-hint">Este veículo não tem leitura de pressão no relatório atual — mostrando o sulco (mm).</div>` : ""}
          ${renderTireDiagram({ tires: mapa.tires }, pick(mapa.chip))}
          ${editando ? "" : `<div class="table-note" style="padding-left:0;">Clique num pneu para incluir/retirar o nº de fogo em “Pneus desta ação”. Pneus selecionados ficam com contorno laranja.</div>`}`
          : `<div class="detail-empty">Sem dados de pneus deste veículo nos relatórios atuais. Digite os nº de fogo manualmente.</div>`}
      </div>`;
    const lista = (d.itens || []).map((i, n) => `<div class="item-row"><span class="item-bullet">${n + 1}</span>
        <div class="item-body"><div class="item-text">${escapeHtml(i.texto)}</div>${i.pneus ? `<div class="item-meta">pneus: ${escapeHtml(i.pneus)}</div>` : ""}</div>
        <button class="item-del" data-draft-del="${n}" title="Tirar da lista" aria-label="Tirar da lista">✕</button></div>`).join("");
    const construtor = editando ? `<div class="field span2"><div class="field-hint">As ações deste plano (marcar concluída, adicionar, excluir) são feitas no checklist, ao clicar na linha do plano na lista.</div></div>` : `
          <div class="field span2"><div class="card-title" style="margin-bottom:6px;">Ações do plano <span style="color:var(--text-faint);text-transform:none;letter-spacing:0;">(${(d.itens || []).length} na lista)</span></div>
            ${lista ? `<div class="item-list">${lista}</div>` : `<div class="field-hint">Nenhuma ação na lista ainda. Escreva abaixo e clique em “Adicionar à lista” — repita para cada ação do veículo.</div>`}</div>
          <div class="field span2"><label for="pl-acao">Nova ação — o que precisa ser feito</label>
            <textarea id="pl-acao" rows="2" placeholder="Ex.: Trocar pneu nº 3429">${escapeHtml(d.texto || "")}</textarea>
            <div class="modelos"><span class="field-hint" style="margin:0;">Atalhos:</span>${modelos}</div></div>
          <div class="field span2"><label for="pl-pneus">Pneus desta ação (nº de fogo)</label>
            <div style="display:flex;gap:8px;"><input id="pl-pneus" value="${escapeHtml(d.pneus || "")}" placeholder="Ex.: 1146, 0004 (ou clique no mapa)"><button class="btn btn-primary" id="pl-add-item" style="flex-shrink:0;">＋ Adicionar à lista</button></div></div>`;
    return `<div class="sulco-layout">
      <div class="card">
        <div class="card-title">${editando ? "Editar dados do plano" : "Novo plano de ação"}</div>
        <div class="form-grid">
          <div class="field span2"><label for="pl-op">Operação (filial)</label>
            <select id="pl-op">${opOpts}</select>
            <div class="field-hint">${opSel ? "Mostrando só as placas desta operação." : "Opcional: escolha a operação para listar só as placas dela — ou escolha a placa e a operação é preenchida sozinha."}</div></div>
          <div class="field span2"><label for="pl-placa">Veículo (placa)</label>
            <input id="pl-placa" list="pl-placas" value="${escapeHtml(d.placa)}" placeholder="Digite ou escolha a placa" autocomplete="off" style="text-transform:uppercase;">
            <datalist id="pl-placas">${opts}</datalist>${dica}</div>
          <div class="field"><label for="pl-origem">Origem</label><select id="pl-origem">${PLANO_ORIGENS.map((o) => `<option ${d.origem === o ? "selected" : ""}>${o}</option>`).join("")}</select></div>
          <div class="field"><label for="pl-prio">Prioridade</label><select id="pl-prio">${PLANO_PRIORIDADES.map((o) => `<option ${d.prioridade === o ? "selected" : ""}>${o}</option>`).join("")}</select></div>
          <div class="field"><label for="pl-resp">Responsável (operação)</label><select id="pl-resp">${respOpts}</select></div>
          <div class="field"><label for="pl-prazo">Prazo</label><input id="pl-prazo" type="date" value="${escapeHtml(d.prazo)}"></div>
          ${editando ? `<div class="field"><label for="pl-status">Status</label><select id="pl-status">${PLANO_STATUS.map((s) => `<option ${d.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>` : ""}
          ${construtor}
        </div>
        ${state.planoFormErro ? `<div class="banner banner-erro" style="margin-top:12px;">${escapeHtml(state.planoFormErro)}</div>` : ""}
        <div class="form-actions" style="margin-top:16px;">
          <button class="btn btn-primary" id="pl-salvar" ${PlanoStore.ocupado ? "disabled" : ""}>${PlanoStore.ocupado ? "Salvando…" : editando ? "Salvar alterações" : "Salvar plano"}</button>
          <button class="btn" id="pl-cancelar">Cancelar</button>
        </div>
      </div>
      ${lado}
    </div>`;
  }

  // ---------- Ações ----------
  function abrirNovoPlano(o) {
    o = o || {};
    state.panel = "plano"; state.planoView = "form"; state.planoSel = null; state.planoFormErro = "";
    state.filtroFilial = "all"; state.busca = ""; state.selFiliais.clear(); state.sortKey = null; state.sortDir = 1;
    state.planoDraft = { id: "", placa: limpaPlaca(o.placa), op: planoOpDaPlaca(o.placa), texto: o.acao || "", pneus: o.pneus || "", itens: [], prioridade: o.prioridade || "Média",
      responsavel: "", prazo: "", origem: o.origem || "Inspeção física", status: "Aberto" };
    state.sidebarOpen = false; state.planoSkipSync = true;
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("open");
    render();
    window.scrollTo(0, 0);
  }

  function planoEditar(id) {
    const p = PlanoStore.planos.find((x) => x.id === id);
    if (!p) return;
    state.planoView = "form"; state.planoFormErro = "";
    state.planoDraft = { id: p.id, placa: p.placa, op: planoOpDaPlaca(p.placa) || filialSigla(p.filial), texto: "", pneus: "", itens: [], prioridade: p.prioridade, responsavel: p.responsavel,
      prazo: p.prazo, origem: p.origem || "Outro", status: p.status };
    state.planoSkipSync = true;
    render();
    window.scrollTo(0, 0);
  }

  // Move o texto/pneus digitados pra lista de ações do rascunho (devolve true se adicionou algo)
  function planoDraftAdicionarItem() {
    const d = state.planoDraft;
    const texto = String(d.texto || "").trim();
    if (!texto) return false;
    d.itens.push({ texto, pneus: String(d.pneus || "").trim() });
    d.texto = ""; d.pneus = "";
    return true;
  }

  async function planoSalvar() {
    planoSyncDraft();
    const d = state.planoDraft;
    const placa = limpaPlaca(d.placa);
    if (!placa) { state.planoFormErro = "Informe a placa do veículo."; render(); return; }
    if (!d.id) {
      planoDraftAdicionarItem(); // o que ficou digitado e não foi adicionado entra junto
      if (!d.itens.length) { state.planoFormErro = "Descreva pelo menos uma ação (escreva e clique em “Adicionar à lista”, ou só em “Salvar plano”)."; render(); return; }
    }
    state.planoFormErro = "";
    const info = planoVeiculos().get(placa);
    const plano = { id: d.id, placa, filial: info ? info.filial : "", tipo: info ? info.tipo : "",
      prioridade: d.prioridade, responsavel: String(d.responsavel || "").trim(), prazo: d.prazo || "", status: d.status || "Aberto",
      origem: d.origem, criadoPor: state.planoAutor };
    state.planoSkipSync = true; render(); // mostra "Salvando…"
    const ok = await PlanoStore.exec("plano_save", { plano, itens: d.id ? undefined : d.itens });
    if (ok) {
      state.planoView = "lista"; state.planoDraft = null;
      const novo = PlanoStore.planos.find((p) => p.placa === placa && (d.id ? p.id === d.id : true) && p.criadoPor === (d.id ? p.criadoPor : state.planoAutor));
      if (state.planoStatus === "abertos" && novo && PLANO_ABERTOS.indexOf(novo.status) < 0) state.planoStatus = "todos";
      toast("Plano salvo.");
    } else state.planoFormErro = PlanoStore.erro;
    render();
  }

  async function planoAndamento(id) {
    const texto = (document.getElementById("pl-and-texto") || {}).value || "";
    const status = (document.getElementById("pl-and-status") || {}).value || "";
    const p = PlanoStore.planos.find((x) => x.id === id);
    const statusMudou = p && p.status !== status;
    const ok = await PlanoStore.exec("andamento_add", { planoId: id, texto, status: statusMudou ? status : "", autor: state.planoAutor });
    if (ok) toast("Observação registrada.");
    render();
  }

  async function planoItemAdd(planoId) {
    const texto = (document.getElementById("pl-item-texto") || {}).value || "";
    const pneus = (document.getElementById("pl-item-pneus") || {}).value || "";
    const ok = await PlanoStore.exec("item_add", { planoId, texto, pneus: pneus.trim() });
    if (ok) toast("Ação adicionada.");
    render();
    if (ok) { const el = document.getElementById("pl-item-texto"); if (el) el.focus(); }
  }

  // Marca/desmarca já na tela (otimista) e confirma na base; se falhar, volta o que era.
  async function planoItemToggle(itemId, feito) {
    const it = PlanoStore.itens.find((i) => i.id === itemId);
    if (!it) return;
    const antes = { feito: it.feito, feitoEm: it.feitoEm, feitoPor: it.feitoPor };
    it.feito = feito; it.feitoEm = feito ? new Date().toISOString() : ""; it.feitoPor = feito ? state.planoAutor : "";
    render();
    const ok = await PlanoStore.exec("item_toggle", { id: itemId, feito, autor: state.planoAutor });
    if (!ok) { const again = PlanoStore.itens.find((i) => i.id === itemId); if (again) Object.assign(again, antes); }
    render();
  }

  async function planoItemDel(itemId) {
    const it = PlanoStore.itens.find((i) => i.id === itemId);
    if (!it) return;
    if (!window.confirm(`Excluir a ação "${it.texto}"?`)) return;
    await PlanoStore.exec("item_del", { id: itemId });
    render();
  }

  async function planoExcluir(id) {
    const p = PlanoStore.planos.find((x) => x.id === id);
    if (!p) return;
    if (!window.confirm(`Excluir o plano inteiro de ${p.placa} (com todas as ações e observações)?\n\nNão dá para desfazer.`)) return;
    const ok = await PlanoStore.exec("plano_del", { id });
    if (ok) { state.planoSel = null; toast("Plano excluído."); }
    render();
  }

  // ---------- Relatórios ----------
  function toast(msg) {
    const el = document.createElement("div");
    el.className = "toast"; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 2800);
  }
  function planoFiltrosTxt() {
    const partes = [];
    partes.push({ abertos: "Em aberto", atrasados: "Atrasados", todos: "Todos os status" }[state.planoStatus] || state.planoStatus);
    if (state.filtroFilial !== "all") partes.push(filialFullName(state.filtroFilial));
    if (state.busca) partes.push(`busca “${state.busca}”`);
    return partes.join(" · ");
  }
  // Uma linha por AÇÃO (é o que a operação filtra/cobra no Excel); plano sem ações vira 1 linha.
  function planoCsv(lista) {
    const cab = ["Placa", "Filial", "Tipo", "Ação", "Pneus", "Concluída", "Concluída em", "Concluída por", "Prioridade", "Responsável", "Prazo", "Status do plano", "Origem", "Criado por", "Criado em", "Último andamento"];
    const cel = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const linhas = [];
    lista.forEach((p) => {
      const u = planoUltimoAndamento(p.id);
      const comum = [p.prioridade, p.responsavel, p.prazo ? fmtDate(p.prazo) : "", p.status, p.origem, p.criadoPor, fmtDataHora(p.criadoEm), u ? `${u.texto} (${fmtDataHora(u.em)})` : ""];
      const itens = planoItens(p.id);
      const base = [p.placa, filialFullName(p.filial), p.tipo];
      if (!itens.length) linhas.push(base.concat([p.acao, p.pneus, "", "", ""], comum).map(cel).join(";"));
      itens.forEach((i) => linhas.push(base.concat([i.texto, i.pneus, i.feito ? "Sim" : "Não", i.feito ? fmtDataHora(i.feitoEm) : "", i.feitoPor], comum).map(cel).join(";")));
    });
    return "﻿" + [cab.map(cel).join(";")].concat(linhas).join("\r\n");
  }
  function planoWhatsapp(lista) {
    const hoje = fmtDate(hojeIso());
    const blocos = lista.map((p) => {
      const u = planoUltimoAndamento(p.id);
      const itens = planoItens(p.id);
      const f = itens.filter((i) => i.feito).length;
      const linhasItens = itens.length ? itens.map((i) => `${i.feito ? "✅" : "⬜"} ${i.texto}${i.pneus ? ` (pneus: ${i.pneus})` : ""}`).join("\n") : `• ${p.acao || "—"}`;
      return `*${p.placa}* · ${filialSigla(p.filial)} · ${p.prioridade}${p.prazo ? ` · prazo ${fmtDate(p.prazo)}${planoAtrasado(p) ? " (ATRASADO)" : ""}` : ""}\n${linhasItens}\nStatus: ${p.status}${itens.length ? ` (${f}/${itens.length})` : ""}${p.responsavel ? ` · Resp.: ${p.responsavel}` : ""}${u ? `\nObs.: ${u.texto}` : ""}`;
    });
    return `*Plano de Ação – Pneus RAJA* (${hoje})\n${planoFiltrosTxt()}\n\n` + blocos.join("\n\n");
  }
  function baixarArquivo(nome, texto, tipo) {
    const blob = new Blob([texto], { type: tipo });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
  }
  async function copiarTexto(texto) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(texto); return true; } } catch (e) { /* tenta o plano B */ }
    try {
      const ta = document.createElement("textarea");
      ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  function planoImprimir(lista) {
    let area = document.getElementById("print-area");
    if (!area) { area = document.createElement("div"); area.id = "print-area"; document.body.appendChild(area); }
    area.innerHTML = `
      <h1>Plano de Ação — Frota de Pneus RAJA</h1>
      <p>Emitido em ${escapeHtml(fmtDate(hojeIso()))}${state.planoAutor ? ` por ${escapeHtml(state.planoAutor)}` : ""} · ${escapeHtml(planoFiltrosTxt())} · ${lista.length} plano(s)</p>
      <table><thead><tr><th>Placa</th><th>Filial</th><th>Ações (☑ feita / ☐ pendente)</th><th>Prior.</th><th>Responsável</th><th>Prazo</th><th>Status</th><th>Observação</th></tr></thead><tbody>
      ${lista.map((p) => {
        const u = planoUltimoAndamento(p.id);
        const itens = planoItens(p.id);
        const acoes = itens.length ? itens.map((i) => `${i.feito ? "☑" : "☐"} ${escapeHtml(i.texto)}${i.pneus ? ` <i>(pneus ${escapeHtml(i.pneus)})</i>` : ""}`).join("<br>") : escapeHtml(p.acao || "—");
        return `<tr>
        <td><b>${escapeHtml(p.placa)}</b></td><td>${escapeHtml(filialSigla(p.filial))}</td><td>${acoes}</td>
        <td>${escapeHtml(p.prioridade)}</td><td>${escapeHtml(p.responsavel || "—")}</td><td>${p.prazo ? escapeHtml(fmtDate(p.prazo)) : "—"}${planoAtrasado(p) ? " (atrasado)" : ""}</td>
        <td>${escapeHtml(p.status)}${itens.length ? ` (${itens.filter((i) => i.feito).length}/${itens.length})` : ""}</td><td>${u ? escapeHtml(u.texto) + " (" + escapeHtml(fmtDataHora(u.em)) + ")" : "—"}</td></tr>`; }).join("")}
      </tbody></table>`;
    document.body.classList.add("printing");
    const fim = () => { document.body.classList.remove("printing"); window.removeEventListener("afterprint", fim); };
    window.addEventListener("afterprint", fim);
    window.print();
  }

  // ---------- Ligações (eventos) ----------
  function bindPlano() {
    // Em qualquer painel: o botão "Plano de ação" dos cards de veículo + marcação das linhas
    decorarPlanoHooks();
    if (state.panel !== "plano") return;
    const $ = (id) => document.getElementById(id);
    const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach((el) => el.addEventListener(ev, fn));

    on("[data-plano-novo]", "click", () => abrirNovoPlano({}));
    const autor = $("ctl-autor");
    if (autor) autor.addEventListener("input", () => { state.planoAutor = autor.value; lsSet("raja_plano_autor", autor.value); });
    const stF = $("pl-status-filtro");
    if (stF) stF.addEventListener("change", () => { state.planoStatus = stF.value; state.planoSel = null; render(); });
    const pin = $("pl-pin");
    if (pin) pin.addEventListener("change", () => { PlanoStore.pin = pin.value; lsSet("raja_plano_pin", pin.value); });

    on(".plano-row", "click", (ev) => {
      const id = ev.currentTarget.getAttribute("data-plano-id");
      state.planoSel = state.planoSel === id ? null : id;
      render();
    });
    on("[data-plano-and]", "click", (ev) => planoAndamento(ev.currentTarget.getAttribute("data-plano-and")));
    on("[data-plano-edit]", "click", (ev) => planoEditar(ev.currentTarget.getAttribute("data-plano-edit")));
    on("[data-plano-del]", "click", (ev) => planoExcluir(ev.currentTarget.getAttribute("data-plano-del")));
    on("[data-item-toggle]", "click", (ev) => planoItemToggle(ev.currentTarget.getAttribute("data-item-toggle"), ev.currentTarget.getAttribute("data-feito") === "1"));
    on("[data-item-del]", "click", (ev) => planoItemDel(ev.currentTarget.getAttribute("data-item-del")));
    on("[data-item-add]", "click", (ev) => planoItemAdd(ev.currentTarget.getAttribute("data-item-add")));
    const novoTxt = $("pl-item-texto");
    if (novoTxt) novoTxt.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); const b = document.querySelector("[data-item-add]"); if (b) planoItemAdd(b.getAttribute("data-item-add")); }
    });

    const lista = () => planosVisiveis();
    const bp = $("pl-rel-print"); if (bp) bp.addEventListener("click", () => planoImprimir(lista()));
    const bc = $("pl-rel-csv"); if (bc) bc.addEventListener("click", () => { baixarArquivo(`plano_de_acao_${hojeIso()}.csv`, planoCsv(lista()), "text/csv;charset=utf-8"); toast("CSV gerado — abra no Excel."); });
    const bw = $("pl-rel-wpp"); if (bw) bw.addEventListener("click", async () => { toast((await copiarTexto(planoWhatsapp(lista()))) ? "Texto copiado — cole no WhatsApp." : "Não consegui copiar. Use o CSV ou imprimir."); });

    // Formulário
    const pl = $("pl-placa");
    if (pl) pl.addEventListener("change", () => {
      planoSyncDraft();
      const d = state.planoDraft;
      const o = planoOpDaPlaca(d.placa);
      if (o) d.op = o; // placa conhecida: a operação vem sozinha
      state.planoSkipSync = true;
      render();
    });
    const opEl = $("pl-op");
    if (opEl) opEl.addEventListener("change", () => {
      planoSyncDraft();
      const d = state.planoDraft;
      if (d.placa && d.op && planoOpDaPlaca(d.placa) !== d.op) d.placa = ""; // placa de outra operação sai
      state.planoSkipSync = true;
      render();
    });
    on(".btn-modelo", "click", (ev) => {
      planoSyncDraft();
      const d = state.planoDraft;
      d.texto = PLANO_MODELOS[Number(ev.currentTarget.getAttribute("data-modelo"))].replace("{pneus}", String(d.pneus || "").trim() || "___");
      state.planoSkipSync = true;
      render();
      const el = $("pl-acao"); if (el) el.focus();
    });
    on(".chip-pick", "click", (ev) => {
      planoSyncDraft();
      const n = ev.currentTarget.getAttribute("data-pneu");
      const s = planoPneusSet(state.planoDraft.pneus);
      if (s.has(n)) s.delete(n); else s.add(n);
      state.planoDraft.pneus = Array.from(s).join(", ");
      state.planoSkipSync = true;
      render();
    });
    on("[data-mapa]", "click", (ev) => { planoSyncDraft(); state.planoMapa = ev.currentTarget.getAttribute("data-mapa"); state.planoSkipSync = true; render(); });
    const add = $("pl-add-item");
    if (add) add.addEventListener("click", () => {
      planoSyncDraft();
      if (!planoDraftAdicionarItem()) { state.planoFormErro = "Escreva a ação antes de adicionar à lista."; }
      else state.planoFormErro = "";
      state.planoSkipSync = true;
      render();
      const el = $("pl-acao"); if (el) el.focus();
    });
    on("[data-draft-del]", "click", (ev) => {
      planoSyncDraft();
      state.planoDraft.itens.splice(Number(ev.currentTarget.getAttribute("data-draft-del")), 1);
      state.planoSkipSync = true;
      render();
    });
    const sv = $("pl-salvar"); if (sv) sv.addEventListener("click", planoSalvar);
    const cn = $("pl-cancelar"); if (cn) cn.addEventListener("click", () => { state.planoView = "lista"; state.planoDraft = null; state.planoFormErro = ""; render(); });
  }

  // Nos painéis de veículo (Sulco / Pressão / Vazias): marca cards e linhas com a placa e a
  // origem (pro menu do botão direito) e põe um botão visível "Criar plano de ação" no card —
  // o botão direito é o atalho, mas o botão evita depender de descobrir o gesto.
  const PLANO_ORIGEM_PAINEL = { sulco: "Sulco baixo", pressao: "Pressão de ar", vazias: "Posição vazia" };
  function decorarPlanoHooks() {
    const origem = PLANO_ORIGEM_PAINEL[state.panel];
    if (!origem) return;
    document.querySelectorAll(".sulco-row[data-veiculo], .pressao-fora-row[data-veiculo]").forEach((tr) => {
      tr.setAttribute("data-plano-placa", tr.getAttribute("data-veiculo")); tr.setAttribute("data-plano-origem", origem);
    });
    document.querySelectorAll(".vazias-row[data-placa]").forEach((tr) => {
      tr.setAttribute("data-plano-placa", tr.getAttribute("data-placa")); tr.setAttribute("data-plano-origem", origem);
    });
    document.querySelectorAll(".detail-card .detail-plate").forEach((el) => {
      const card = el.closest(".detail-card");
      const placa = limpaPlaca(el.textContent);
      card.setAttribute("data-plano-placa", placa); card.setAttribute("data-plano-origem", origem);
      if (card.querySelector(".btn-plano-card")) return;
      const b = document.createElement("button");
      b.className = "btn btn-sm btn-plano-card"; b.textContent = "＋ Criar plano de ação para este veículo";
      b.addEventListener("click", () => abrirNovoPlano({ placa, origem }));
      const sub = card.querySelector(".detail-sub") || el;
      sub.parentNode.insertBefore(b, sub.nextSibling);
    });
  }

  // Menu do botão direito (fora do #main pra render() não apagar)
  function fecharMenuPlano() { const m = document.getElementById("ctx-menu"); if (m) m.remove(); }
  function setupPlanoContextMenu() {
    document.addEventListener("contextmenu", (ev) => {
      const host = ev.target.closest ? ev.target.closest("[data-plano-placa]") : null;
      if (!host) { fecharMenuPlano(); return; }
      ev.preventDefault();
      fecharMenuPlano();
      const placa = host.getAttribute("data-plano-placa");
      const origem = host.getAttribute("data-plano-origem") || "Outro";
      const chip = ev.target.closest(".tire-chip[data-pneu]");
      const itens = [];
      if (chip) {
        const pneu = chip.getAttribute("data-pneu"), pos = chip.getAttribute("data-posicao") || "";
        const sulco = chip.getAttribute("data-sulco"), psi = chip.getAttribute("data-psi");
        let acao = `Pneu nº ${pneu} (posição ${pos}): `;
        if (sulco) acao = `Trocar pneu nº ${pneu} (posição ${pos}) — sulco ${sulco} mm`;
        else if (psi) acao = `Calibrar pneu nº ${pneu} (posição ${pos}) — pressão atual ${psi} psi`;
        itens.push({ txt: `Criar plano para o pneu nº ${pneu} (${pos})`, fn: () => abrirNovoPlano({ placa, origem, pneus: pneu, acao, prioridade: sulco && Number(sulco) <= 3 ? "Alta" : "Média" }) });
      }
      itens.push({ txt: `Criar plano de ação para o veículo ${placa}`, fn: () => abrirNovoPlano({ placa, origem }) });
      const menu = document.createElement("div");
      menu.id = "ctx-menu"; menu.className = "ctx-menu";
      itens.forEach((it) => {
        const b = document.createElement("button");
        b.textContent = it.txt;
        b.addEventListener("click", () => { fecharMenuPlano(); it.fn(); });
        menu.appendChild(b);
      });
      document.body.appendChild(menu);
      const w = menu.offsetWidth || 260, h = menu.offsetHeight || 80;
      menu.style.left = Math.max(4, Math.min(ev.clientX, window.innerWidth - w - 8)) + "px";
      menu.style.top = Math.max(4, Math.min(ev.clientY, window.innerHeight - h - 8)) + "px";
    });
    document.addEventListener("click", (ev) => { if (!ev.target.closest || !ev.target.closest("#ctx-menu")) fecharMenuPlano(); });
    document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") fecharMenuPlano(); });
    window.addEventListener("scroll", fecharMenuPlano, { passive: true });
  }

  async function planoInit() {
    setupPlanoContextMenu();
    if (PlanoStore.modo === "api") { PlanoStore.carregando = true; render(); }
    await PlanoStore.carregar();
    render();
  }

    return `
